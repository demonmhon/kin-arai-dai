sources:
  - name: สมาคมโรคไตแห่งประเทศไทย (แถลงการณ์เตือนประชาชนเรื่องการใช้ถั่งเช่าในผู้ป่วยโรคไต)
    url: https://www.nephrothai.org/
  - name: กรมการแพทย์ กระทรวงสาธารณสุข
    url: https://www.dms.go.th/
  - name: โรงพยาบาลรามาธิบดี คณะแพทยศาสตร์
    url: https://www.rama.mahidol.ac.th/ramachannel/
diseases:
  ckd:
    reason: สมาคมโรคไตแห่งประเทศไทยและกระทรวงสาธารณสุขได้ออกประกาศเตือนประชาชนอย่างเป็นทางการว่า "การโฆษณาว่าถั่งเช่าช่วยรักษาโรคไต ชะลอไตเสื่อม หรือฟอกไตหายได้ ไม่เป็นความจริง และเป็นอันตรายอย่างยิ่ง" ในทางคลินิกมีรายงานทางการแพทย์พบผู้ป่วยโรคไตเรื้อรังที่รับประทานถั่งเช่าสกัดแล้วเกิด "ภาวะไตวายเฉียบพลันซ้ำเติม (Acute-on-Chronic Kidney Injury)" จนต้องถูกส่งตัวเข้าห้องฉุกเฉินเพื่อฟอกเลือดล้างไตทันที เนื่องจาก 1. ถั่งเช่ามีโพแทสเซียมสูงมาก 2. มีสารออกฤทธิ์ทางเภสัชวิทยา (Cordycepin, Adenosine) ในระดับเข้มข้นที่ไตของผู้ป่วยขับออกไม่ได้จนเกิดพิษคั่ง 3. ผลิตภัณฑ์ถั่งเช่าในท้องตลาดมักตรวจพบสารปนเปื้อนของโลหะหนัก โดยเฉพาะ "สารหนู (Arsenic)" และสารเคมีตกค้างจากการเพาะเลี้ยง ซึ่งมีพิษทำลายเซลล์กรองไตโดยตรง
    tags:
      - ห้ามในโรคไตทุกระยะ
      - เสี่ยงไตวายฉับพลัน
      - พิษโลหะหนักปนเปื้อน
      - คำเตือนทางการแพทย์ระดับประเทศ
    stages:
      stage1_2:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สมาคมโรคไตแห่งประเทศไทยเตือนว่าไม่ควรรับประทานเพื่อบำรุงไต เสี่ยงทำให้ไตเสื่อมสภาพเร็วขึ้นอย่างคาดไม่ถึง
      stage3:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด ไตที่เริ่มเสื่อมสภาพจะไม่สามารถขับสารออกฤทธิ์และสารตกค้างได้ เสี่ยงทำให้ไตวายเข้าสู่ระยะสุดท้ายอย่างรวดเร็ว
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด มีหลักฐานทางการแพทย์พบผู้ป่วยไตระยะ 4-5 ทรุดหนักจนต้องฟอกเลือดฉุกเฉินจากการรับประทานถั่งเช่า
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายถึงชีวิต ไตไม่ทำงานแล้ว สารสกัดและโพแทสเซียมจะคั่งสะสมในเลือดจนเกิดภาวะหัวใจวาย
  gout:
    reason: ถั่งเช่ามีสารประกอบกลุ่มนิวคลีโอไซด์ (Nucleosides) และพิวรีนในระดับสูง เช่น Adenosine ซึ่งเมื่อเข้าสู่กระบวนการเผาผลาญในร่างกายจะถูกเปลี่ยนสภาพเป็น "กรดยูริก" โดยตรง อีกทั้งการที่ถั่งเช่าอาจรบกวนการทำงานของไตจะยิ่งลดความสามารถในการขับถ่ายกรดยูริกทางปัสสาวะ
    tags:
      - พิวรีนสูง
      - สารอนุพันธ์นิวคลีโอไซด์
      - กระตุ้นยูริกในเลือด
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง สารกลุ่มนิวคลีโอไซด์ในถั่งเช่าสามารถเปลี่ยนรูปเป็นกรดยูริกในเลือดได้โดยตรง เสี่ยงต่อการสะสมผลึกยูริกตามข้อ
      gout_flare:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด จะเพิ่มปริมาณกรดยูริกและกระตุ้นให้อาการข้ออักเสบ ปวด บวม แดง กำเริบหนักขึ้น
  cholecystectomy:
    reason: ถั่งเช่ามีสารที่ออกฤทธิ์ต้านการเกาะกลุ่มของเกล็ดเลือด (Anti-platelet activity) เล็กน้อย จึงต้องระมัดระวังเป็นพิเศษในผู้ที่เพิ่งเข้ารับการผ่าตัด
    tags:
      - ฤทธิ์ต้านการเกาะกลุ่มเกล็ดเลือด
      - ระวังภาวะเลือดออกหลังผ่าตัด
    stages:
      chole_maintenance:
        level: caution
        advice: หากต้องการรับประทานควรปรึกษาแพทย์ และไม่ควรรับประทานในปริมาณที่สูงเกินคำแนะนำ
      chole_recovery:
        level: danger
        advice: ห้ามรับประทานในช่วงพักฟื้นหลังผ่าตัดเด็ดขาด เนื่องจากสารสกัดถั่งเช่าอาจรบกวนการแข็งตัวของเลือดและเพิ่มความเสี่ยงต่อภาวะเลือดออกบริเวณแผลผ่าตัด
