sources:
  - name: สมาคมโรคไตแห่งประเทศไทย (คำเตือนการบริโภคสมุนไพรและผลิตภัณฑ์เสริมอาหารในผู้ป่วยโรคไต)
    url: https://www.nephrothai.org/
  - name: โรงพยาบาลศิริราช ปิยมหาราชการุณย์
    url: https://www.siphhospital.com/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: สมาคมโรคไตแห่งประเทศไทยได้ออกคำเตือนทางการแพทย์อย่างต่อเนื่องว่า "ไม่มีเห็ดสกัดหรือสมุนไพรใดที่ได้รับการพิสูจน์ทางการแพทย์ว่าช่วยรักษาโรคไตเสื่อมหรือฟื้นฟูไตวายได้จริง" ในทางตรงกันข้าม สารสกัดเข้มข้นจากเห็ดหลินจือมีความเสี่ยงร้ายแรงต่อผู้มีภาวะไต 2 ประการ คือ 1. เห็ดธรรมชาติมีแร่ธาตุ "โพแทสเซียมสูงมาก" เมื่อนำมาสกัดเข้มข้นในรูปแบบแคปซูล ผง หรือยาน้ำ จะทำให้โพแทสเซียมเข้มข้นยิ่งขึ้น จนทำให้เกิดภาวะโพแทสเซียมในเลือดสูงวิกฤต (Hyperkalemia) ซึ่งทำให้หัวใจเต้นผิดจังหวะและหัวใจหยุดเต้นได้ 2. สารออกฤทธิ์ทางชีวภาพ สารตกค้าง หรือโลหะหนักในการเพาะเลี้ยงเห็ด อาจทำให้เกิด "ภาวะไตวายเฉียบพลันซ้ำเติม (Acute-on-Chronic Kidney Injury)" ส่งผลให้ค่าไต (eGFR) ทรุดฮวบลงอย่างรวดเร็วจนต้องฟอกเลือดฉุกเฉิน
    tags:
      - โพแทสเซียมสูงจัด
      - เสี่ยงไตวายเฉียบพลัน
      - คำเตือนจากสมาคมโรคไต
      - ห้ามในไตระยะ 3-5
    stages:
      stage1_2:
        level: caution
        advice: ไม่แนะนำให้รับประทานเพื่อจุดประสงค์ในการบำรุงไตเด็ดขาด หากต้องการรับประทานเพื่อสุขภาพด้านอื่น ควรปรึกษาแพทย์เฉพาะทางโรคไตและตรวจติดตามค่าการทำงานของไตอย่างสม่ำเสมอ
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สารสกัดเข้มข้นและโพแทสเซียมที่สูงจะเพิ่มภาระอย่างหนักต่อไตที่ประสิทธิภาพการกรองลดลง และเร่งให้โรคไตเข้าสู่ระยะสุดท้ายเร็วขึ้น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด อันตรายถึงชีวิตจากภาวะโพแทสเซียมคั่งในกระแสเลือดและไตวายเฉียบพลัน มีรายงานผู้ป่วยต้องฟอกไตฉุกเฉินจากการทานเห็ดหลินจือสกัด
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ไตไม่สามารถขับสารสกัดและแร่ธาตุโพแทสเซียมออกได้ เสี่ยงต่อภาวะหัวใจหยุดเต้น
  gout:
    reason: เห็ดและสปอร์เห็ดจัดเป็นพืชที่มีสารพิวรีนระดับปานกลาง เมื่อนำมาผ่านกระบวนการสกัดเข้มข้น ปริมาณสารพิวรีนและอนุพันธ์นิวคลีโอไซด์จะมีความหนาแน่นขึ้น อีกทั้งสารสกัดสมุนไพรเข้มข้นอาจรบกวนประสิทธิภาพของไตในการขับกรดยูริกออกจากร่างกาย
    tags:
      - พิวรีนปานกลางถึงสูง
      - ระวังช่วงกำเริบ
    stages:
      gout_remission:
        level: caution
        advice: ควรระมัดระวัง ไม่ควรรับประทานติดต่อกันเป็นเวลานาน หากรับประทานควรดื่มน้ำเปล่าตามมากๆ วันละ 2-3 ลิตร เพื่อช่วยขับกรดยูริก
      gout_flare:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาดในช่วงที่ข้ออักเสบกำเริบ เพื่อป้องกันไม่ให้สารสกัดไปกระตุ้นหรือขัดขวางการขับกรดยูริก
  cholecystectomy:
    reason: สารสกัดเห็ดหลินจือไม่มีไขมัน จึงไม่ได้กระตุ้นอาการท้องเสียจากไขมันโดยตรง แต่สารสกัดสมุนไพรเข้มข้นอาจส่งผลกระทบต่อเอนไซม์ตับและการบีบตัวของลำไส้ในผู้ที่เพิ่งผ่าตัด
    tags:
      - ไร้ไขมัน
      - สารสกัดเข้มข้น
    stages:
      chole_maintenance:
        level: safe
        advice: รับประทานได้ตามคำแนะนำของผลิตภัณฑ์หรือแพทย์ประจำตัว ระวังไม่รับประทานในปริมาณที่สูงเกินเกณฑ์
      chole_recovery:
        level: caution
        advice: ในช่วงพักฟื้นหลังผ่าตัดควรหยุดรับประทานอาหารเสริมสมุนไพรเข้มข้นชั่วคราว เพื่อป้องกันการรบกวนการทำงานของตับ ทางเดินอาหาร และยารักษาแผลผ่าตัด
