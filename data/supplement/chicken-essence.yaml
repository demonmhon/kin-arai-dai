diseases:
  ckd:
    reason: ซุปไก่สกัดได้จากการเคี่ยวตุ๋นเนื้อและโครงไก่ด้วยความดันและความร้อนสูงเป็นเวลานาน ทำให้แร่ธาตุในเนื้อและกระดูกละลายออกมาเข้มข้น โดยเฉพาะ "โพแทสเซียม" (สูงถึง 150 - 250 มก. ต่อขวดเล็ก), "ฟอสฟอรัส" และ "โซเดียม" อีกทั้งยังมีสารอนุพันธ์ไนโตรเจน เปปไทด์ และกรดอะมิโนอิสระที่เมื่อเผาผลาญแล้วจะสร้างของเสียยูเรีย (BUN) ให้ไตต้องขับออกอย่างหนัก ผู้มีภาวะไตระยะ 3-5 การขับโพแทสเซียมลดลงอย่างมาก เสี่ยงต่อภาวะโพแทสเซียมในเลือดสูงวิกฤต (Hyperkalemia) ซึ่งอาจทำให้หัวใจเต้นผิดจังหวะหรือหัวใจวายฉับพลันได้
    tags:
      - โพแทสเซียมสูงจัด
      - ฟอสฟอรัสสูง
      - ภาระของเสียต่อไต
      - เสี่ยงหัวใจวาย
    stages:
      stage1_2:
        level: caution
        advice: ดื่มแต่น้อยเป็นครั้งคราว ไม่แนะนำให้ดื่มเป็นประจำทุกวัน แนะนำรับประทานโปรตีนสดคุณภาพดีจากเนื้อปลาหรือไข่ขาวจะปลอดภัยต่อไตมากกว่า
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง แร่ธาตุโพแทสเซียมและฟอสฟอรัสที่ละลายเข้มข้นจะสะสมในกระแสเลือดและเร่งให้ไตทำงานหนักขึ้น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด เสี่ยงต่อภาวะโพแทสเซียมคั่งในเลือดสูงรุนแรง (Hyperkalemia) ทำให้หัวใจเต้นผิดจังหวะและอาจเป็นอันตรายถึงชีวิต
      dialysis:
        level: caution
        advice: แม้ผู้ที่อยู่ในระยะฟอกไตจะต้องการโปรตีนสูงขึ้น แต่ซุปไก่สกัดมีโพแทสเซียมและโซเดียมแฝง แนะนำเสริมโปรตีนจากไข่ขาวต้มหรืออาหารทางการแพทย์เฉพาะโรคไตตามแพทย์สั่งจะปลอดภัยกว่ามาก
  gout:
    reason: ซุปไก่สกัดเป็น "อาหารกลุ่มที่มีสารพิวรีนสูงจัดมาก (Very High Purine)" ตามประกาศของสมาคมรูมาติสซั่มแห่งประเทศไทย เนื่องจากสารพิวรีนในเนื้อสัตว์และไขกระดูกจะละลายออกมาในน้ำซุปได้อย่างสมบูรณ์ การดื่มซุปไก่สกัดจะทำให้ระดับกรดยูริกในกระแสเลือดพุ่งสูงขึ้นอย่างรวดเร็วและกระตุ้นให้เกิดข้ออักเสบเฉียบพลันรุนแรง
    tags:
      - พิวรีนสูงจัดมาก
      - กระตุ้นข้ออักเสบเฉียบพลัน
      - ยูริกในเลือดพุ่ง
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยงอย่างยิ่ง เป็นอาหารพิวรีนสูงจัดที่กระตุ้นให้ระดับกรดยูริกสะสมสูงขึ้นและเสี่ยงต่อการกำเริบซ้ำ
      gout_flare:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด จะเร่งให้การอักเสบ ปวด บวม แดง ร้อนบริเวณข้อยิ่งทวีความรุนแรงมากขึ้นทันที
  cholecystectomy:
    reason: ซุปไก่สกัดแท้ส่วนใหญ่ผ่านกระบวนการเหวี่ยงแยกไขมันออกจนหมด (0% Fat) จึงไม่มีไขมันที่ต้องพึ่งพาน้ำดีในการย่อย
    tags:
      - ปราศจากไขมัน
      - ย่อยง่าย
    stages:
      chole_maintenance:
        level: safe
        advice: ดื่มได้ตามปกติ ไม่มีไขมันไปรบกวนระบบทางเดินอาหาร
      chole_recovery:
        level: caution
        advice: ในช่วง 1-2 สัปดาห์แรกหลังผ่าตัด แนะนำจิบแต่น้อยหรือผสมน้ำอุ่น เนื่องจากความเข้มข้นของสารสกัดอาจกระตุ้นการบีบตัวของกระเพาะและลำไส้ในบางราย
