diseases:
  ckd:
    reason: เบต้ากลูแคนจากเห็ด (เช่น เห็ดชิตาเกะ, ไมตาเกะ, ยามาบูชิตาเกะ) เป็นสารกลุ่มโพลีแซคคาไรด์เชิงซ้อนที่นิยมใช้เสริมสร้างการทำงานของเม็ดเลือดขาว แต่สำหรับผู้มีภาวะไตเรื้อรัง ต้องระมัดระวัง 2 ประการ คือ 1. เห็ดทุกชนิดมีแร่ธาตุ "โพแทสเซียมสูง" หากเป็นสารสกัดบริสุทธิ์ต่ำหรือแบบผงต้มเข้มข้น อาจมีปริมาณโพแทสเซียมปนเปื้อนสูง 2. รูปแบบเม็ดฟู่หรือผงชงดื่มบางชนิดมีการเติม "โซเดียมหรือสารปรุงแต่งกลิ่นรส" ที่อาจสร้างภาระต่อไต จึงจำเป็นต้องตรวจสอบฉลากโภชนาการอย่างละเอียด
    tags:
      - ระวังโพแทสเซียมแฝง
      - ตรวจสอบโซเดียมในเม็ดฟู่/ผงชง
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้ตามขนาดที่ฉลากระบุ ควรเลือกสารสกัดเบต้ากลูแคนที่บริสุทธิ์สูง และหลีกเลี่ยงรูปแบบเม็ดฟู่ที่มีโซเดียมสูง
      stage3:
        level: caution
        advice: ควรปรึกษาแพทย์เฉพาะทางก่อนรับประทาน ตรวจสอบปริมาณโพแทสเซียมและฟอสฟอรัสบนฉลากอาหารเสริม ไม่ควรรับประทานปริมาณสูงติดต่อกัน
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยง ไตในระยะนี้มีความเสี่ยงสูงต่อการสะสมของแร่ธาตุและสารเคมีที่ไม่จำเป็น ควรเน้นการควบคุมอาหารทางการแพทย์ตามที่แพทย์กำหนด
      dialysis:
        level: caution
        advice: หากต้องการเสริมภูมิคุ้มกัน ควรปรึกษาแพทย์ผู้ดูแลเพื่อตรวจสอบความบริสุทธิ์ของสารสกัด และระวังปริมาณน้ำที่ใช้ชงดื่ม
  gout:
    reason: สารสกัดเบต้ากลูแคนที่ผ่านการสกัดและทำให้บริสุทธิ์จะแยกเอาโปรตีนและสารพิวรีนในเห็ดออกไปเกือบหมด จึงมีความปลอดภัยต่อระดับกรดยูริกมากกว่าการรับประทานเห็ดสดทั้งดอก แต่ควรเลือกผลิตภัณฑ์ที่มีมาตรฐานการผลิตและไม่มีการผสมพืชตระกูลพิวรีนสูงอื่นๆ
    tags:
      - สารสกัดบริสุทธิ์พิวรีนต่ำ
      - เลี่ยงสูตรผสมสารอื่น
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้ตามปกติเพื่อเสริมสร้างภูมิต้านทาน โดยเลือกผลิตภัณฑ์ที่ระบุความบริสุทธิ์ของเบต้ากลูแคนชัดเจน
      gout_flare:
        level: safe
        advice: รับประทานได้ ไม่ได้เป็นตัวกระตุ้นกรดยูริกโดยตรง แต่ควรเน้นการดื่มน้ำสะอาดมากๆ ในช่วงที่มีอาการอักเสบ
  cholecystectomy:
    reason: เบต้ากลูแคนเป็นเส้นใยอาหารชนิดละลายน้ำ ไม่มีไขมัน และอาจช่วยปรับสมดุลจุลินทรีย์ในลำไส้ (Gut Microbiome) ซึ่งเป็นประโยชน์ต่อผู้ที่ระบบทางเดินอาหารมีการปรับตัวหลังผ่าตัดถุงน้ำดี
    tags:
      - ใยอาหารละลายน้ำ
      - ปราศจากไขมัน
      - สมดุลลำไส้
    stages:
      chole_maintenance:
        level: safe
        advice: รับประทานได้ตามปกติ เป็นใยอาหารที่ไม่มีไขมันรบกวนทางเดินอาหาร
      chole_recovery:
        level: safe
        advice: รับประทานได้ ช่วยดูแลระบบภูมิคุ้มกันและทางเดินอาหาร เริ่มรับประทานในปริมาณน้อยเพื่อสังเกตการขับถ่าย
