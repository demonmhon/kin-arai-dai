id: mushroom-beta-glucan
name: เบต้ากลูแคน / สารสกัดเห็ดทางการแพทย์ (Mushroom Beta-Glucan)
category: supplement
categoryName: อาหารเสริม/ผลิตภัณฑ์บำรุงสุขภาพ
icon: 🧪
