diseases:
  ckd:
    reason: เนื้อรังนกแท้ตามธรรมชาติมีส่วนประกอบของไกลโคโปรตีน กรดไซอาลิก (Sialic acid) และกรดอะมิโน มีแร่ธาตุโพแทสเซียมและฟอสฟอรัสในระดับต่ำถึงปานกลาง แต่จุดที่ต้องระวังอย่างยิ่งสำหรับผู้มีภาวะไตคือ "น้ำตาลกรวดหรือน้ำเชื่อม" ที่เติมในรังนกสำเร็จรูปทั่วไป ซึ่งมักมีน้ำตาลสูงถึง 10 - 15 กรัมต่อขวด (เกือบ 3-4 ช้อนชา) ส่งผลให้ระดับน้ำตาลในเลือดสูงและไตเสื่อมเร็วขึ้น อีกทั้งรังนกสำเร็จรูปบางยี่ห้ออาจมีสารคงสภาพหรือวัตถุกันเสียที่มีฟอสเฟตแฝง นอกจากนี้ในผู้มีภาวะไตระยะท้ายและฟอกไต ปริมาตรของเหลวในขวดจะต้องถูกนับรวมในโควตาน้ำดื่มจำกัดต่อวันอย่างเคร่งครัด
    tags:
      - ระวังน้ำตาลกรวดสูง
      - เลือกสูตรไม่มีน้ำตาล
      - นับรวมในโควตาน้ำดื่ม
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้เป็นครั้งคราว แนะนำเลือกสูตรที่ไม่เติมน้ำตาล (Sugar-Free) หรือใช้สารให้ความหวานทดแทน เพื่อป้องกันผลกระทบต่อระดับน้ำตาลในเลือด
      stage3:
        level: caution
        advice: รับประทานแต่น้อยและควรเลือกเฉพาะสูตรปราศจากน้ำตาล ระวังน้ำตาลสะสมและสารปรุงแต่งฟอสเฟตในผลิตภัณฑ์สำเร็จรูป
      stage4_5_pre:
        level: caution
        advice: หากต้องการรับประทาน ต้องเลือกสูตรไม่มีน้ำตาลเท่านั้น และต้องนับปริมาตรน้ำในขวดรวมในโควตาน้ำดื่มจำกัดต่อวันเพื่อป้องกันอาการบวมน้ำ
      dialysis:
        level: caution
        advice: เลือกเฉพาะสูตรไม่เติมน้ำตาล และจำเป็นต้องหักลบปริมาณของเหลวในขวดออกจากโควตาน้ำดื่มจำกัดต่อวันอย่างเคร่งครัด เพื่อป้องกันภาวะน้ำเกินและน้ำท่วมปอด
  gout:
    reason: รังนกแท้มีสารพิวรีนต่ำมาก ไม่ได้เป็นแหล่งกระตุ้นกรดยูริกโดยตรง แต่สิ่งที่ผู้มีภาวะเกาต์ต้องระวังคือ "น้ำตาลฟรุกโตสและน้ำเชื่อม" ในรังนกสำเร็จรูปสูตรหวานทั่วไป น้ำตาลฟรุกโตสจะเร่งกระบวนการสลายสาร ATP ในตับ ส่งผลให้ร่างกายสร้างกรดยูริกในกระแสเลือดเพิ่มสูงขึ้นได้
    tags:
      - พิวรีนต่ำมาก
      - ระวังน้ำตาลฟรุกโตสแฝง
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้ แนะนำเลือกสูตรหวานน้อยหรือสูตรไม่มีน้ำตาล เพื่อไม่ให้ฟรุกโตสไปกระตุ้นการสร้างกรดยูริกในตับ
      gout_flare:
        level: caution
        advice: ช่วงข้ออักเสบควรหลีกเลี่ยงรังนกสูตรหวานจัด หากต้องการรับประทานให้เลือกสูตรไม่เติมน้ำตาล และดื่มน้ำเปล่าให้เพียงพอ
  cholecystectomy:
    reason: รังนกแท้ไม่มีส่วนประกอบของไขมัน ย่อยง่าย ไม่ต้องพึ่งพาน้ำดีในการแตกตัว เป็นอาหารเสริมที่ระบบทางเดินอาหารดูดซึมได้ดี
    tags:
      - ไขมัน 0%
      - ย่อยง่าย
      - เหมาะสำหรับผู้พักฟื้น
    stages:
      chole_maintenance:
        level: safe
        advice: รับประทานได้ตามปกติ ไม่มีไขมันไปรบกวนระบบการย่อยอาหาร
      chole_recovery:
        level: safe
        advice: เหมาะเป็นอาหารเสริมฟื้นฟูร่างกายหลังการผ่าตัด ย่อยง่าย ไม่ระคายเคืองกระเพาะและลำไส้ แนะนำเลือกสูตรหวานน้อย
