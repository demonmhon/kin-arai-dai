diseases:
  ckd:
    reason: น้ำอัดลมสีเข้มใส่กรดฟอสฟอริกสังเคราะห์ ร่างกายดูดซึมได้ 100% เร่งให้กระดูกพรุนและหลอดเลือดแข็งตัวอย่างรวดเร็ว ส่วนโกโก้มีฟอสฟอรัสธรรมชาติสูงมาก
    stages:
      stage1_2:
        level: caution
        advice: ลดให้น้อยลง มีน้ำตาลและฟอสเฟตสูง
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: ห้ามดื่มเด็ดขาด
      dialysis:
        level: danger
        advice: ห้ามดื่มเด็ดขาด ฟอสเฟตดูดซึมทันทีและฟอกออกยาก
  gout:
    reason: น้ำอัดลมมีน้ำตาลฟรุกโตสเข้มข้น (High Fructose Corn Syrup) ซึ่งฟรุกโตสเร่งกระบวนการสลาย ATP ในตับ ทำให้ร่างกายผลิตกรดยูริกพุ่งสูงขึ้นอย่างรวดเร็ว
    tags:
      - ฟรุกโตสสูงจัด
      - กระตุ้นยูริกพุ่งสูง
      - อันตรายต่อเกาต์
      - งดเด็ดขาด
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด น้ำตาลฟรุกโตสกระตุ้นให้ตับผลิตกรดยูริกเพิ่มขึ้นทันที
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% ตัวเร่งให้ข้ออักเสบรุนแรงและหายช้าลง
