diseases:
  ckd:
    reason: ชาไทยใส่นม (ชาเย็น) 1 แก้ว มีส่วนผสมหลักคือนมข้นหวาน นมข้นจืด และครีมเทียม ซึ่งมีฟอสเฟตสังเคราะห์ (Inorganic phosphate) สูงจัด ร่างกายดูดซึมได้ 100% เต็ม เร่งให้เกิดภาวะฟอสเฟตในเลือดสูง กระดูกพรุนเปราะ และหลอดเลือดหัวใจแข็งตัวอย่างรวดเร็ว อีกทั้งยังมีน้ำตาลสูงจัดและโพแทสเซียมในใบชาเข้มข้น หากอยากดื่ม แนะนำเลือก 'ชาดำเย็นหวานน้อยมาก' หรือชาชงใสไม่ใส่นม
    tags:
      - ฟอสเฟตสังเคราะห์ดูดซึม 100%
      - นมข้นหวานและครีมเทียม
      - น้ำตาลสูงจัด
    stages:
      stage1_2:
        level: caution
        advice: ควรหลีกเลี่ยงสูตรใส่นมข้น หากอยากดื่มให้เลือกชาดำเย็นหวานน้อย ไม่ใส่นมข้น/ครีมเทียม
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ฟอสฟอรัสจากนมข้นหวานและครีมเทียมเกินเกณฑ์ความปลอดภัยของไต
      stage4_5_pre:
        level: danger
        advice: ห้ามดื่มเด็ดขาด ฟอสฟอรัสสูงจัดสะสมในกระแสเลือดและน้ำตาลสูงเพิ่มความดันและภาระไต
      dialysis:
        level: danger
        advice: ห้ามดื่มเด็ดขาด ฟอสเฟตสังเคราะห์ในชาเย็นกำจัดออกได้ยากมากในการฟอกเลือด และทำให้น้ำตาลพุ่งสูง
  gout:
    reason: ชาไทยใส่นมมีน้ำตาลทราย นมข้นหวาน และน้ำเชื่อมเข้มข้น น้ำตาลฟรุกโตสปริมาณมหาศาลจะกระตุ้นให้ตับสลายสาร ATP กลายเป็นกรดยูริกในกระแสเลือดอย่างรวดเร็ว และไขมันจากนมข้นจะไปชะลอการขับถ่ายกรดยูริกออกทางไต
    tags:
      - ฟรุกโตสกระตุ้นตับสร้างยูริก
      - ไขมันชะลอการขับยูริก
      - เสี่ยงข้ออักเสบกำเริบ
    stages:
      gout_remission:
        level: caution
        advice: ควรหลีกเลี่ยงชาเย็นใส่นมข้นหวาน หากต้องการดื่มให้เลือกชาดำเย็นหวานน้อยมาก และดื่มน้ำตามมากๆ
      gout_flare:
        level: danger
        advice: งดดื่มเด็ดขาดช่วงข้ออักเสบ ความหวานเข้มข้นและไขมันจะกระตุ้นให้อาการปวดบวมรุนแรงขึ้นทันที
