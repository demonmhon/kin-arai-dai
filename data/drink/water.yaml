id: water
name: น้ำเปล่าสะอาด
category: drink
categoryName: เครื่องดื่ม/ของหวาน
icon: 💧
tags:
  - ไม่มีสารตกค้าง
  - แร่ธาตุ 0%
keywords:
  - น้ำเปล่า
  - น้ำดื่ม
  - น้ำ
  - เครื่องดื่ม
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: น้ำเปล่าสะอาดเป็นของเหลวที่ดีที่สุด ช่วยขับสารพิษโดยไม่เพิ่มภาระแร่ธาตุใดๆ ให้ไต
    stages:
      stage1_2:
        level: safe
        advice: ดื่มได้ปกติ 1.5 - 2 ลิตร/วัน
      stage3:
        level: safe
        advice: ดื่มได้ 1.5 - 2 ลิตร (หากไม่มีอาการบวม)
      stage4_5_pre:
        level: caution
        advice: ดื่มได้ตามปริมาณปัสสาวะ + 500 มล. ระวังอาการบวมน้ำและน้ำท่วมปอด
      dialysis:
        level: caution
        advice: ต้องจำกัดน้ำเข้มงวด ชั่งน้ำหนักทุกวันเพื่อไม่ให้น้ำหนักเกิน 1-1.5 กก. ระหว่างรอบฟอก
  gout:
    reason: น้ำเปล่าคือยาขับกรดยูริกที่ดีและปลอดภัยที่สุด การดื่มน้ำเพียงพอช่วยละลายผลึกยูเรตและเร่งการขับออกทางปัสสาวะ ป้องกันโรคนิ่วในไต
    tags:
      - ดีที่สุด
      - เร่งขับกรดยูริก
      - ป้องกันนิ่วในไต
    stages:
      gout_remission:
        level: safe
        advice: ดื่มวันละ 2 - 2.5 ลิตร ช่วยขับกรดยูริกและป้องกันการกำเริบ
      gout_flare:
        level: safe
        advice: ดื่มวันละ 2.5 - 3 ลิตร เร่งการขับผลึกยูเรตออกจากข้อและกระแสเลือด
