id: coconut-water
name: น้ำมะพร้าวสด
category: drink
categoryName: เครื่องดื่ม/ของหวาน
icon: 🥥
tags:
  - โพแทสเซียมสูงจัด
  - เสี่ยงหัวใจหยุดเต้น
keywords:
  - น้ำมะพร้าว
  - มะพร้าว
  - เครื่องดื่ม
  - ผลไม้
sources:
  - name: โรงพยาบาลรามาธิบดี
    url: https://www.rama.mahidol.ac.th/ramachannel/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: เป็นน้ำเกลือแร่ธรรมชาติที่มีโพแทสเซียมเข้มข้นที่สุด เพียงแก้วเดียวทำให้โพแทสเซียมในเลือดทะลุเกณฑ์วิกฤต
    stages:
      stage1_2:
        level: caution
        advice: ดื่มได้ครั้งคราว แก้วเล็ก
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: ห้ามดื่มเด็ดขาด เสี่ยงหัวใจวาย
      dialysis:
        level: danger
        advice: ห้ามดื่มเด็ดขาด
  gout:
    reason: น้ำมะพร้าวสดมีพิวรีนต่ำมาก ช่วยดับกระหายและขับปัสสาวะ แต่มีน้ำตาลฟรุกโตสธรรมชาติเล็กน้อย จึงไม่ควรดื่มในปริมาณที่มากเกินไป
    tags:
      - พิวรีนต่ำ
      - ขับปัสสาวะ
      - ระวังน้ำตาลธรรมชาติ
    stages:
      gout_remission:
        level: safe
        advice: ดื่มได้วันละไม่เกิน 1 ลูก แนะนำดื่มน้ำมะพร้าวสดแท้ไม่เติมน้ำตาล
      gout_flare:
        level: safe
        advice: ดื่มได้วันละ 1 แก้ว ช่วยเพิ่มการขับปัสสาวะ
