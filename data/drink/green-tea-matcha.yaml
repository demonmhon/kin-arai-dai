diseases:
  ckd:
    reason: ชาเขียวชงใสไม่หวานมีสารต้านอนุมูลอิสระ (EGCG) และมีโพแทสเซียมต่ำ ปลอดภัยสำหรับไตระยะต้น แต่ผงมัทฉะบดทั้งใบมีโพแทสเซียมและฟอสฟอรัสสูงกว่าชาชงใสธรรมดา ⚠️ สิ่งที่ต้องระวังที่สุดคือ 'มัทฉะลาเต้' หรือชาเขียวขวดพร้อมดื่มที่เติมนมข้นหวาน ครีมเทียม และน้ำตาลสูง เพราะมีฟอสเฟตสังเคราะห์ที่ทำลายไตโดยตรง
    tags:
      - เลือกสูตรชงใสไม่หวาน
      - เลี่ยงมัทฉะใส่นมข้น/ครีมเทียม
      - ฟอสเฟตในนมปรุงแต่ง
    stages:
      stage1_2:
        level: safe
        advice: ดื่มได้ปกติ แนะนำเลือกชาเขียวชงใส ไม่ใส่น้ำตาล หลีกเลี่ยงสูตรใส่นมข้นหวานหรือครีมเทียม
      stage3:
        level: caution
        advice: ดื่มได้พอเหมาะ (ไม่เกิน 1 แก้ว/วัน) เลือกชาเขียวใสไม่หวาน หลีกเลี่ยงมัทฉะลาเต้ใส่นมเพราะฟอสฟอรัสสูง
      stage4_5_pre:
        level: caution
        advice: จำกัดปริมาณน้ำและเลี่ยงมัทฉะชนิดเข้มข้น ดื่มได้เฉพาะชาเขียวใสเจือจาง และห้ามดื่มมัทฉะลาเต้เด็ดขาด
      dialysis:
        level: caution
        advice: ต้องนับรวมในโควตาน้ำจำกัดประจำวัน และงดสูตรใส่นมข้น/ครีมเทียมเพื่อป้องกันฟอสฟอรัสในเลือดสูง
  gout:
    reason: ชาเขียวไม่หวานมีสาร EGCG ที่ช่วยลดการอักเสบ และมีรายงานทางการแพทย์ว่าอาจช่วยลดระดับกรดยูริกในเลือดได้ แต่หากเป็นชาเขียวพร้อมดื่มรสหวานหรือมัทฉะหวานจัด น้ำตาลฟรุกโตสจะกระตุ้นการสร้างกรดยูริกที่ตับทันที
    tags:
      - EGCG ช่วยต้านการอักเสบ
      - พิวรีนต่ำมาก
      - เลี่ยงสูตรหวานจัด
    stages:
      gout_remission:
        level: safe
        advice: ดื่มได้ตามปกติและมีประโยชน์ต่อสุขภาพ ควรเลือกสูตรไม่หวานหรือหวานน้อยมาก (ไม่ใส่ฟรุกโตสไซรัป)
      gout_flare:
        level: safe
        advice: ดื่มชาเขียวร้อนหรือเย็นแบบไม่หวานได้ ช่วยเพิ่มการขับถ่ายทางปัสสาวะ แต่ห้ามดื่มแบบหวานจัดเด็ดขาด
