diseases:
  ckd:
    reason: ไวน์ทั้งแดงและขาวมีแอลกอฮอล์ (เอทานอล ~11-14%) ซึ่งส่งผลต่อการควบคุมความดันโลหิต รบกวนสมดุลน้ำและเกลือแร่ และอาจมีปฏิกิริยากับยาลดความดันโลหิตที่ผู้มีภาวะไตรับประทานอยู่ นอกจากนี้ "ไวน์แดง" จะมีปริมาณโพแทสเซียมสูงกว่าไวน์ขาวเล็กน้อย (ประมาณ 120 มก. เทียบกับ 70 มก. ต่อแก้ว 120 มล.) จากการหมักพร้อมเปลือกองุ่น
    tags:
      - แอลกอฮอล์รบกวนความดัน
      - ไวน์แดงโพแทสเซียมสูงกว่าไวน์ขาว
    stages:
      stage1_2:
        level: caution
        advice: ดื่มได้นานๆ ครั้ง ไม่เกิน 1 แก้วมาตรฐาน (100-120 มล.) ดื่มน้ำเปล่าตาม และต้องไม่ดื่มขณะท้องว่างหรือดื่มร่วมกับยาประจำตัว
      stage3:
        level: caution
        advice: ควรหลีกเลี่ยง แอลกอฮอล์เพิ่มภาระการกรองของเสียของไต และอาจทำให้ความดันโลหิตแกว่งตัว
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด แอลกอฮอล์ทำให้ควบคุมภาวะคั่งของน้ำและความดันโลหิตได้ยาก และเสี่ยงภาวะโพแทสเซียมในเลือดสูงจากไวน์แดง
      dialysis:
        level: danger
        advice: ห้ามดื่มเด็ดขาด รบกวนการควบคุมปริมาณน้ำดื่ม และอาจทำให้เกิดภาวะแทรกซ้อนทางหลอดเลือดหัวใจรุนแรง
  gout:
    reason: แม้ไวน์จะมีสารพิวรีนต่ำกว่าเบียร์มาก (เนื่องจากไม่ได้หมักด้วยยีสต์ที่มีสารกัวโนซีนสูงแบบเบียร์) แต่ "แอลกอฮอล์ทุกชนิด" เมื่อถูกเผาผลาญในตับ จะผลิตกรดแลกติก (Lactic acid) ซึ่งไปแย่งชิงกลไกการขับถ่ายกรดยูริกที่ท่อไต ส่งผลให้ไตขับยูริกออกได้ลดลงและระดับยูริกในเลือดสูงขึ้น
    tags:
      - พิวรีนต่ำกว่าเครื่องดื่มหมักยีสต์
      - แอลกอฮอล์ยับยั้งการขับยูริก
    stages:
      gout_remission:
        level: caution
        advice: ปลอดภัยกว่าเบียร์ แต่ยังต้องจำกัดปริมาณอย่างเคร่งครัด ไม่เกิน 1 แก้วเล็ก (100 มล.) ต่อวัน ไม่ดื่มติดต่อกัน และดื่มน้ำสะอาดตามอย่างน้อย 1-2 แก้ว
      gout_flare:
        level: danger
        advice: งดดื่มเด็ดขาด 100% ช่วงข้ออักเสบกำเริบ แอลกอฮอล์ทุกชนิดจะทำให้ยูริกคั่งและอาการปวดบวมข้อรุนแรงขึ้นทันที
  cholecystectomy:
    reason: แอลกอฮอล์ส่งผลระคายเคืองเยื่อบุกระเพาะอาหารและกระตุ้นการบีบตัวของทางเดินอาหาร ซึ่งอาจทำให้แน่นท้องหรือถ่ายเหลวในผู้ที่ไม่มีถุงน้ำดี
    tags:
      - ระคายเคืองทางเดินอาหาร
    stages:
      chole_maintenance:
        level: caution
        advice: ดื่มได้ในปริมาณเล็กน้อยพร้อมมื้ออาหาร (ไม่เกิน 1 แก้ว) เลี่ยงการดื่มตอนท้องว่าง
      chole_recovery:
        level: danger
        advice: งดดื่มช่วงพักฟื้น 1 เดือนแรก เพื่อให้ตับและระบบทางเดินอาหารฟื้นฟูการผลิตน้ำดีได้อย่างสมบูรณ์
