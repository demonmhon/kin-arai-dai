id: soy-milk-unsweetened
name: นมถั่วเหลือง (สูตรไม่หวาน/ไม่เสริมแคลเซียม)
category: drink
categoryName: เครื่องดื่ม/ของหวาน
icon: 🥛
tags:
  - ฟอสฟอรัสน้อยกว่านมวัว
  - โปรตีนพืช
keywords:
  - นมถั่วเหลือง
  - นมถั่ว
  - เครื่องดื่ม
  - โปรตีนพืช
sources:
  - name: National Kidney Foundation (บทความ Plant Based Milk and Kidney Disease)
    url: https://www.kidney.org/kidney-topics/milk-alternatives
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: มีฟอสฟอรัสและโพแทสเซียมต่ำกว่านมวัวพอสมควร เป็นทางเลือกที่ดีกว่าสำหรับผู้ที่ต้องจำกัดฟอสฟอรัส แต่สูตรเสริมแคลเซียม/เสริมสารอาหารบางยี่ห้ออาจมีฟอสฟอรัสสูงขึ้น ควรอ่านฉลาก
    stages:
      stage1_2:
        level: safe
        advice: ดื่มได้ตามปกติ เลือกสูตรไม่หวาน
      stage3:
        level: safe
        advice: ดื่มได้วันละ 1 แก้ว
      stage4_5_pre:
        level: caution
        advice: จำกัดปริมาณ เลือกสูตรไม่เสริมแคลเซียม
      dialysis:
        level: caution
        advice: จำกัดปริมาณ
  gout:
    reason: งานวิจัยสมัยใหม่ระดับนานาชาติ (รวมถึงงานวิจัยในเอเชีย) ยืนยันว่าพิวรีนจากถั่วเหลืองไม่เพิ่มความเสี่ยงโรคเกาต์เหมือนพิวรีนจากเนื้อสัตว์ สามารถดื่มได้พอประมาณ
    tags:
      - พิวรีนจากพืช
      - ดื่มแต่พอดี
      - ไม่เติมน้ำตาล
    stages:
      gout_remission:
        level: safe
        advice: ดื่มได้วันละ 1 แก้ว เลือกสูตรไม่หวานหรือไม่เติมน้ำตาล
      gout_flare:
        level: caution
        advice: ช่วงกำเริบจำกัดไม่เกินวันละ 1 แก้ว หรือสลับดื่มนมวัวไขมันต่ำ
