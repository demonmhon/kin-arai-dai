diseases:
  ckd:
    reason: มีสารพิษต่อระบบประสาทชื่อ Caramboxin ไตที่เสื่อมจะไม่สามารถขับออกได้ ทำให้สะอึกรุนแรง ชัก โคม่า ไตวายเฉียบพลัน และเสียชีวิตได้
    stages:
      stage1_2:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
      stage3:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: อันตรายถึงชีวิต! ห้ามรับประทานเด็ดขาด
      dialysis:
        level: danger
        advice: อันตรายถึงชีวิต! ห้ามรับประทานเด็ดขาด
  gout:
    reason: มะเฟืองมีพิวรีนต่ำ แต่มีกรดออกซาเลตสูงมาก ซึ่งเสี่ยงต่อการเกิดนิ่วในไต และหากมีโรคไตเสื่อมร่วมด้วยจะมีสารพิษ Caramboxin ที่อันตรายถึงชีวิต
    tags:
      - ออกซาเลตสูง
      - เสี่ยงนิ่วในไต
      - ระวังหากมีโรคไต
    stages:
      gout_remission:
        level: caution
        advice: หากไตปกติทานได้แต่น้อย แต่ห้ามเด็ดขาดหากมีโรคไตเสื่อมร่วมด้วย
      gout_flare:
        level: caution
        advice: เลี่ยงทานช่วงกำเริบ เพื่อป้องกันภาระการทำงานของไต
