diseases:
  ckd:
    reason: ส้มและน้ำส้มมีโพแทสเซียมสูงจัด โดยเฉพาะน้ำส้มคั้น 1 แก้วเทียบเท่าส้ม 3-4 ผล ทำให้โพแทสเซียมในเลือดพุ่งขึ้นอย่างรวดเร็ว
    stages:
      stage1_2:
        level: safe
        advice: ทานผลสดได้วันละ 1 ผล เลี่ยงน้ำส้มคั้น
      stage3:
        level: caution
        advice: ทานได้ไม่เกิน 1 ผลเล็ก งดน้ำส้มคั้น
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โพแทสเซียมสูงเกินไตขับ
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด เสี่ยงหัวใจเต้นผิดจังหวะ
  gout:
    reason: ส้มสดมีวิตามินซีและฟลาโวนอยด์ช่วยลดการอักเสบและขับยูริก แต่ควรทานผลส้มสด หลีกเลี่ยงน้ำส้มกล่องที่เติมน้ำตาลฟรุกโตส
    tags:
      - วิตามินซี
      - ทานผลสด
      - เลี่ยงน้ำส้มกล่อง
    stages:
      gout_remission:
        level: safe
        advice: ทานผลส้มสดวันละ 1-2 ผล หลีกเลี่ยงน้ำส้มสำเร็จรูปที่เติมน้ำตาล
      gout_flare:
        level: safe
        advice: ทานผลสดได้ วิตามินซีช่วยลดการอักเสบ
