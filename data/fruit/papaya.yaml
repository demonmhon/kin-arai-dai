  - ช่วยระบาย
keywords:
  - มะละกอ
  - มะละกอสุก
  - ผลไม้
sources:
  - name: โรงพยาบาลรามาธิบดี
    url: https://www.rama.mahidol.ac.th/ramachannel/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ช่วยการขับถ่าย แต่มีโพแทสเซียมปานกลาง หากทานมากระดับโพแทสเซียมในเลือดจะสูงขึ้น
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ 6-8 ชิ้นคำ
      stage3:
        level: caution
        advice: จำกัด 4-5 ชิ้นคำ
      stage4_5_pre:
        level: caution
        advice: จำกัด 3-4 ชิ้นคำ หรือเลี่ยงหากโพแทสเซียมในเลือดเกิน 5.0
      dialysis:
        level: caution
        advice: จำกัด 3-4 ชิ้นคำ
  gout:
    reason: มะละกอสุกมีพิวรีนต่ำมาก อุดมด้วยเบต้าแคโรทีน วิตามินซี และเอนไซม์ช่วยย่อยอาหาร ไม่ส่งผลเสียต่อระดับกรดยูริก
    tags:
      - พิวรีนต่ำมาก
      - วิตามินซี
      - ช่วยย่อย
    stages:
      gout_remission:
        level: safe
        advice: ทานครั้งละ 5-6 ชิ้นคำ วันละ 1 มื้อ
      gout_flare:
        level: safe
        advice: ทานได้ตามปกติ พิวรีนต่ำ ปลอดภัย
