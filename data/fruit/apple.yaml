icon: 🍎
imageUrl: /images/foods/apple.jpg
imageCredit: Photo by Tom Hermans on Unsplash (CC0/Free License)
tags:
  - โพแทสเซียมต่ำ
  - กากใยสูง
  - มีเพคติน
keywords:
  - แอปเปิ้ล
  - apple
  - ผลไม้
  - ผลไม้โพแทสเซียมต่ำ
  - ของว่าง
  - ของหวาน
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: โพแทสเซียมต่ำมาก (ประมาณ 100-120 มก./ผล) มีสารเพคตินช่วยลดระดับคอเลสเตอรอลในเลือด ปลอดภัยต่อไตทุกระยะ
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามปกติ 1-2 ผล/วัน
      stage3:
        level: safe
        advice: ทานได้วันละ 1 ผลขนาดกลาง
      stage4_5_pre:
        level: safe
        advice: ทานได้วันละ 1/2 - 1 ผล ควรปอกเปลือก
      dialysis:
        level: safe
        advice: ทานได้วันละ 1/2 - 1 ผล ระวังเรื่องน้ำในผลไม้
  diabetes:
    reason: ดัชนีน้ำตาล (GI) ต่ำ-ปานกลาง และมีกากใยช่วยชะลอการดูดซึมน้ำตาลเข้าสู่กระแสเลือด เหมาะเป็นผลไม้ทดแทนของหวาน
    stages:
      general:
        level: safe
        advice: ทานได้วันละ 1 ผลขนาดกลาง แทนของหวานหลังมื้ออาหาร ไม่ควรทานเป็นน้ำคั้น
  gout:
    reason: แอปเปิ้ลมีพิวรีนต่ำมาก มีวิตามินซีและกรดมาลิกตามธรรมชาติ ซึ่งช่วยปรับสมดุลกรดด่างและเสริมการกำจัดกรดยูริก
    tags:
      - พิวรีนต่ำมาก
      - วิตามินซี
      - กรดมาลิก
    stages:
      gout_remission:
        level: safe
        advice: ทานได้วันละ 1 ผล ทานทั้งเปลือกหลังล้างสะอาด
      gout_flare:
        level: safe
        advice: ทานได้วันละ 1 ผล เป็นผลไม้ที่ปลอดภัยช่วงปวดข้อ
