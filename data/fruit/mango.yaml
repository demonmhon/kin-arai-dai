diseases:
  ckd:
    reason: มะม่วงสุกมีโพแทสเซียมระดับปานกลางค่อนไปทางสูง (ประมาณ 160-200 มก./100 ก.) และมีน้ำตาลฟรุกโตสสูง สำหรับมะม่วงดิบแม้โพแทสเซียมจะน้อยกว่าเล็กน้อย แต่มักรับประทานคู่กับพริกเกลือ น้ำปลาหวาน หรือกะปิหวาน ซึ่งมีเกลือโซเดียมมหาศาลเร่งให้ไตเสื่อมและบวมน้ำ
    tags:
      - โพแทสเซียมปานกลางค่อนสูง
      - ระวังเครื่องจิ้มโซเดียมสูง
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้มื้อละ 4-6 ชิ้นคำ แนะนำทานสด ไม่จิ้มพริกเกลือ น้ำปลาหวาน หรือกะปิหวาน
      stage3:
        level: caution
        advice: ทานได้ในปริมาณจำกัด มื้อละไม่เกิน 2-4 ชิ้นคำ ไม่ควรทานร่วมกับข้าวเหนียวมูนกะทิ และตรวจติดตามระดับโพแทสเซียมในเลือด
      stage4_5_pre:
        level: caution
        advice: จำกัดปริมาณอย่างเข้มงวด ทานได้ไม่เกิน 1-2 ชิ้นคำ หรือสลับไปทานผลไม้โพแทสเซียมต่ำ เช่น ชมพู่ แอปเปิ้ล สับปะรด หากโพแทสเซียมในเลือดเกิน 5.0 mEq/L ควรงด
      dialysis:
        level: caution
        advice: ทานได้แต่น้อย (ไม่เกิน 2-3 ชิ้นคำ) ระวังทั้งโพแทสเซียมสะสมและน้ำตาลที่อาจส่งผลต่อการควบคุมน้ำหนักและของเหลว
  gout:
    reason: มะม่วงสุกมีน้ำตาลฟรุกโตสสูงตามธรรมชาติ เมื่อร่างกายเผาผลาญฟรุกโตสในตับ จะเกิดผลพลอยได้กระตุ้นการสร้างกรดยูริกขึ้นอย่างรวดเร็ว และยับยั้งการขับยูริกทางไต
    tags:
      - ฟรุกโตสกระตุ้นสร้างยูริก
      - ผลไม้รสหวานจัด
    stages:
      gout_remission:
        level: caution
        advice: ทานได้พอเหมาะ ไม่เกินมื้อละ 1/2 ลูก ไม่ควรทานบ่อยหรือทานข้าวเหนียวมะม่วงหวานจัด
      gout_flare:
        level: caution
        advice: ช่วงข้ออักเสบควรเลี่ยงมะม่วงสุกหวานจัด เลือกทานผลไม้ที่มีวิตามินซีสูงและน้ำตาลต่ำ เช่น ส้มโอ ชมพู่ หรือเชอร์รี่
  cholecystectomy:
    reason: เนื้อมะม่วงสดมีไขมันต่ำมาก ทานได้ปลอดภัย แต่ต้องระวัง "ข้าวเหนียวมะม่วง" ที่ราดน้ำกะทิเข้มข้นซึ่งมีไขมันอิ่มตัวสูงมาก
    tags:
      - มะม่วงสดไขมันต่ำ
      - เลี่ยงข้าวเหนียวมูนกะทิ
    stages:
      chole_maintenance:
        level: safe
        advice: ทานมะม่วงสดได้ตามปกติ เลี่ยงการทานคู่กับข้าวเหนียวมูนกะทิปริมาณมาก
      chole_recovery:
        level: safe
        advice: ทานเนื้อมะม่วงสุกสดได้ย่อยง่าย แต่ห้ามทานข้าวเหนียวมะม่วงกะทิเพราะจะทำให้ท้องเสียเฉียบพลัน
