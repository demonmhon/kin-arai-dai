id: cherry
name: เชอร์รี่ / ผลไม้ตระกูลเบอร์รี่สด
category: fruit
categoryName: ผลไม้
icon: 🍒
tags:
  - แอนโทไซยานินสูง
  - ช่วยลดกรดยูริก
  - งานวิจัยรับรอง
  - ดีที่สุดสำหรับเกาต์
keywords:
  - เชอร์รี่
  - เบอร์รี่
  - บลูเบอร์รี่
  - สตรอว์เบอร์รี่
  - เชอร์รี่สด
sources:
  - name: American College of Rheumatology (ACR)
    url: https://rheumatology.org/
  - name: โรงพยาบาลบำรุงราษฎร์
    url: https://www.bumrungrad.com/
diseases:
  ckd:
    reason: เชอร์รี่และเบอร์รี่มีโพแทสเซียมปานกลาง อุดมด้วยสารต้านอนุมูลอิสระ ไตระยะต้นทานได้ แต่ระยะ 4-5 ต้องคุมปริมาณ
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ครั้งละ 8-10 ผล มีสารต้านอนุมูลอิสระสูง
      stage3:
        level: safe
        advice: ทานได้ครั้งละ 5-6 ผล
      stage4_5_pre:
        level: caution
        advice: จำกัดครั้งละ 3-4 ผล ระวังโพแทสเซียมสะสม
      dialysis:
        level: caution
        advice: ทานแต่น้อย มื้อละ 3-4 ผล
  gout:
    reason: งานวิจัยทางการแพทย์ขนาดใหญ่ยืนยันว่า สารแอนโทไซยานิน (Anthocyanins) ในเชอร์รี่มีฤทธิ์ต้านการอักเสบและช่วยลดระดับกรดยูริกในเลือด การทานเชอร์รี่ช่วยลดความเสี่ยงเกาต์กำเริบได้ถึง 35-50%
    tags:
      - สารแอนโทไซยานิน
      - ลดความเสี่ยงเกาต์ 35%
      - แนะนำอย่างยิ่ง
    stages:
      gout_remission:
        level: safe
        advice: ทานผลสดวันละ 10-12 ผล ช่วยลดความเสี่ยงเกาต์กำเริบได้อย่างมีนัยสำคัญ
      gout_flare:
        level: safe
        advice: ทานผลสดวันละ 10-15 ผล สารต้านการอักเสบช่วยบรรเทาอาการปวดข้อ
