diseases:
  ckd:
    reason: อุดมด้วยโพแทสเซียม ฟอสฟอรัส และพลังงานเข้มข้น ไตขับไม่ทันอย่างแน่นอน
    stages:
      stage1_2:
        level: caution
        advice: ทานได้ไม่เกิน 1 เม็ดเล็กนานๆ ครั้ง
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
  gout:
    reason: แม้พิวรีนจะไม่สูงมาก แต่ทุเรียนมีน้ำตาลเข้มข้นและพลังงานสูงมาก ซึ่งน้ำตาลและไขมันสูงทำให้เกิดภาวะดื้ออินซูลินและทำให้ไตขับยูริกได้ลดลง
    tags:
      - น้ำตาลสูงจัด
      - พลังงานสูง
      - เสี่ยงยูริกสะสม
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย ไม่เกิน 1 เม็ดเล็ก นานๆ ครั้ง
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ น้ำตาลและแคลอรี่สูงรบกวนการขับกรดยูริก
