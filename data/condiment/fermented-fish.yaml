diseases:
  ckd:
    reason: เป็นเครื่องปรุงที่มีโซเดียมเข้มข้นที่สุดในอาหารไทย เพียงช้อนเดียวอาจเทียบเท่าโซเดียมทั้งวันที่ควรได้รับ
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง โซเดียมสูงมาก
      stage3:
        level: danger
        advice: ห้ามรับประทาน
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
  gout:
    reason: ปลาร้าหมักจากปลาทั้งตัวรวมเครื่องในและเกลือเข้มข้น มีสารพิวรีนสูงมากจากเนื้อและเครื่องในปลา ทั้งยังมีโซเดียมสูงจัดขัดขวางการขับยูริก
    tags:
      - พิวรีนสูงจัด
      - ของหมักดอง
      - โซเดียมสูงมาก
      - งดเด็ดขาด
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด สารพิวรีนจากปลาหมักและเกลือสูงเสี่ยงกระตุ้นข้ออักเสบ
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% ตัวกระตุ้นอาการปวดบวมข้อรุนแรงฉับพลัน
