id: kimchi
name: กิมจิ (Kimchi / ผักกาดดองเกาหลี)
category: condiment
categoryName: เครื่องปรุง
icon: 🥬
tags:
  - โซเดียมสูงจัดจากการดองเกลือ
  - โพแทสเซียมสะสมจากผักกาดและพริก
  - พิวรีนในกิมจิผสมปลาแห้ง/เคย
keywords:
  - กิมจิ
  - kimchi
  - ผักดองเกาหลี
  - กิมจิผักกาดขาว
  - กิมจิต้นหอม
  - กิมจิหัวไชเท้า
  - ซุปกิมจิ
  - เครื่องเคียงเกาหลี
