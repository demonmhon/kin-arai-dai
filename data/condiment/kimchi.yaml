diseases:
  ckd:
    reason: กิมจิผ่านกรรมวิธีการหมักเกลือเข้มข้น ทำให้มีโซเดียมสูงจัดมาก กิมจิเพียง 1 ถ้วยเล็ก (ประมาณ 100 กรัม) มีโซเดียมสูงถึง 800 - 1,200 มก. (มากกว่าครึ่งหนึ่งของปริมาณที่ผู้ป่วยไตควรได้รับต่อวัน) อีกทั้งผักกาดขาว หัวไชเท้า และพริกเกาหลีหมักยังมีโพแทสเซียมสะสมสูง
    tags:
      - โซเดียมสูงจัด
      - โพแทสเซียมจากผักหมัก
    stages:
      stage1_2:
        level: caution
        advice: ทานได้แต่น้อยมาก (ไม่เกิน 1 ช้อนชาเพื่อชูรส) บีบเอาน้ำดองออกก่อนทาน ไม่ควรทานเป็นเครื่องเคียงชามใหญ่
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โซเดียมสูงมากเร่งให้ไตเสื่อมเร็วขึ้นและทำให้ความดันโลหิตควบคุมไม่ได้
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด โซเดียมและโพแทสเซียมสูงเสี่ยงทำให้เกิดภาวะบวมน้ำ น้ำท่วมปอด และหัวใจวาย
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด เกลือโซเดียมเข้มข้นทำให้กระหายน้ำ ดื่มน้ำเกินพิกัดควบคุมได้ยากมาก
  gout:
    reason: กิมจิแบบเกาหลีดั้งเดิมมักใช้น้ำต้มปลาแห้ง (Anchovy broth) และกุ้งเคยหมัก (Saeujeot) เป็นส่วนผสมในการหมัก ซึ่งมีสารพิวรีน ประกอบกับเกลือโซเดียมปริมาณสูงมากจะเข้าไปยับยั้งความสามารถของไตในการขับกรดยูริก
    tags:
      - โซเดียมยับยั้งการขับยูริก
      - มีส่วนผสมของปลาแห้งและเคยหมัก
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย ทานเป็นคำเล็กๆ ไม่ทานน้ำกิมจิ และดื่มน้ำเปล่าตามมากๆ
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ ป้องกันภาวะยูริกคั่งในกระแสเลือด
  cholecystectomy:
    reason: กิมจิเป็นผักหมักไขมันต่ำ แต่รสเปรี้ยวและเผ็ดจัดของพริกและกระเทียมหมักอาจระคายเคืองกระเพาะอาหารและกระตุ้นการเคลื่อนไหวของลำไส้เร็วเกินไป
    tags:
      - ไขมันต่ำ
      - ระวังรสเปรี้ยวเผ็ดจัด
    stages:
      chole_maintenance:
        level: safe
        advice: ทานเป็นเครื่องเคียงพอประมาณ มีจุลินทรีย์โพรไบโอติกที่ดีต่อลำไส้ ไม่ทานรสเผ็ดจัดเกินไป
      chole_recovery:
        level: caution
        advice: ช่วงพักฟื้นควรเลี่ยงรสเปรี้ยวและเผ็ดจัด เพราะลำไส้ยังไวต่อการระคายเคือง อาจทำให้ปวดมวนท้อง
