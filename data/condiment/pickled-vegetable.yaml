sources:
  - name: โรงพยาบาลศิริราช ปิยมหาราชการุณย์ (บทความโรคไต ภัยเงียบจากความเค็ม)
    url: https://www.siphhospital.com/th/news/article/share/sodium-and-kidney-disease
