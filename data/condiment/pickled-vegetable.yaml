diseases:
  ckd:
    reason: กระบวนการดองใช้เกลือปริมาณมาก ทำให้โซเดียมสูงมากแม้จะเป็นผัก และยังมีโพแทสเซียมจากน้ำดองสะสมด้วย
    stages:
      stage1_2:
        level: caution
        advice: ทานได้น้อยมาก ล้างน้ำก่อน
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทาน
      dialysis:
        level: danger
        advice: ห้ามรับประทาน
  gout:
    reason: ผักดองมีปริมาณเกลือโซเดียมสูงมาก ซึ่งโซเดียมที่มากเกินไปทำให้ไตขับกรดยูริกออกได้ช้าลง ส่งผลให้ระดับกรดยูริกในเลือดสะสมสูงขึ้น
    tags:
      - โซเดียมสูงจัด
      - หมักดอง
      - ยับยั้งการขับยูริก
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย โซเดียมสูงทำให้ไตขับกรดยูริกได้ลดลง
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ เพื่อหลีกเลี่ยงภาวะกรดยูริกคั่ง
