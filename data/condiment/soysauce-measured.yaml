id: soysauce-measured
name: ซีอิ๊วขาวธรรมดา / น้ำปลาแท้ (แบบตวงช้อน)
category: condiment
categoryName: เครื่องปรุง
icon: 🥢
tags:
  - โซเดียมมาตรฐาน
  - ต้องตวงช้อนเท่านั้น
keywords:
  - ซีอิ๊ว
  - น้ำปลา
  - เกลือ
  - เครื่องปรุง
  - ซอสปรุงรส
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: แม้มีโซเดียม แต่สามารถคำนวณและควบคุมปริมาณได้ชัดเจน ปลอดภัยกว่าเกลือลดโซเดียมที่แอบเติมโพแทสเซียม
    stages:
      stage1_2:
        level: caution
        advice: คุมไม่เกิน 3 ช้อนชา/วัน
      stage3:
        level: caution
        advice: คุมไม่เกิน 2-3 ช้อนชา/วัน
      stage4_5_pre:
        level: caution
        advice: คุมไม่เกิน 1-2 ช้อนชา/วัน ตวงช้อนเท่านั้น
      dialysis:
        level: caution
        advice: คุมไม่เกิน 1-2 ช้อนชา/วัน ป้องกันภาวะน้ำท่วมปอด
  gout:
    reason: ซีอิ๊วขาวและน้ำปลาใช้ปรุงรสได้หากตวงวัดปริมาณพอดี การคุมรสเค็มช่วยให้ไตขับกรดยูริกได้อย่างมีประสิทธิภาพ
    tags:
      - คุมเค็ม
      - ใช้ตวงวัด
    stages:
      gout_remission:
        level: safe
        advice: ใช้ปรุงอาหารได้มื้อละ 1 ช้อนชา ตวงวัดไม่ให้เค็มเกินไป
      gout_flare:
        level: safe
        advice: ใช้ปรุงรสอ่อนๆ มื้อละไม่เกิน 1 ช้อนชา
