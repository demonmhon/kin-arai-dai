diseases:
  ckd:
    reason: เนยสดแท้ประกอบด้วยไขมันนมประมาณ 80 - 82% น้ำ และมีโปรตีนกับแร่ธาตุฟอสฟอรัส โพแทสเซียมในระดับที่ต่ำมาก (เนื่องจากถูกแยกออกไปพร้อมหางนมแล้ว) จึงไม่ได้สร้างภาระแร่ธาตุฟอสฟอรัสหรือโพแทสเซียมเกินเหมือนนมสดหรือชีส แต่เนยมี "ไขมันอิ่มตัวสูงจัด" (มากกว่า 50%) ซึ่งเพิ่มระดับคอเลสเตอรอลตัวร้าย (LDL) และเร่งความเสี่ยงต่อโรคหลอดเลือดหัวใจตีบ ซึ่งเป็นสาเหตุการเสียชีวิตอันดับต้นๆ ของผู้มีภาวะไต นอกจากนี้ต้องระวัง "เนยเค็ม" (Salted Butter) ที่มีการเติมเกลือโซเดียมสูง
    tags:
      - ไขมันอิ่มตัวสูงจัด
      - เสี่ยงหลอดเลือดหัวใจ
      - ระวังเนยเค็มโซเดียมสูง
      - ฟอสฟอรัสต่ำ
    stages:
      stage1_2:
        level: caution
        advice: ใช้ทาหรือปรุงอาหารในปริมาณแต่น้อย แนะนำเลือกใช้ "เนยจืด" (Unsalted) เพื่อหลีกเลี่ยงโซเดียม และควบคุมระดับไขมันในเลือดสม่ำเสมอ
      stage3:
        level: caution
        advice: จำกัดปริมาณอย่างเคร่งครัด หากน้ำหนักตัวลดลงและต้องการพลังงานจากไขมัน สามารถใช้เนยจืดได้เล็กน้อย แต่ต้องระวังไขมันอิ่มตัวในหลอดเลือด
      stage4_5_pre:
        level: caution
        advice: รับประทานแต่น้อย เลือกเฉพาะเนยจืดเพื่อป้องกันโซเดียมคั่ง ระวังภาวะหลอดเลือดหัวใจตีบแข็ง
      dialysis:
        level: caution
        advice: รับประทานได้เล็กน้อยเพื่อเสริมพลังงาน โดยเลือกเฉพาะเนยชนิดจืด และระมัดระวังภาวะแทรกซ้อนทางหลอดเลือดและหัวใจ
  gout:
    reason: เนยแท้บริสุทธิ์แทบไม่มีสารพิวรีน (Very Low / Zero Purine) จึงไม่ได้เป็นสารตั้งต้นของกรดยูริกโดยตรง แต่สิ่งที่ผู้มีภาวะเกาต์ต้องระวังอย่างยิ่งคือ "ไขมันอิ่มตัวสูง" จะไปยับยั้งและลดความสามารถของไตในการขับกรดยูริกออกจากร่างกาย ส่งผลให้ระดับกรดยูริกในเลือดคั่งสะสมและกระตุ้นการกำเริบของโรคเกาต์ได้
    tags:
      - พิวรีนต่ำมาก
      - ไขมันยับยั้งการขับยูริก
    stages:
      gout_remission:
        level: caution
        advice: รับประทานแต่น้อย ไม่รับประทานอาหารที่ชุ่มเนยปริมาณมาก เพื่อไม่ให้ไขมันอิ่มตัวไปรบกวนกลไกการขับกรดยูริกของไต
      gout_flare:
        level: danger
        advice: หลีกเลี่ยงอาหารที่ใช้เนยปริมาณมากในช่วงข้ออักเสบกำเริบ ไขมันอิ่มตัวสูงจะชะลอการขับกรดยูริกและทำให้การอักเสบลดลงช้า
  cholecystectomy:
    reason: เนยคือไขมันเข้มข้นมากกว่า 80% ซึ่งเป็นหนึ่งในอาหารที่สร้างปัญหาต่อผู้ตัดถุงน้ำดีมากที่สุด เมื่อไม่มีถุงน้ำดีไว้กักเก็บน้ำดีเข้มข้น ไขมันจากเนยปริมาณมากจะไหลลงสู่ลำไส้เล็กโดยไม่ถูกย่อยอย่างทั่วถึง ไขมันที่ไม่ถูกย่อยจะถูกแบคทีเรียในลำไส้ใหญ่หมักและดึงน้ำเข้าสู่ลำไส้ ทำให้เกิดอาการถ่ายเหลวเป็นไขมัน (Steatorrhea), ท้องร่วงเฉียบพลัน, แน่นท้อง และปวดมวนท้องรุนแรง
    tags:
      - ไขมันเข้มข้น 80%
      - ข้อห้ามเด็ดขาดหลังผ่าตัดใหม่ๆ
      - กระตุ้นถ่ายเหลวและแน่นท้อง
    stages:
      chole_maintenance:
        level: caution
        advice: รับประทานได้ในปริมาณน้อยมาก (เช่น ปลายช้อนชาทาบางๆ) หลีกเลี่ยงอาหารทอดเนย ขนมปังชุ่มเนย หรือเบเกอรี่เนยสดปริมาณมาก
      chole_recovery:
        level: danger
        advice: ห้ามรับประทานเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด ระบบย่อยยังไม่พร้อมรองรับไขมันเข้มข้น จะทำให้ท้องเสียรุนแรงทันที
