id: herbs
name: สมุนไพรสด (ข่า ตะไคร้ ใบมะกรูด กระเทียม พริก)
category: condiment
categoryName: เครื่องปรุง
icon: 🌿
tags:
  - โซเดียม 0%
  - กลิ่นหอมธรรมชาติ
  - ชูรสปลอดภัย
keywords:
  - สมุนไพร
  - พริก
  - กระเทียม
  - ข่า
  - ตะไคร้
  - ใบมะกรูด
  - เครื่องปรุง
sources:
  - name: กรมอนามัย กระทรวงสาธารณสุข
    url: https://www.anamai.moph.go.th/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: สมุนไพรสดไม่มีเกลือโซเดียม ช่วยเพิ่มกลิ่นและรสชาติให้อาหารกลมกล่อม เจริญอาหารโดยไม่ต้องพึ่งน้ำปลา
    stages:
      stage1_2:
        level: safe
        advice: ใช้ปรุงแต่งได้เต็มที่
      stage3:
        level: safe
        advice: ใช้ช่วยชูรสเพื่อลดการใส่เกลือ
      stage4_5_pre:
        level: safe
        advice: ปลอดภัยมาก ช่วยให้ทานอาหารรสจืดได้อร่อยขึ้น
      dialysis:
        level: safe
        advice: ปลอดภัยมาก
  gout:
    reason: สมุนไพรสด เช่น ขิง ข่า ตะไคร้ ใบมะกรูด กระเทียม มีสารต้านอนุมูลอิสระและสารต้านการอักเสบตามธรรมชาติ มีพิวรีนต่ำมาก
    tags:
      - พิวรีนต่ำมาก
      - ต้านการอักเสบ
      - สมุนไพรธรรมชาติ
    stages:
      gout_remission:
        level: safe
        advice: ใช้ปรุงอาหารได้ตามชอบ ช่วยเพิ่มกลิ่นรสโดยไม่ต้องพึ่งผงซุปก้อน
      gout_flare:
        level: safe
        advice: ใช้ปรุงอาหารได้ดี โดยเฉพาะขิงมีฤทธิ์ช่วยลดการอักเสบของข้อ
