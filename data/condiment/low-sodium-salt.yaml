id: low-sodium-salt
name: เกลือลดโซเดียม / ซอสโลว์โซเดียม (อันตรายถึงชีวิต!)
category: condiment
categoryName: เครื่องปรุง
icon: 🧂
tags:
  - ใส่โพแทสเซียมคลอไรด์แทนเกลือ
  - เสี่ยงหัวใจหยุดเต้น
  - กับดักอันตราย
keywords:
  - เกลือลดโซเดียม
  - ซีอิ๊วลดโซเดียม
  - ซอสโลว์โซเดียม
  - เครื่องปรุง
  - เกลือ
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย (เตือนภัยเกลือลดโซเดียม)
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ผู้ผลิตใส่สาร "โพแทสเซียมคลอไรด์" แทนโซเดียมเพื่อให้มีความเค็ม ในผู้ป่วยไตที่ขับโพแทสเซียมไม่ได้ จะทำให้หัวใจเต้นผิดจังหวะและหยุดเต้นเฉียบพลัน
    stages:
      stage1_2:
        level: danger
        advice: ห้ามใช้เด็ดขาด
      stage3:
        level: danger
        advice: ห้ามใช้เด็ดขาด
      stage4_5_pre:
        level: danger
        advice: อันตรายถึงชีวิต! ห้ามใช้เด็ดขาด
      dialysis:
        level: danger
        advice: อันตรายถึงชีวิต! ห้ามใช้เด็ดขาด
  gout:
    reason: เกลือลดโซเดียมไม่มีสารพิวรีน ช่วยลดความดันโลหิต แต่หากมีโรคไตเสื่อมร่วมด้วยต้องระวังโพแทสเซียม
    tags:
      - ไม่มีพิวรีน
      - คุมโซเดียม
    stages:
      gout_remission:
        level: safe
        advice: ใช้ปรุงอาหารแต่น้อย ช่วยคุมความดันโลหิตและไม่กระทบกรดยูริก
      gout_flare:
        level: safe
        advice: ใช้ปรุงรสแต่น้อย ไม่ควรกินเค็มจัด
