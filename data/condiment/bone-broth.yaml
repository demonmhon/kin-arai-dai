diseases:
  ckd:
    reason: น้ำต้มกระดูกมีฟอสฟอรัสและโซเดียมละลายออกมาเข้มข้นที่สุด ทำให้ฟอสเฟตในเลือดสูงวิกฤตและบวมน้ำ
    stages:
      stage1_2:
        level: caution
        advice: ทานแต่น้อย ไม่ซดน้ำซุป
      stage3:
        level: danger
        advice: งดเด็ดขาด ฟอสฟอรัสเข้มข้นทำลายไต
      stage4_5_pre:
        level: danger
        advice: งดเด็ดขาด 100%
      dialysis:
        level: danger
        advice: งดเด็ดขาด
  gout:
    reason: สารพิวรีนในเนื้อสัตว์และกระดูกมีคุณสมบัติละลายน้ำได้ดีมาก เมื่อนำกระดูกและเนื้อมาเคี่ยวนานหลายชั่วโมง สารพิวรีนจะละลายออกมาอยู่ในน้ำซุปจนมีความเข้มข้นสูงสุด การซดน้ำซุปจึงได้รับพิวรีนโดยตรงเทียบเท่าการกินเครื่องใน
    tags:
      - พิวรีนละลายเข้มข้น
      - ตัวการเกาต์กำเริบ
      - งดซดน้ำซุป
    stages:
      gout_remission:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ทานก๋วยเตี๋ยวแห้ง ไม่ซดน้ำซุปต้มกระดูก
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% น้ำซุปกระดูกเคี่ยวเข้มข้นกระตุ้นให้ข้ออักเสบขั้นรุนแรง
