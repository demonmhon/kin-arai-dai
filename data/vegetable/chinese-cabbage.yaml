diseases:
  ckd:
    reason: ผักสีซีดโพแทสเซียมต่ำ ย่อยง่าย อ่อนโยนต่อทางเดินอาหารและไต
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามปกติ
      stage3:
        level: safe
        advice: ทานได้ดีทุกวัน
      stage4_5_pre:
        level: safe
        advice: ทานได้ ปรุงสุกน้ำใส
      dialysis:
        level: safe
        advice: ทานได้ดี
  gout:
    reason: ผักกาดขาวมีน้ำมากกว่า 95% และมีพิวรีนต่ำมาก ย่อยง่าย ช่วยเพิ่มปริมาณน้ำในร่างกายและขับปัสสาวะ
    tags:
      - พิวรีนต่ำมาก
      - น้ำเยอะ
      - ย่อยง่าย
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามชอบ นำมาต้มแกงจืดหรือผัดผัก
      gout_flare:
        level: safe
        advice: ทานได้ตามชอบ ช่วยเสริมน้ำและการขับปัสสาวะ
