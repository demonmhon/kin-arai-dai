id: carrot
name: แครอท
category: vegetable
categoryName: ผัก
icon: 🥕
tags:
  - โพแทสเซียมปานกลาง
  - เบต้าแคโรทีน
keywords:
  - แครอท
  - ผัก
  - ผักสีส้ม
  - ต้มซุป
sources:
  - name: National Kidney Foundation
    url: https://www.kidney.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: แครอทดิบมีโพแทสเซียมระดับปานกลางค่อนข้างสูง แต่สามารถลดลงได้ด้วยการหั่นต้มน้ำทิ้ง
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามปกติ
      stage3:
        level: caution
        advice: ต้มลวกน้ำทิ้งก่อนรับประทาน
      stage4_5_pre:
        level: caution
        advice: จำกัดปริมาณ ต้องต้มน้ำทิ้งเท่านั้น
      dialysis:
        level: caution
        advice: จำกัดปริมาณ ต้มน้ำทิ้ง
  gout:
    reason: แครอทมีพิวรีนต่ำมาก อุดมด้วยเบต้าแคโรทีน วิตามินเอ และใยอาหาร ช่วยต้านอนุมูลอิสระและไม่กระตุ้นยูริก
    tags:
      - พิวรีนต่ำมาก
      - เบต้าแคโรทีน
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามปกติ ใส่ในต้มจืด สลัด หรือผัดผัก
      gout_flare:
        level: safe
        advice: ทานได้ตามปกติ พิวรีนต่ำ ปลอดภัย
