id: spinach-tamlueng
name: ผักโขม / ตำลึง / ผักคะน้า / บรอกโคลี
category: vegetable
categoryName: ผัก
icon: 🌿
tags:
  - โพแทสเซียมสูงมาก
  - ออกซาเลตสูง
keywords:
  - ตำลึง
  - ผักโขม
  - คะน้า
  - บรอกโคลี
  - ผักใบเขียวเข้ม
  - ผัก
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ผักใบเขียวเข้มมีโพแทสเซียมสูงมาก เมื่อทำให้สุกและยุบตัวจะได้รับโพแทสเซียมปริมาณมหาศาล
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ปกติ แต่ต้มลวกดีกว่าทานสด
      stage3:
        level: caution
        advice: เลี่ยงทานบ่อย หรือต้องต้มน้ำทิ้งอย่างน้อย 2 ครั้ง
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด เสี่ยงหัวใจเต้นผิดจังหวะ
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด
  gout:
    reason: ยอดตำลึงและผักโขมมีพิวรีนปานกลาง-สูง (70-120 มก./100 ก.) บริเวณยอดอ่อนมีการแบ่งตัวของเซลล์สูง ช่วงปกติทานได้พอเหมาะ แต่ช่วงปวดข้อควรงด
    tags:
      - ยอดผักพิวรีนสูง
      - คุมปริมาณ
      - งดช่วงกำเริบ
    stages:
      gout_remission:
        level: caution
        advice: ทานได้สัปดาห์ละ 1-2 ครั้ง เลือกทานส่วนใบ เลี่ยงยอดอ่อนจัด
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ ยอดผักอ่อนกระตุ้นการสร้างกรดยูริก
