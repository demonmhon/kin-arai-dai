id: cucumber
name: แตงกวา / แตงร้าน
category: vegetable
categoryName: ผัก
icon: 🥒
tags:
  - โพแทสเซียมต่ำ
  - สดชื่น
keywords:
  - แตงกวา
  - แตงร้าน
  - ผัก
  - ผักสลัด
  - แตง
sources:
  - name: กรมอนามัย กระทรวงสาธารณสุข
    url: https://www.anamai.moph.go.th/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: โพแทสเซียมและฟอสฟอรัสต่ำมาก ปลอดภัยสูง
    stages:
      stage1_2:
        level: safe
        advice: ทานสดหรือผัดได้ตามชอบ
      stage3:
        level: safe
        advice: ปอกเปลือกแล้วทานได้
      stage4_5_pre:
        level: safe
        advice: ปอกเปลือกและทานแต่พอเหมาะ
      dialysis:
        level: safe
        advice: ปอกเปลือก (ระวังเรื่องน้ำถ้ามีอาการบวม)
  gout:
    reason: แตงกวามีน้ำเป็นส่วนประกอบสูงที่สุดและมีพิวรีนต่ำที่สุดในกลุ่มผัก มีฤทธิ์เย็นช่วยขับปัสสาวะและขับกรดยูริกตามธรรมชาติ
    tags:
      - พิวรีนต่ำที่สุด
      - น้ำสูงมาก
      - ขับกรดยูริก
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ไม่จำกัด ช่วยเพิ่มน้ำในร่างกายและขับยูริก
      gout_flare:
        level: safe
        advice: ทานได้ดีมาก มีน้ำสูงช่วยระบายกรดยูริก
