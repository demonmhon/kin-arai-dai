id: cha-om
name: ยอดชะอม / ผักยอดอ่อน (กระถิน, ยอดฟักทอง)
category: vegetable
categoryName: ผัก
icon: 🌿
tags:
  - ยอดผักพิวรีนสูง
  - การแบ่งเซลล์หนาแน่น
  - งดช่วงกำเริบ
keywords:
  - ชะอม
  - ยอดชะอม
  - กระถิน
  - ยอดกระถิน
  - ยอดฟักทอง
  - ยอดผัก
sources:
  - name: กรมอนามัย กระทรวงสาธารณสุข
    url: https://anamai.moph.go.th/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ชะอมและยอดผักมีโพแทสเซียมและฟอสฟอรัสสูง ผู้มีภาวะไตระยะ 3-5 ควรหลีกเลี่ยง
    stages:
      stage1_2:
        level: safe
        advice: ทานได้พอเหมาะ สัปดาห์ละ 1 ครั้ง
      stage3:
        level: caution
        advice: ทานแต่น้อย โพแทสเซียมค่อนข้างสูง
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยง โพแทสเซียมสูงจัด
      dialysis:
        level: caution
        advice: ต้มลวกเทน้ำทิ้งก่อนทานแต่น้อย
  gout:
    reason: ยอดชะอมและผักยอดอ่อนเป็นบริเวณที่มีการเจริญเติบโตและการแบ่งตัวของเซลล์สูงสุด ทำให้มีกรดนิวคลีอิกและสารพิวรีนสะสมหนาแน่นกว่าส่วนใบแก่ (จัดอยู่ในกลุ่มพิวรีนปานกลาง-สูง)
    tags:
      - พิวรีนสูงในกลุ่มผัก
      - งดเด็ดขาดช่วงปวดข้อ
    stages:
      gout_remission:
        level: caution
        advice: ทานได้บ้างนานๆ ครั้ง ไม่เกินมื้อละ 1 ทัพพี หลีกเลี่ยงการทอดไข่ชะอมที่อมน้ำมันมาก
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% ช่วงข้ออักเสบ ยอดผักเป็นตัวกระตุ้นอาการปวดบวม
