diseases:
  ckd:
    reason: ชีสหรือเนยแข็งเป็นผลิตภัณฑ์จากนมเข้มข้นที่ผู้มีภาวะไตต้องระวังอย่างยิ่ง เนื่องจากมี "ฟอสฟอรัสสูงจัดมาก" (ประมาณ 400 - 800 มก. ต่อ 100 ก.) และ "โซเดียมสูงจัด" (ประมาณ 600 - 1,200 มก. ต่อ 100 ก.) โดยเฉพาะชีสแผ่นแปรรูป (Processed Cheese) มักใส่สารคงตัวกลุ่มเกลือฟอสเฟตสังเคราะห์ (เช่น Sodium phosphate) ซึ่งลำไส้ดูดซึมเข้าสู่กระแสเลือดได้เกือบ 100% ไตที่เสื่อมขับฟอสฟอรัสส่วนเกินไม่ได้ จะทำให้เกิดภาวะฟอสเฟตในเลือดสูง ดึงแคลเซียมออกจากกระดูกจนกระดูกบางผุกร่อน และเกิดหินปูนเกาะหลอดเลือดหัวใจอย่างรวดเร็ว
    tags:
      - ฟอสฟอรัสสูงจัดมาก
      - โซเดียมสูงจัด
      - ฟอสเฟตสังเคราะห์ดูดซึม 100%
      - กระดูกพรุนและหลอดเลือดแข็ง
    stages:
      stage1_2:
        level: caution
        advice: รับประทานแต่น้อยเป็นครั้งคราว ชิ้นเล็กๆ แนะนำเลือกชีสธรรมชาติ (Natural cheese) แทนชีสแปรรูป และหลีกเลี่ยงชีสเค็มเพื่อควบคุมความดันโลหิต
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด ไตเริ่มขับฟอสฟอรัสไม่ทัน การรับประทานชีสจะทำให้ฟอสฟอรัสในเลือดคั่งเร็วขึ้นอย่างชัดเจน
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายจากภาวะฟอสเฟตในเลือดสูงวิกฤต คันตามผิวหนัง กระดูกผุพรุน และหลอดเลือดหัวใจตีบแข็ง
      dialysis:
        level: danger
        advice: ควรหลีกเลี่ยงอย่างยิ่ง แม้ต้องการโปรตีนสูงขึ้น แต่ชีสมีฟอสฟอรัสสูงเกินพิกัด แนะนำให้เสริมโปรตีนจากไข่ขาวล้วนซึ่งฟอสฟอรัสต่ำกว่ามาก
  gout:
    reason: ชีสเป็นผลิตภัณฑ์โปรตีนจากนม มีสารพิวรีนในระดับต่ำมาก (Low Purine) โปรตีนนมยังอาจช่วยส่งเสริมการขับกรดยูริกได้เล็กน้อย แต่สิ่งที่ต้องระวังคือชีสมี "ไขมันอิ่มตัวสูง" ซึ่งหากรับประทานในปริมาณมาก ไขมันอิ่มตัวจะชะลอการทำงานของไตในการขับกรดยูริกออกจากกระแสเลือด
    tags:
      - พิวรีนต่ำมาก
      - ระวังไขมันอิ่มตัวสูง
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้ในปริมาณพอเหมาะ แนะนำเลือกชีสไขมันต่ำหรือชีสธรรมชาติ ไม่รับประทานคู่กับของทอดหรือแอลกอฮอล์
      gout_flare:
        level: caution
        advice: ในช่วงที่ข้ออักเสบกำเริบ ควรจำกัดปริมาณอาหารไขมันสูงทุกชนิดเพื่อไม่ให้ไขมันไปขัดขวางการขับถ่ายกรดยูริกทางปัสสาวะ
  cholecystectomy:
    reason: ชีสทั่วไปมีปริมาณไขมันสูงถึง 25 - 35% ผู้ที่ผ่าตัดนำถุงน้ำดีออกไม่มีอวัยวะสำหรับกักเก็บและปล่อยน้ำดีเข้มข้นออกมารองรับไขมันก้อนใหญ่ในมื้อเดียว หากรับประทานชีสในปริมาณมากจะทำให้ไขมันไม่ถูกย่อย เกิดอาการท้องอืด แน่นท้อง แก๊สในลำไส้ และกระตุ้นอาการท้องเสียถ่ายเหลวรวดเร็ว
    tags:
      - ไขมันสูง 25-35%
      - กระตุ้นท้องเสียเรื้อรัง
      - ย่อยยากหลังตัดถุงน้ำดี
    stages:
      chole_maintenance:
        level: caution
        advice: รับประทานแต่น้อย โรยหน้าอาหารเพียงเล็กน้อยเพื่อแต่งกลิ่นรส ไม่รับประทานเมนูชีสเยิ้มๆ ปริมาณมาก หรือเลือกใช้ชีสไขมันต่ำ (Low-fat cheese)
      chole_recovery:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด ปริมาณไขมันที่เข้มข้นจะทำให้ระบบทางเดินอาหารระคายเคืองและท้องเสียรุนแรงทันที
