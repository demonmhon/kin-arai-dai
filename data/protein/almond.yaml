diseases:
  ckd:
    reason: อัลมอนด์อุดมด้วยสารต้านอนุมูลอิสระ วิตามินอี และกรดไขมันดี แต่สำหรับโรคไตเรื้อรัง อัลมอนด์มี "โพแทสเซียมสูงมาก" (ประมาณ 700-730 มก./100 ก.) และ "ฟอสฟอรัสสูง" (ประมาณ 450-480 มก./100 ก.) นอกจากนี้ยังมีสาร "ออกซาเลต (Oxalate) สูงจัด" ซึ่งเพิ่มความเสี่ยงต่อการเกิดนิ่วแคลเซียมออกซาเลตในไต ผู้ป่วยไตระยะ 3-5 จึงต้องจำกัดปริมาณอย่างเคร่งครัด
    tags:
      - โพแทสเซียมสูงมาก
      - ฟอสฟอรัสสูง
      - ออกซาเลตสูงเสี่ยงนิ่วไต
    stages:
      stage1_2:
        level: caution
        advice: รับประทานได้ 10-12 เม็ดต่อวัน เลือกแบบอบธรรมชาติไม่ใส่เกลือ ดื่มน้ำให้เพียงพอเพื่อลดความเสี่ยงการเกิดนิ่วออกซาเลต
      stage3:
        level: caution
        advice: จำกัดปริมาณเข้มงวด ไม่เกิน 5-7 เม็ดต่อวัน และระวังค่าโพแทสเซียมและฟอสฟอรัสในผลเลือด
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด โพแทสเซียมและฟอสฟอรัสสูงมาก ไตขับไม่ทัน เสี่ยงต่อภาวะแร่ธาตุเกินและหัวใจเต้นผิดจังหวะ
      dialysis:
        level: caution
        advice: ทานได้ปริมาณน้อย (4-6 เม็ด) เพื่อเสริมไขมันดีและวิตามินอี แต่ต้องทานพร้อมยาจับฟอสเฟต และระวังไม่ให้โพแทสเซียมเกินเกณฑ์
  gout:
    reason: อัลมอนด์มีสารพิวรีนในระดับต่ำมาก (Low Purine ประมาณ 10-35 มก./100 ก.) อุดมด้วยกรดไขมันไม่อิ่มตัวเชิงเดี่ยว (MUFA) และวิตามินอีสูง ซึ่งช่วยลดการอักเสบในร่างกาย เป็นถั่วเปลือกแข็งที่ปลอดภัยและเหมาะกับผู้ป่วยโรคเกาต์มากกว่าเนื้อสัตว์
    tags:
      - พิวรีนต่ำมาก
      - กรดไขมันดีช่วยต้านการอักเสบ
      - วิตามินอีสูง
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้อย่างปลอดภัย แนะนำวันละ 1 กำมือ (20-25 เม็ด) เลือกแบบอบธรรมชาติไม่โรยเกลือ
      gout_flare:
        level: safe
        advice: รับประทานได้ในปริมาณพอเหมาะ พิวรีนต่ำมากไม่กระตุ้นกรดยูริก แต่ควรเลี่ยงอัลมอนด์ทอดเนยหรือเคลือบน้ำตาลคาราเมล
  cholecystectomy:
    reason: อัลมอนด์มีไขมันสูงถึง 50% ของน้ำหนักตัว แม้จะเป็นไขมันไม่อิ่มตัวที่ดีต่อหัวใจ แต่สำหรับผู้ไม่มีถุงน้ำดี การย่อยไขมันปริมาณมากพร้อมกันจะทำได้ยาก น้ำดีที่หยดตรงจากตับลงสู่ลำไส้ไม่เข้มข้นพอ ส่งผลให้เกิดอาการแน่นท้อง ท้องอืด และขับถ่ายเหลวเป็นมัน
    tags:
      - ไขมันสูง 50%
      - ท้องอืดแน่นท้อง
      - เลี่ยงทานปริมาณมาก
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้ปริมาณน้อยครั้งละ 5-8 เม็ด เคี้ยวให้ละเอียดมากที่สุด และกระจายทาน ไม่ทานรวดเดียวในปริมาณมาก
      chole_recovery:
        level: danger
        advice: งดรับประทานเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด ป้องกันอาการท้องเสียเฉียบพลันและลำไส้บีบเกร็ง
