id: shrimp
name: กุ้ง
category: protein
categoryName: เนื้อสัตว์/โปรตีน
icon: 🍤
tags:
  - พิวรีนสูง
  - คอเลสเตอรอลสูง
  - ฟอสฟอรัสปานกลาง
  - ระวังฟอสเฟตในกุ้งแช่แข็ง
keywords:
  - กุ้ง
  - อาหารทะเล
  - โปรตีน
  - กุ้งเผา
  - กุ้งแช่น้ำปลา
sources:
  - name: National Kidney Foundation (บทความ Shellfish)
    url: https://www.kidney.org/kidney-topics/shellfish
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: 'กุ้งมีคอเลสเตอรอลและพิวรีนค่อนข้างสูง (สำคัญมากถ้ามีโรคเก๊าท์ร่วมด้วย) แต่โพแทสเซียมและฟอสฟอรัสอยู่ในระดับปานกลาง ทานได้ในปริมาณจำกัด ⚠️ ข้อควรระวัง: กุ้งแช่แข็งสำเร็จรูปหรือกุ้งเด้งมักแช่สารฟอสเฟตสังเคราะห์ (STPP) เพื่ออุ้มน้ำ ซึ่งร่างกายดูดซึมได้ 100% ควรเลือกกุ้งสดธรรมชาติ'
    stages:
      stage1_2:
        level: safe
        advice: ทานได้มื้อละ 4-5 ตัวขนาดกลาง
      stage3:
        level: caution
        advice: จำกัดมื้อละ 3-4 ตัว ไม่บ่อย
      stage4_5_pre:
        level: caution
        advice: จำกัดปริมาณตามโควตาโปรตีนรวม
      dialysis:
        level: safe
        advice: ทานได้มื้อละ 4-5 ตัว เพื่อเสริมโปรตีน
  gout:
    reason: กุ้งและอาหารทะเลเปลือกแข็งมีพิวรีนปานกลาง-สูง (120-150 มก./100 ก.) โดยเฉพาะมันกุ้งและหัวกุ้งมีพิวรีนสูงมาก ช่วงกำเริบต้องงดเด็ดขาด
    tags:
      - พิวรีนปานกลาง-สูง
      - หลีกเลี่ยงหัวและมันกุ้ง
      - งดช่วงกำเริบ
    stages:
      gout_remission:
        level: caution
        advice: ทานได้แต่น้อย ไม่เกินมื้อละ 3-4 ตัว แกะหัวและมันกุ้งทิ้ง
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ อาหารทะเลเปลือกแข็งกระตุ้นการปวดบวม
