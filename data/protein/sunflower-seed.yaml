diseases:
  ckd:
    reason: เมล็ดทานตะวันมี "ฟอสฟอรัสสูงจัดมากเป็นพิเศษ" (ประมาณ 660-700 มก./100 ก.) และ "โพแทสเซียมสูง" (ประมาณ 645 มก./100 ก.) เมื่อเทียบกับเมล็ดพืชอื่น ยิ่งไปกว่านั้น เมล็ดทานตะวันอบกรอบในท้องตลาดมักผ่านการหมักและโรยเกลือโซเดียมสูงมาก รวมถึงผงปรุงรสต่างๆ การแทะเมล็ดทานตะวันเพลินๆ จะทำให้ได้รับทั้งฟอสฟอรัส โพแทสเซียม และโซเดียมเกินขนาดอย่างรวดเร็ว ส่งผลให้ความดันโลหิตพุ่งสูง ไตทำงานหนัก และเกิดภาวะฟอสเฟตในเลือดสูงวิกฤต
    tags:
      - ฟอสฟอรัสสูงจัดมาก
      - โพแทสเซียมสูง
      - เกลือโซเดียมในขนมซองสูงจัด
    stages:
      stage1_2:
        level: caution
        advice: ทานได้ในปริมาณจำกัด ไม่เกิน 1 ช้อนโต๊ะ (เนื้อเมล็ดแกะเปลือก) ต้องเลือกแบบไม่ปรุงรสเค็ม และไม่แทะแบบมีเปลือกชุบเกลือ
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง ฟอสฟอรัสสูงจัดมาก (เกือบ 700 มก./100 ก.) ไตระยะ 3 ขับฟอสฟอรัสไม่ทัน จะเร่งให้ค่าไตแย่ลง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายสูงสุดจากฟอสฟอรัสและโพแทสเซียมสูงจัด เสี่ยงหัวใจเต้นผิดจังหวะและหลอดเลือดหัวใจแข็งตัว
      dialysis:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด ฟอสฟอรัสเข้มข้นสูงมาก ยาจับฟอสเฟตเอาไม่อยู่ เสี่ยงต่อโรคกระดูกพรุนและคันผิวหนังรุนแรง
  gout:
    reason: เมล็ดทานตะวันมีสารพิวรีนในระดับต่ำถึงปานกลาง (ประมาณ 40-60 มก./100 ก.) อุดมด้วยวิตามินอี ธาตุแมกนีเซียม และซีลีเนียมที่ช่วยต้านอนุมูลอิสระ แต่สิ่งที่ต้องระวังคือ "เมล็ดทานตะวันซองปรุงรสสำเร็จรูป" ที่มักใส่เกลือและสารปรุงรสสูง รวมถึงมีไขมันพืชสูง ซึ่งไขมันส่วนเกินจะลดประสิทธิภาพการขับกรดยูริกของไต
    tags:
      - พิวรีนต่ำถึงปานกลาง
      - ระวังเกลือและผงชูรสในซองขนม
      - วิตามินอีสูง
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้วันละ 1-2 ช้อนโต๊ะ เลือกแบบอบธรรมชาติไม่เติมเกลือ
      gout_flare:
        level: caution
        advice: ช่วงข้ออักเสบควรจำกัดปริมาณ เลี่ยงการทานเพลิน เพราะไขมันสูงอาจชะลอการขับกรดยูริก
  cholecystectomy:
    reason: เมล็ดทานตะวันมีไขมันสูงถึง 51% ของน้ำหนักตัว เมื่อตัดถุงน้ำดีออก น้ำดีในลำไส้จะไม่เข้มข้นพอที่จะย่อยไขมันปริมาณมาก การแทะเมล็ดทานตะวันในปริมาณมากจะทำให้ไขมันที่ไม่ถูกย่อยไหลลงสู่ลำไส้ใหญ่ ก่อให้เกิดแก๊ส ท้องอืด แน่นท้อง และท้องเสียถ่ายเหลวเป็นไขมัน (Steatorrhea) ทันที
    tags:
      - ไขมันสูง 51%
      - อาหารไม่ย่อย ท้องร่วง
      - น้ำดีย่อยไม่ทัน
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้ครั้งละ 1 ช้อนชา เคี้ยวให้ละเอียด หรือใช้โรยหน้าสลัดเพียงเล็กน้อย เลี่ยงการทานเป็นของว่างซองใหญ่
      chole_recovery:
        level: danger
        advice: ห้ามรับประทานเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด เสี่ยงต่อการเกิดอาการท้องเสียรุนแรงและปวดบิดเกร็งท้อง
