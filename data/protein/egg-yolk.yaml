diseases:
  ckd:
    reason: ไข่แดง 1 ฟองมีฟอสฟอรัสสูง หากไตขับไม่ออก จะสะสมจนดึงแคลเซียมออกจากกระดูก ทำให้คันตามผิวและกระดูกเปราะหักง่าย
    stages:
      stage1_2:
        level: safe
        advice: ทานได้วันละ 1 ฟอง
      stage3:
        level: caution
        advice: จำกัดสัปดาห์ละ 2-3 ฟอง
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด หรือไม่เกินสัปดาห์ละ 1 ฟอง
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ฟอสฟอรัสในไข่แดงฟอกออกยากมาก
  gout:
    reason: ไข่แดงมีสารพิวรีนต่ำมาก (<20 มก./100 ก.) สามารถรับประทานได้ปกติ ไม่ส่งผลต่อระดับกรดยูริกในเลือด
    tags:
      - พิวรีนต่ำ
      - ทานวันละ 1 ฟอง
    stages:
      gout_remission:
        level: safe
        advice: ทานได้วันละ 1 ฟองตามปกติ พิวรีนต่ำไม่กระตุ้นเกาต์
      gout_flare:
        level: safe
        advice: ทานได้วันละ 1 ฟอง ปลอดภัยสำหรับกรดยูริก
