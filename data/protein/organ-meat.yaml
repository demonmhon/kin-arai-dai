diseases:
  ckd:
    reason: เป็นแหล่งสะสมฟอสฟอรัสและพิวรีนเข้มข้นที่สุด ทำให้ระดับฟอสเฟตในเลือดสูงวิกฤต
    stages:
      stage1_2:
        level: caution
        advice: ไม่แนะนำ ทานได้ไม่เกินเดือนละครั้ง
      stage3:
        level: danger
        advice: งดเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: งดเด็ดขาด
      dialysis:
        level: danger
        advice: งดเด็ดขาด
  gout:
    reason: เครื่องในสัตว์ (ตับ ไต ไส้ ปอด หัวใจ) มีสารพิวรีนเข้มข้นที่สุดในบรรดาอาหารทั้งหมด (>300 - 500 มก./100 ก.) เป็นตัวการสำคัญอันดับ 1 ที่ทำให้เกาต์กำเริบรุนแรง
    tags:
      - พิวรีนสูงจัด
      - อันตรายสูงสุด
      - ตัวการเกาต์กำเริบ
      - งดเด็ดขาด
    stages:
      gout_remission:
        level: danger
        advice: งดเด็ดขาด แหล่งสะสมพิวรีนหนาแน่นที่สุด ทำให้กรดยูริกพุ่งสูงทันที
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% ห้ามแตะต้องแม้แต่น้อย
