diseases:
  ckd:
    reason: ถั่วลิสงมี "ฟอสฟอรัสสูงมาก" (ประมาณ 350-400 มก./100 ก.) และ "โพแทสเซียมสูง" (ประมาณ 650-700 มก./100 ก.) แม้ฟอสฟอรัสในพืชจะมีไฟเตตจับตัวทำให้ดูดซึมได้ราว 40-50% แต่สำหรับผู้ป่วยโรคไตระยะ 3 ขึ้นไป ไตไม่สามารถขับฟอสฟอรัสและโพแทสเซียมส่วนเกินได้ตามปกติ การรับประทานปริมาณมากเสี่ยงต่อภาวะฟอสเฟตในเลือดสูง (ทำให้คันตามตัว กระดูกผุพรุน หลอดเลือดแข็ง) และโพแทสเซียมในเลือดสูงซึ่งอันตรายต่อจังหวะการเต้นของหัวใจ นอกจากนี้ถั่วสำเร็จรูปมักโรยเกลือโซเดียมสูงจัด
    tags:
      - ฟอสฟอรัสสูง
      - โพแทสเซียมสูง
      - ระวังโซเดียมจากเกลือปรุงรส
    stages:
      stage1_2:
        level: caution
        advice: รับประทานได้ในปริมาณจำกัด (ไม่เกิน 1 กำมือเล็ก หรือ 20-30 กรัมต่อวัน) ควรเลือกแบบอบธรรมชาติ ไม่โรยเกลือ และหลีกเลี่ยงถั่วทอด
      stage3:
        level: caution
        advice: จำกัดปริมาณเข้มงวด ทานได้ไม่เกิน 1 ช้อนโต๊ะ (10-15 เม็ด) ต่อวัน และต้องตรวจติดตามระดับฟอสฟอรัสและโพแทสเซียมในเลือดสม่ำเสมอ
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด ฟอสฟอรัสและโพแทสเซียมสูงมาก ไตขับไม่ทัน เสี่ยงต่อภาวะหัวใจเต้นผิดจังหวะและฟอสเฟตสะสมในหลอดเลือด
      dialysis:
        level: caution
        advice: ทานได้ปริมาณเล็กน้อย (ไม่เกิน 1 ช้อนโต๊ะ) เพื่อเสริมพลังงานและโปรตีนพืช แต่ต้องรับประทานพร้อม "ยาจับฟอสเฟต" ตามที่แพทย์สั่งอย่างเคร่งครัด
  gout:
    reason: ถั่วลิสงมีสารพิวรีนในระดับปานกลาง (ประมาณ 79 มก./100 ก.) และมีกรดไขมันสูง ในอดีตผู้ป่วยเกาต์มักถูกแนะนำให้เลี่ยงถั่ว แต่หลักฐานทางโภชนาการปัจจุบันพบว่าโปรตีนจากพืชมีความสัมพันธ์กับการกำเริบของเกาต์น้อยกว่าเนื้อสัตว์และเครื่องใน อย่างไรก็ตาม ควรระวังถั่วทอดน้ำมันและถั่วคั่วเกลือ เพราะไขมันสูงจะไปชะลอการขับกรดยูริกของไต
    tags:
      - พิวรีนปานกลาง
      - ระวังไขมันชะลอการขับยูริก
      - เลือกแบบอบไม่เค็ม
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้ในปริมาณพอเหมาะ (วันละ 1 กำมือเล็ก 20-30 กรัม) เลือกแบบอบไม่โรยเกลือ เลี่ยงถั่วทอดน้ำมัน
      gout_flare:
        level: caution
        advice: ในช่วงข้ออักเสบกำเริบควรจำกัดปริมาณ เพื่อไม่ให้ไขมันสูงไปรบกวนการขับกรดยูริกออกจากร่างกาย
  cholecystectomy:
    reason: ถั่วลิสงมีไขมันสูงเกือบ 50% ของน้ำหนัก เมื่อไม่มีถุงน้ำดีไว้เก็บกักน้ำดีเข้มข้น การรับประทานถั่วลิสงปริมาณมากในคราวเดียวจะทำให้ระบบย่อยอาหารย่อยไขมันไม่ทัน ส่งผลให้เกิดอาการท้องอืด แน่นจุกเสียด และกระตุ้นให้เกิดอาการท้องเสียถ่ายเหลวเป็นไขมัน (Steatorrhea) ทันที
    tags:
      - ไขมันสูง 50%
      - เสี่ยงท้องเสียถ่ายเหลว
      - ย่อยยากเมื่อไม่มีถุงน้ำดี
    stages:
      chole_maintenance:
        level: caution
        advice: รับประทานได้แต่น้อยมาก (ครั้งละ 5-10 เม็ด) เคี้ยวให้ละเอียด หลีกเลี่ยงถั่วทอดน้ำมัน และไม่รับประทานตอนท้องว่าง
      chole_recovery:
        level: danger
        advice: ห้ามรับประทานเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด ระบบย่อยอาหารยังไม่พร้อมรองรับไขมันเข้มข้น จะทำให้ท้องเสียรุนแรงและปวดเกร็งท้อง
