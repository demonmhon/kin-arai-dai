      stage4_5_pre:
        level: danger
        advice: งดเด็ดขาด
      dialysis:
        level: danger
        advice: งดเด็ดขาด
  gout:
    reason: ปลาซาร์ดีน ปลาแอนโชวี่ และปลาทะเลตัวเล็กผิวน้ำที่กินทั้งตัว/ก้าง เป็นอาหารที่มีสารพิวรีนสูงที่สุดในกลุ่มสัตว์น้ำ (>200-300 มก./100 ก.) เป็นตัวกระตุ้นเกาต์ชั้นนำ
    tags:
      - พิวรีนสูงจัด
      - งดเด็ดขาด 100%
    stages:
      gout_remission:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สารพิวรีนสูงจัดเทียบเท่าเครื่องในสัตว์
      gout_flare:
        level: danger
        advice: งดเด็ดขาด 100% ห้ามรับประทาน
