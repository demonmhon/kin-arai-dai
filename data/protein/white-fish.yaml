id: white-fish
name: ปลาน้ำจืดเนื้อขาว (ปลากะพง, ปลานิล, ปลาช่อน)
category: protein
categoryName: เนื้อสัตว์/โปรตีน
icon: 🐟
tags:
  - โปรตีนย่อยง่าย
  - ฟอสฟอรัสน้อยกว่าเนื้อแดง
  - ไขมันต่ำ
keywords:
  - ปลา
  - ปลาน้ำจืด
  - ปลานิล
  - ปลากะพง
  - ปลาช่อน
  - เนื้อปลา
  - โปรตีน
sources:
  - name: โรงพยาบาลศิริราช
    url: https://www.si.mahidol.ac.th/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ย่อยง่าย มีพิวรีนและฟอสฟอรัสน้อยกว่าเนื้อหมูหรือเนื้อวัวติดมัน
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามชอบ
      stage3:
        level: safe
        advice: ทานมื้อละ 2-3 ช้อนโต๊ะ
      stage4_5_pre:
        level: safe
        advice: ทานมื้อละ 2-3 ช้อนโต๊ะ (ควบคุมน้ำหนักชิ้นเนื้อตามเกณฑ์แพทย์)
      dialysis:
        level: safe
        advice: ทานได้เต็มที่ มื้อละ 3-4 ช้อนโต๊ะ เพื่อฟื้นฟูกล้ามเนื้อ
  gout:
    reason: ปลาน้ำจืดและปลาเนื้อขาวมีพิวรีนระดับปานกลาง (50-110 มก./100 ก.) ปลอดภัยกว่าปลาทะเลผิวน้ำ (ซาร์ดีน ซาบะ) ทานได้โดยวิธีต้มหรือนึ่ง
    tags:
      - พิวรีนปานกลาง
      - ปลาเนื้อขาว
      - ปรุงต้มหรือนึ่ง
    stages:
      gout_remission:
        level: safe
        advice: ทานมื้อละ 3-4 ช้อนโต๊ะ ปรุงต้มหรือนึ่ง ดีกว่าสัตว์ปีก
      gout_flare:
        level: caution
        advice: ช่วงกำเริบทานแต่น้อย มื้อละไม่เกิน 2 ช้อนโต๊ะ หรือเปลี่ยนเป็นไข่ขาว
