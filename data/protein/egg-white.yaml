diseases:
  ckd:
    reason: ไข่ขาวคือโปรตีนคุณภาพสูงสุด (High Biological Value) มีฟอสฟอรัสต่ำมาก ร่างกายดูดซึมซ่อมแซมได้หมด สร้างของเสียน้อยที่สุด
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ปกติ 2-3 ฟอง/วัน
      stage3:
        level: safe
        advice: ทานวันละ 2-3 ฟอง ทดแทนเนื้อสัตว์ติดมัน
      stage4_5_pre:
        level: safe
        advice: ดีที่สุด! ทานวันละ 2-3 ฟอง (คำนวณตามน้ำหนักตัวเพื่อไม่ให้โปรตีนรวมเกินเกณฑ์)
      dialysis:
        level: safe
        advice: 🌟 จำเป็นมาก! แนะนำทานวันละ 4-6 ฟอง เพื่อชดเชยโปรตีนที่สูญเสียจากการฟอกไต
  gout:
    reason: ไข่ขาวมีสารพิวรีนต่ำที่สุดในบรรดาแหล่งโปรตีนทั้งหมด (แทบเป็นศูนย์) เป็นโปรตีนคุณภาพสูงที่ปลอดภัยที่สุด 100% สำหรับผู้มีภาวะเกาต์ทุกระยะ
    tags:
      - พิวรีนต่ำที่สุด
      - โปรตีนปลอดภัยสูงสุด
      - แนะนำเป็นหลัก
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามต้องการ วันละ 3-5 ฟอง เป็นแหล่งโปรตีนหลักที่ดีที่สุด
      gout_flare:
        level: safe
        advice: ทานได้ไม่จำกัด ปลอดภัยที่สุด ไม่เพิ่มกรดยูริกเลยแม้แต่น้อย
