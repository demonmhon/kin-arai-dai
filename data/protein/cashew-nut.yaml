diseases:
  ckd:
    reason: เม็ดมะม่วงหิมพานต์มี "ฟอสฟอรัสสูง" (ประมาณ 500-600 มก./100 ก.) และ "โพแทสเซียมสูง" (ประมาณ 660 มก./100 ก.) นอกจากนี้ยังมีสัดส่วนคาร์โบไฮเดรตสูงกว่าถั่วเปลือกแข็งชนิดอื่น สำหรับผู้ป่วยไตระยะ 3-5 ไตไม่สามารถขับฟอสฟอรัสส่วนเกินได้ ทำให้ฟอสเฟตในกระแสเลือดสูง กระตุ้นต่อมพาราไทรอยด์ให้หลั่งฮอร์โมนดึงแคลเซียมออกจากกระดูก และเสี่ยงต่อการเกิดหินปูนสะสมในหลอดเลือดแดง
    tags:
      - ฟอสฟอรัสสูงมาก
      - โพแทสเซียมสูง
      - ระวังเกลือปรุงรส
    stages:
      stage1_2:
        level: caution
        advice: รับประทานได้ 8-10 เม็ดต่อวัน เลือกแบบอบธรรมชาติ ไม่ใส่เกลือ ไม่เคลือบน้ำตาลหรือน้ำผึ้ง
      stage3:
        level: caution
        advice: จำกัดปริมาณอย่างเข้มงวด ไม่เกิน 4-5 เม็ดต่อวัน เพื่อควบคุมฟอสฟอรัสและโพแทสเซียมไม่ให้สะสมในร่างกาย
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด ฟอสฟอรัสสูงมาก ไตขับไม่ทัน เสี่ยงต่อภาวะแทรกซ้อนทางกระดูกและหลอดเลือดหัวใจ
      dialysis:
        level: caution
        advice: รับประทานได้เพียงเล็กน้อย (3-5 เม็ด) ต้องรับประทานพร้อมยาจับฟอสเฟตเพื่อป้องกันฟอสฟอรัสในเลือดสูง
  gout:
    reason: เม็ดมะม่วงหิมพานต์มีสารพิวรีนในระดับต่ำถึงปานกลาง (ประมาณ 25-50 มก./100 ก.) ไม่จัดเป็นอาหารกลุ่มเสี่ยงสูงต่อโรคเกาต์เมื่อเทียบกับเนื้อสัตว์ปีกหรือสัตว์เนื้อแดง แต่ควรระวังมะม่วงหิมพานต์ทอดเกลือ เพราะไขมันและโซเดียมสูงจะส่งผลเสียต่อความดันโลหิตและชะลอการขับกรดยูริกของไต
    tags:
      - พิวรีนต่ำถึงปานกลาง
      - ทานได้พอเหมาะ
      - เลี่ยงแบบทอดน้ำมัน
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้วันละ 1 กำมือเล็ก (15-20 เม็ด) เลือกแบบอบลมร้อนไม่ใส่เกลือ
      gout_flare:
        level: caution
        advice: ในช่วงข้ออักเสบควรจำกัดปริมาณ เพื่อลดภาระไขมันที่จะไปชะลอการขับกรดยูริก
  cholecystectomy:
    reason: มีไขมันรวมประมาณ 44-46% แม้จะน้อยกว่าถั่วลิสงและอัลมอนด์เล็กน้อย แต่ยังถือเป็นอาหารที่มีไขมันสูงมาก เมื่อไม่มีถุงน้ำดีคอยบีบน้ำดีเข้มข้นออกมาย่อยไขมันก้อนใหญ่ การเคี้ยวทานเม็ดมะม่วงหิมพานต์ปริมาณมากจะทำให้เกิดอาการแน่นลิ้นปี่ ท้องอืด ท้องเฟ้อ และถ่ายเหลวได้ง่าย
    tags:
      - ไขมันสูง 44%
      - แน่นท้อง ท้องอืด
      - กระตุ้นถ่ายเหลว
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้ปริมาณน้อยครั้งละ 4-6 เม็ด เคี้ยวให้ละเอียด เลี่ยงแบบทอดและแบบเคลือบคาราเมล
      chole_recovery:
        level: danger
        advice: งดรับประทานเด็ดขาดในช่วง 1-4 สัปดาห์แรกหลังผ่าตัด ป้องกันอาการท้องเสียและลำไส้ปั่นป่วน
