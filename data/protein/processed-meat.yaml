diseases:
  ckd:
    reason: ผสมสารฟอสเฟตสังเคราะห์ ร่างกายดูดซึมเข้ากระแสเลือดเกือบ 100% ทำให้ฟอสฟอรัสพุ่งสูงทันที และมีโซเดียมมหาศาลเร่งไตวาย
    stages:
      stage1_2:
        level: caution
        advice: ควรลดให้น้อยที่สุด มีโซเดียมและฟอสเฟตสูง
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด
  gout:
    reason: เนื้อแปรรูป (ไส้กรอก เบคอน กุนเชียง) มักทำจากเศษเนื้อผสมเครื่องในและมีโซเดียมเข้มข้น พิวรีนสูงและโซเดียมขัดขวางการขับกรดยูริกของไต
    tags:
      - พิวรีนสูง
      - โซเดียมสูง
      - เนื้อแปรรูป
      - งดเด็ดขาด
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง มีพิวรีนสูงและเกลือโซเดียมขัดขวางการกำจัดยูริก
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ กระตุ้นการอักเสบของเนื้อเยื่อ
