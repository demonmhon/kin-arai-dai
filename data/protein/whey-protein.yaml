diseases:
  ckd:
    reason: เวย์โปรตีนเป็นโปรตีนสกัดเข้มข้นจากหางนม ให้โปรตีนสูงถึง 20-30 กรัมต่อ 1 ช้อนตวง สำหรับผู้ป่วยโรคไตระยะ 1-5 ก่อนฟอกไต ร่างกายจำเป็นต้อง "จำกัดโปรตีน" (Low Protein Diet 0.6-0.8 กรัม/กก./วัน) เพื่อชะลอการสร้างของเสียยูเรีย (BUN) การทานเวย์โปรตีนจะทำให้ไตทำงานหนักอย่างรุนแรงและเร่งให้ไตวายระยะสุดท้ายเร็วขึ้นอย่างมาก อีกทั้งเวย์หลายยี่ห้อมีการแต่งรส มีฟอสฟอรัส และสารโพแทสเซียมแฝง
    tags:
      - ห้ามในไตระยะ 1-5 ก่อนฟอก
      - โปรตีนสูงเกินพิกัดกรอง
      - เร่งไตวายเฉียบพลัน
    stages:
      stage1_2:
        level: caution
        advice: ไม่แนะนำให้รับประทานเสริมโดยไม่จำเป็น ควรเน้นรับประทานโปรตีนจากอาหารธรรมชาติ (ไข่ขาว, ปลา) ให้พอดีกับน้ำหนักตัว ไม่ควรทานเวย์เข้มข้นแบบนักเพาะกาย
      stage3:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ปริมาณโปรตีนเข้มข้นจะสร้างของเสียคั่งในกระแสเลือดและเร่งให้ค่าไต (eGFR) ดิ่งลงอย่างรวดเร็ว
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายถึงชีวิตจากภาวะของเสียคั่งรุนแรง (Uremia), ฟอสเฟตในเลือดสูง และเลือดเป็นกรด
      dialysis:
        level: caution
        advice: แม้ผู้ป่วยฟอกไตจะต้องการโปรตีนสูงขึ้น (1.2-1.4 กรัม/กก./วัน) แต่ควรใช้อาหารทางการแพทย์เฉพาะโรคไตตามแพทย์หรือนักกำหนดอาหารสั่ง (เช่น ไข่ขาวผง หรืออาหารสูตรเฉพาะโรคไต) ไม่ควรซื้อเวย์โปรตีนฟิตเนสทั่วไปมารับประทานเองเนื่องจากมักมีฟอสฟอรัสและสารปรุงแต่งสูง
  gout:
    reason: เวย์โปรตีนสกัดจากนมบริสุทธิ์มีสารพิวรีนต่ำมาก จึงไม่ได้เป็นแหล่งพิวรีนโดยตรง แต่การทานโปรตีนเข้มข้นในปริมาณมากเกินไปจะเพิ่มภาระของเสียในไตและอาจส่งผลกระทบต่อกระบวนการขับกรดยูริก
    tags:
      - พิวรีนต่ำ
      - คุมปริมาณโปรตีนรวม
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ในปริมาณพอเหมาะตามความต้องการของร่างกาย โดยคำนวณโปรตีนรวมในแต่ละวันไม่ให้มากเกินไป
      gout_flare:
        level: caution
        advice: ช่วงข้ออักเสบควรดื่มน้ำเปล่ามากๆ และเน้นโปรตีนจากอาหารมื้อหลัก ไม่ควรทานโปรตีนเสริมเข้มข้นเกินจำเป็น
  cholecystectomy:
    reason: เวย์โปรตีนสูตร Isolate ทั่วไปมีไขมันต่ำมาก ทานได้ แต่ควรระวังสูตร Mass Gainer หรือสูตรผสมน้ำมัน MCT ที่มีไขมันแฝง
    tags:
      - เลือกสูตรไขมันต่ำ
    stages:
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติ แนะนำเลือกสูตร Whey Isolate ที่ไม่มีไขมันและน้ำตาลสูง
      chole_recovery:
        level: safe
        advice: ทานเสริมได้ในปริมาณพอเหมาะเพื่อช่วยซ่อมแซมแผลผ่าตัด ชงกับน้ำอุณหภูมิห้อง ไม่ชงผสมนมวัวไขมันเต็ม
