diseases:
  ckd:
    reason: แซลมอนเป็นปลาทะเลที่มีกรดไขมันโอเมก้า 3 (EPA & DHA) สูง ช่วยลดการอักเสบและดีต่อระบบหัวใจและหลอดเลือด โปรตีนคุณภาพสูงร่างกายนำไปใช้ได้ดี และฟอสฟอรัสเป็นชนิดธรรมชาติ (Organic phosphorus) ร่างกายดูดซึมได้เพียง 40-60% ซึ่งปลอดภัยกว่าฟอสเฟตสังเคราะห์มาก
    tags:
      - โอเมก้า 3 สูง
      - ฟอสฟอรัสธรรมชาติ
      - โปรตีนคุณภาพสูง
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้ตามปกติ แนะนำปรุงด้วยการนึ่ง อบ หรือย่าง ไม่ควรทอดน้ำมันท่วม และไม่หมักเกลือหรือซีอิ๊วเข้มข้น
      stage3:
        level: caution
        advice: ทานได้ในปริมาณจำกัด มื้อละ 2-3 ช้อนโต๊ะ (ประมาณ 30-45 กรัม) เพื่อควบคุมปริมาณโปรตีนรวมและฟอสฟอรัสในเลือด
      stage4_5_pre:
        level: caution
        advice: ต้องจำกัดโปรตีนอย่างเคร่งครัด ทานได้เพียง 1-2 ช้อนโต๊ะต่อมื้อ หรือสลับกับไข่ขาว และระวังฟอสฟอรัสสะสม
      dialysis:
        level: safe
        advice: แนะนำเป็นอย่างยิ่ง ผู้ป่วยฟอกไตต้องการโปรตีนสูง 1.2-1.4 กรัม/กก./วัน เพื่อชดเชยโปรตีนที่สูญเสียในการฟอกเลือด และโอเมก้า 3 ช่วยลดภาวะแทรกซ้อนทางหลอดเลือด
  gout:
    reason: ปลาแซลมอนเป็นปลาทะเลที่มีสารพิวรีนระดับปานกลาง (ประมาณ 110-170 มก./100 ก.) สูงกว่าปลาเนื้อขาวน้ำจืด แต่ต่ำกว่าปลาซาร์ดีนและเครื่องใน
    tags:
      - พิวรีนปานกลาง
      - เลี่ยงช่วงข้ออักเสบ
    stages:
      gout_remission:
        level: caution
        advice: ทานได้ในปริมาณพอเหมาะ มื้อละไม่เกิน 3-4 ช้อนโต๊ะ (ประมาณ 50-60 กรัม) สัปดาห์ละ 1-2 ครั้ง ปรุงแบบต้มหรือย่าง
      gout_flare:
        level: danger
        advice: งดรับประทานช่วงข้ออักเสบกำเริบ เปลี่ยนเป็นโปรตีนพิวรีนต่ำ เช่น ไข่ขาว หรือเต้าหู้
  cholecystectomy:
    reason: แซลมอนมีไขมันธรรมชาติค่อนข้างสูง (แม้เป็นไขมันดีไม่อิ่มตัว) ผู้ที่ไม่มีถุงน้ำดีอาจย่อยไขมันปริมาณมากในมื้อเดียวได้ไม่หมด
    tags:
      - ไขมันธรรมชาติค่อนข้างสูง
      - แบ่งทานมื้อเล็ก
    stages:
      chole_maintenance:
        level: safe
        advice: รับประทานได้ตามปกติ แนะนำปรุงด้วยการย่าง อบ หรือต้ม ไม่เพิ่มน้ำมัน และแบ่งทานเป็นชิ้นพอเหมาะ
      chole_recovery:
        level: caution
        advice: ช่วงพักฟื้น 1-4 สัปดาห์แรก ควรเลือกเนื้อส่วนที่ไม่มันจัด ทานชิ้นเล็กๆ เพื่อป้องกันอาการแน่นท้องและท้องเสียจากกรดน้ำดี
