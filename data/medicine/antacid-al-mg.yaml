diseases:
  ckd:
    reason: >-
      ยาลดกรดชนิดน้ำและเม็ดเคี้ยวที่จำหน่ายทั่วไปตามร้านขายยาและร้านสะดวกซื้อมักมีส่วนประกอบของ "อะลูมิเนียมไฮดรอกไซด์ (Aluminium Hydroxide)" และ "แมกนีเซียมไฮดรอกไซด์ (Magnesium Hydroxide)" ซึ่งในคนปกติแร่ธาตุส่วนเกินเหล่านี้จะถูกขับทิ้งทางไต แต่ในผู้ป่วยโรคไตเรื้อรังตั้งแต่ระยะ 3 ขึ้นไป ไตไม่สามารถขับออกได้ ทำให้เกิดการสะสมจนเป็นพิษรุนแรง 1. พิษจากอะลูมิเนียม (Aluminium toxicity): จะสะสมในกระดูกทำให้กระดูกเปราะ ผิดรูป และแทรกซึมเข้าสู่สมองจนเกิดภาวะสมองเสื่อมจากพิษอะลูมิเนียม (Dialysis encephalopathy) 2. ภาวะแมกนีเซียมในเลือดสูงเกิน (Hypermagnesemia): ส่งผลให้กล้ามเนื้ออ่อนแรง ความดันโลหิตตกอย่างรุนแรง และหัวใจเต้นช้าหรือหยุดเต้นเฉียบพลัน หากมีอาการกรดไหลย้อนควรปรึกษาแพทย์เพื่อใช้ยากลุ่ม PPI หรือ H2-blocker ที่ปรับขนาดยาแล้วแทน
    tags:
      - อะลูมิเนียมคั่งในสมอง-กระดูก
      - แมกนีเซียมกดการเต้นของหัวใจ
      - หลีกเลี่ยงในไตระยะ 3-5 และฟอกไต
    stages:
      stage1_2:
        level: caution
        advice: ทานได้ระยะสั้นเมื่อมีอาการแสบกระเพาะ แต่ไม่ควรทานต่อเนื่องเป็นประจำ และควรปรึกษาแพทย์หากอาการไม่ดีขึ้น
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ไตเริ่มขับอะลูมิเนียมและแมกนีเซียมได้จำกัด เสี่ยงต่อการสะสมของโลหะหนัก ควรปรึกษาแพทย์เพื่อเปลี่ยนเป็นยากลุ่มอื่น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด แร่ธาตุแมกนีเซียมและอะลูมิเนียมจะคั่งในกระแสเลือดอย่างรวดเร็ว เป็นอันตรายต่อระบบประสาทและหัวใจ
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด การฟอกเลือดไม่สามารถขับอะลูมิเนียมที่จับกับโปรตีนในเนื้อเยื่อออกได้ เสี่ยงต่อภาวะสมองเสื่อมและกระดูกเปราะรุนแรง
  gout:
    reason: >-
      ยาลดกรดอะลูมิเนียมและแมกนีเซียมอาจรบกวนการดูดซึมยาประจำตัวของผู้ป่วยเกาต์ (เช่น ยาลดยูริก Allopurinol) จึงควรทานห่างจากยาประจำตัวอย่างน้อย 2 ชั่วโมง และต้องระวังการทำงานของไต
    tags:
      - รบกวนการดูดซึมยาเกาต์
      - ควรทานห่างจากยาอื่น 2 ชม.
    stages:
      gout_remission:
        level: caution
        advice: หากจำเป็นต้องทาน ควรทานห่างจากยาลดยูริกอย่างน้อย 2 ชั่วโมงเพื่อไม่ให้ขัดขวางการดูดซึมยา
      gout_flare:
        level: caution
        advice: ระวังปฏิกิริยากับยาแก้ปวดหรือยาลดการอักเสบที่แพทย์สั่ง ควรปรึกษาเภสัชกรก่อนทานร่วมกัน
  cholecystectomy:
    reason: >-
      ผู้ที่ตัดถุงน้ำดีมักมีอาการท้องอืด แน่นท้องจากการย่อยไขมัน ซึ่งยาลดกรดไม่สามารถแก้ปัญหาการย่อยไขมันได้ นอกจากนี้แมกนีเซียมในยาลดกรดยังมีฤทธิ์เป็นยาระบาย อาจกระตุ้นให้อาการท้องเสียถ่ายเหลวหลังตัดถุงน้ำดีรุนแรงขึ้น
    tags:
      - แมกนีเซียมกระตุ้นท้องเสีย
      - ไม่ช่วยย่อยไขมัน
    stages:
      chole_recovery:
        level: caution
        advice: ระวังฤทธิ์ระบายของแมกนีเซียม อาจทำให้ถ่ายเหลวหนักขึ้น หากแน่นท้องควรปรับลดไขมันในมื้ออาหารแทน
      chole_maintenance:
        level: caution
        advice: ใช้เฉพาะเมื่อมีอาการกรดไหลย้อนจริง หากมีอาการแน่นท้องจากอาหารมันควรใช้เอนไซม์ช่วยย่อยตามแพทย์สั่ง
