diseases:
  ckd:
    reason: >-
      ยากลุ่ม NSAIDs (Non-Steroidal Anti-Inflammatory Drugs) เช่น ไอบูโพรเฟน (Ibuprofen), มีเฟนามิก (Ponstan), ไดโคลฟีแนก (Diclofenac), นาพรอกเซน (Naproxen), เซเลค็อกสิบ (Celecoxib) เป็น "สาเหตุอันดับต้นๆ ของภาวะไตวายเฉียบพลันซ้ำเติม (Acute Kidney Injury) ในผู้ป่วยโรคไต" เนื่องจากยากลุ่มนี้ออกฤทธิ์ยับยั้งเอนไซม์ไซโคลออกซิจิเนส (COX) ทำให้การสร้างพรอสตาแกลนดิน (Prostaglandins) ซึ่งเป็นสารที่คอยขยายหลอดเลือดเลี้ยงหน่วยกรองไตหยุดชะงัก หลอดเลือดไตจะหดเกร็งอย่างรุนแรง เลือดไปเลี้ยงไตลดฮวบ อัตราการกรองของเสีย (eGFR) ตกวูบเฉียบพลัน และยังทำให้ร่างกายคั่งน้ำ คั่งโซเดียม บวม ความดันโลหิตสูงขึ้น และเสี่ยงโพแทสเซียมในเลือดสูงวิกฤต แม้กินเพียงไม่กี่เม็ดก็ทำให้ไตวายถาวรจนต้องฟอกเลือดได้
    tags:
      - ห้ามใช้เด็ดขาดในโรคไตทุกระยะ
      - สาเหตุหลักไตวายเฉียบพลัน
      - ยับยั้งหลอดเลือดไต
      - ทำร้ายหน่วยกรองไตโดยตรง
    stages:
      stage1_2:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สมาคมโรคไตเตือนว่าการซื้อยา NSAIDs ทานเองทำให้ไตที่เริ่มเสื่อมทรุดตัวลงอย่างรวดเร็ว หากมีอาการปวดให้ใช้พาราเซตามอลแทน
      stage3:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ไตระยะ 3 มีความไวต่อพิษของยา NSAIDs สูงมาก เสี่ยงเกิดไตวายเฉียบพลันซ้ำเติมจนเข้าสู่ระยะสุดท้ายในเวลาอันสั้น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด การทานเพียง 1-2 เม็ดอาจทำให้อัตราการกรองของไตหยุดทำงานจนต้องฟอกเลือดฉุกเฉินทันที
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ทำลายการทำงานของไตส่วนที่เหลือ เพิ่มความดันโลหิตอย่างรุนแรง และเพิ่มความเสี่ยงเลือดออกในกระเพาะอาหาร
  gout:
    reason: >-
      แม้ยากลุ่ม NSAIDs จะเคยเป็นยาหลักในการระงับอาการปวดข้อเกาต์กำเริบ แต่ผู้ป่วยเกาต์จำนวนมากมักมีไตเสื่อมร่วมด้วยโดยไม่รู้ตัว หากผู้ป่วยมีภาวะไตบกพร่อง การทาน NSAIDs จะซ้ำเติมไตอย่างรุนแรง อีกทั้งยากลุ่มนี้บางชนิดและแอสไพรินขนาดต่ำจะลดการขับกรดยูริกของไต ทำให้ระดับยูริกในเลือดพุ่งสูงขึ้น จึงห้ามซื้อทานเองเด็ดขาด
    tags:
      - ห้ามซื้อทานเอง
      - เสี่ยงทำลายไตซ้ำเติม
    stages:
      gout_remission:
        level: danger
        advice: ไม่ควรรับประทานเองเด็ดขาดเพื่อบรรเทาอาการปวดเมื่อยทั่วไป ให้ใช้ยาแก้ปวดที่ปลอดภัยกว่าหรือปรึกษาแพทย์
      gout_flare:
        level: caution
        advice: ต้องใช้ภายใต้ใบสั่งยาและการตรวจค่าไตของแพทย์เท่านั้น ห้ามซื้อยาทานเองหรือทานยาชุดแก้ปวดเด็ดขาด
  cholecystectomy:
    reason: >-
      ยากลุ่ม NSAIDs ระคายเคืองเยื่อบุกระเพาะอาหารและลำไส้อย่างรุนแรง เพิ่มความเสี่ยงเกิดแผลในกระเพาะและภาวะเลือดออกในทางเดินอาหาร โดยเฉพาะในช่วงฟื้นตัวหลังการผ่าตัด
    tags:
      - ระคายเคืองกระเพาะอาหาร
      - ระวังแผลเลือดออกทางเดินอาหาร
    stages:
      chole_recovery:
        level: danger
        advice: หลีกเลี่ยงในช่วงพักฟื้นหลังผ่าตัด เสี่ยงต่อแผลในกระเพาะอาหารและภาวะเลือดออก
      chole_maintenance:
        level: caution
        advice: หากจำเป็นต้องใช้ต้องทานหลังอาหารทันทีและดื่มน้ำตามมากๆ และควรมีแพทย์เป็นผู้สั่งใช้
