id: nsaids-painkiller
name: "ยาแก้ปวดแก้อักเสบกลุ่ม NSAIDs (NSAIDs: ไอบูโพรเฟน, พอนสแตน, ไดโคลฟีแนก, นาพรอกเซน)"
