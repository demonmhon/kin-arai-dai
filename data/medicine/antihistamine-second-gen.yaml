diseases:
  ckd:
    reason: >-
      ยาแก้แพ้รุ่นที่ 2 (Second-generation Antihistamines) เช่น เซทิริซีน (Cetirizine), ลอราทาดีน (Loratadine), เฟกโซเฟนาดีน (Fexofenadine) มีข้อดีคือ "ไม่ง่วงซึม และไม่มีฤทธิ์ทำให้ปัสสาวะคั่งเหมือนรุ่นเก่า" จึงปลอดภัยต่อผู้สูงอายุมากกว่า อย่างไรก็ตาม ยาแต่ละตัวมีวิถีการขับออกจากร่างกายต่างกันมาก 1. Cetirizine ขับออกทางไตในรูปเดิมสูงถึง 70-80% เมื่อไตเสื่อมลง (eGFR < 50 ml/min) ตัวยาจะคั่งในกระแสเลือด จึงจำเป็นต้อง "ปรับลดขนาดยาลงครึ่งหนึ่ง (เหลือ 5 มก./วัน) หรือทานวันเว้นวัน" 2. Loratadine ขับผ่านตับเป็นหลัก จึงปลอดภัยและแทบไม่ต้องปรับขนาดยาในผู้ป่วยโรคไต และ 3. Fexofenadine ควรปรับลดขนาดลงเหลือวันละ 60 มก. ครั้งเดียว ดังนั้นผู้ป่วยโรคไตระยะ 3-5 และผู้ที่ฟอกไต จึงควรแจ้งแพทย์หรือเภสัชกรเพื่อเลือกชนิดยาและปรับขนาดยาให้เหมาะสม
    tags:
      - ไม่ง่วงซึม ไม่ทำให้ปัสสาวะคั่ง
      - Cetirizine ต้องลดขนาดยาเมื่อไตเสื่อม
      - Loratadine ขับผ่านตับปลอดภัยต่อไต
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามขนาดปกติ วันละ 1 เม็ด (10 มก.) วันละ 1 ครั้ง สะดวกและปลอดภัย ไม่ง่วงซึม
      stage3:
        level: caution
        advice: หากใช้ Cetirizine ควรปรับลดขนาดลงเหลือ 5 มก. วันละครั้ง หรือทานวันเว้นวัน หรือเลือกใช้ Loratadine 10 มก. วันละครั้งแทน
      stage4_5_pre:
        level: caution
        advice: ต้องปรับลดยาตามคำแนะนำของแพทย์/เภสัชกร หากใช้ Cetirizine แนะนำ 5 มก. ทุก 48 ชั่วโมง (วันเว้นวัน) หรือใช้ Loratadine
      dialysis:
        level: caution
        advice: Cetirizine ไม่สามารถขจัดออกทางเครื่องฟอกเลือดได้ แนะนำขนาดยา 5 มก. ทุก 48 ชั่วโมง หรือปรึกษาแพทย์เพื่อใช้ยาอื่นที่เหมาะสม
  gout:
    reason: >-
      ปลอดภัยสำหรับผู้ป่วยโรคเกาต์ ไม่มีผลต่อการสังเคราะห์หรือการขับกรดยูริก สามารถใช้รักษาอาการแพ้ ลมพิษ และผื่นคันได้อย่างปลอดภัย
    tags:
      - ปลอดภัยต่อผู้ป่วยเกาต์
      - ไม่มีผลต่อกรดยูริก
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามขนาดปกติ วันละ 1 เม็ดเมื่อมีอาการแพ้
      gout_flare:
        level: safe
        advice: สามารถใช้ร่วมกับยาของแพทย์ได้อย่างปลอดภัย
  cholecystectomy:
    reason: >-
      ปลอดภัยสำหรับผู้ที่ได้รับการผ่าตัดถุงน้ำดี ไม่รบกวนระบบทางเดินอาหาร
    tags:
      - ปลอดภัยหลังผ่าตัด
    stages:
      chole_recovery:
        level: safe
        advice: ทานได้ตามขนาดปกติเมื่อมีอาการแพ้
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติ
