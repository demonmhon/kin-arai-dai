diseases:
  ckd:
    reason: >-
      ยาลดกรดผงฟูและยาเม็ดฟู่ขับลม เช่น ENO มีส่วนประกอบหลักคือ "โซเดียมไบคาร์บอเนต (Sodium Bicarbonate)" ซึ่งมีปริมาณโซเดียมแฝงในระดับที่สูงวิกฤต (ยาผงฟูเพียง 1 ซอง มีปริมาณโซเดียมสูงถึงประมาณ 700 - 850 มิลลิกรัม หรือเทียบเท่าเกลือแกงเกือบครึ่งช้อนชา คิดเป็นเกือบครึ่งหนึ่งของโควตาโซเดียมทั้งวันที่ผู้ป่วยโรคไตรับได้) เมื่อดื่มเข้าไป โซเดียมจะถูกดูดซึมเข้าสู่กระแสเลือดอย่างรวดเร็ว ดึงน้ำเข้าสู่หลอดเลือด ส่งผลให้ "ความดันโลหิตพุ่งสูงเฉียบพลัน เกิดอาการบวมน้ำรวดเร็ว และเสี่ยงต่อภาวะน้ำท่วมปอดฉุกเฉิน (Acute Pulmonary Edema) จนหายใจไม่ออกและเป็นอันตรายถึงชีวิต"
    tags:
      - โซเดียมแฝงสูงถึง 700-850 มก./ซอง
      - ความดันพุ่งสูงเฉียบพลัน
      - เสี่ยงน้ำท่วมปอดฉุกเฉิน
      - อันตรายถึงชีวิตในโรคไต
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง โซเดียมปริมาณมหาศาลจะทำให้ไตทำงานหนัก ความดันโลหิตสูงขึ้น และทำลายหลอดเลือดไตอย่างรวดเร็ว
      stage3:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด ไตที่เริ่มเสื่อมจะไม่สามารถขับโซเดียมส่วนเกินออกได้ ทำให้ตัวบวมและความดันพุ่งสูง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายสูงสุด เสี่ยงเกิดภาวะน้ำท่วมปอดเฉียบพลันจนต้องใส่ท่อช่วยหายใจฉุกเฉิน
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ไตไม่สามารถขับน้ำและเกลือได้แล้ว โซเดียมจะดึงน้ำคั่งในปอดและหัวใจวายฉับพลัน
  gout:
    reason: >-
      แม้สารไบคาร์บอเนตทางการแพทย์จะเคยถูกนำมาปรับปัสสาวะให้เป็นด่าง แต่ "ยาผงฟูหรืออีโนที่ซื้อทานเอง" มีโซเดียมสูงมาก ผู้ป่วยเกาต์ที่มีความดันโลหิตสูงหรือไตเสื่อมร่วมด้วยจึงห้ามใช้เพื่อลดกรดยูริกเองโดยเด็ดขาด
    tags:
      - โซเดียมสูงกระทบความดัน
      - ห้ามใช้ปรับด่างในปัสสาวะเอง
    stages:
      gout_remission:
        level: caution
        advice: หลีกเลี่ยงเนื่องจากโซเดียมสูงมาก หากมีอาการแน่นท้องควรใช้ยาขับลมกลุ่ม Simethicone หรือสมุนไพรขับลมแทน
      gout_flare:
        level: danger
        advice: ไม่ควรรับประทาน โซเดียมที่สูงส่งผลต่อการทำงานของไตและรบกวนการควบคุมความดันโลหิต
  cholecystectomy:
    reason: >-
      อาการแน่นท้องหลังตัดถุงน้ำดีเกิดจากน้ำดีย่อยไขมันไม่ทัน การทานยาผงฟูโซเดียมไบคาร์บอเนตทำให้เกิดแก๊สคาร์บอนไดออกไซด์ในกระเพาะอาหาร อาจทำให้เรอช่วงแรกแต่กระเพาะจะขยายตัวและแน่นท้องกว่าเดิม
    tags:
      - สร้างแก๊สในกระเพาะ
      - แน่นท้องมากกว่าเดิม
    stages:
      chole_recovery:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด แก๊สฟู่ในกระเพาะจะดันกระบังลมและแผลผ่าตัด ทำให้ปวดเกร็งแน่นท้องรุนแรง
      chole_maintenance:
        level: caution
        advice: ไม่แนะนำให้ใช้เป็นประจำ หากแน่นท้องควรแบ่งมื้ออาหารให้เล็กลงและหลีกเลี่ยงของมัน
