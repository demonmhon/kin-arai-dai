diseases:
  ckd:
    reason: >-
      พาราเซตามอล (Paracetamol) เป็นยาแก้ปวดลดไข้ทางเลือกแรกที่มีความปลอดภัยต่อไตมากที่สุด เพราะไม่ออกฤทธิ์ยับยั้งเอนไซม์ COX ในหลอดเลือดไตเหมือนกลุ่ม NSAIDs จึงไม่ทำให้หลอดเลือดไตหดตัว อย่างไรก็ตาม ยานี้ถูกขจัดและขับออกผ่านตับและไต ในผู้ป่วยโรคไตเรื้อรังควรรับประทานเฉพาะเมื่อมีอาการปวดหรือมีไข้จริงเท่านั้น ไม่ควรทานดักล่วงหน้า และต้องจำกัดขนาดยาสูงสุดไม่เกิน 2,000 - 3,000 มก./วัน (4-6 เม็ด/วัน สำหรับขนาด 500 มก.) หากไตทำงานลดลงมาก (ระยะ 4-5 หรือฟอกไต) ควรเว้นระยะห่างการทานเป็นทุก 6-8 ชั่วโมงแทนทุก 4 ชั่วโมงเพื่อป้องกันการสะสม
    tags:
      - ปลอดภัยต่อไตกว่า NSAIDs
      - จำกัดไม่เกิน 2,000-3,000 มก./วัน
      - เว้นระยะทาน 6-8 ชม. ในไตระยะท้าย
    stages:
      stage1_2:
        level: safe
        advice: ทานได้เมื่อมีอาการปวดหรือไข้ ครั้งละ 1 เม็ด (500 มก.) ห่างกันอย่างน้อย 4-6 ชั่วโมง ไม่เกินวันละ 6-8 เม็ด (3,000-4,000 มก.) และไม่ควรทานต่อเนื่องเกิน 5 วันโดยไม่ปรึกษาแพทย์
      stage3:
        level: safe
        advice: ทานได้เมื่อจำเป็น ครั้งละ 1 เม็ด (500 มก.) ห่างกันอย่างน้อย 6 ชั่วโมง จำกัดไม่เกินวันละ 4-6 เม็ด (2,000-3,000 มก.) เพื่อลดภาระการขจัดยาของไตและตับ
      stage4_5_pre:
        level: caution
        advice: ทานได้เฉพาะเมื่อมีอาการจริงเท่านั้น ปรับระยะห่างในการทานเป็นทุก 6-8 ชั่วโมง ขนาดยารวมไม่เกิน 2,000 มก./วัน (ไม่เกิน 4 เม็ด/วัน) และห้ามทานติดต่อกันหลายวัน
      dialysis:
        level: caution
        advice: ควรปรึกษาแพทย์หรือเภสัชกรประจำศูนย์ฟอกไต ขนาดยาแนะนำมักไม่เกินวันละ 2,000 มก. (เว้นห่าง 6-8 ชม.) สามารถขจัดออกทางฟอกเลือดได้บางส่วน
  gout:
    reason: >-
      พาราเซตามอลปลอดภัยสำหรับผู้ป่วยโรคเกาต์ ไม่รบกวนการขับกรดยูริกของไต และไม่มีผลเพิ่มระดับกรดยูริกในเลือด สามารถใช้บรรเทาอาการปวดเล็กน้อยถึงปานกลางได้ (แต่อาจระงับอาการปวดรุนแรงขณะข้ออักเสบเฉียบพลันได้ไม่ดีเท่ากลุ่มยาลดการอักเสบเฉพาะโรค)
    tags:
      - ไม่เพิ่มกรดยูริก
      - ปลอดภัยต่อไตในผู้ป่วยเกาต์
    stages:
      gout_remission:
        level: safe
        advice: สามารถใช้แก้ปวดทั่วไปหรือลดไข้ได้ตามขนาดมาตรฐาน ไม่รบกวนระดับกรดยูริกในเลือด
      gout_flare:
        level: caution
        advice: ช่วยบรรเทาปวดได้ระดับหนึ่ง แต่ไม่ลดการอักเสบของข้อ หากข้อบวมแดงร้อนรุนแรงควรใช้ยาตามที่แพทย์สั่งเฉพาะบุคคล (เช่น โคลชิซีน)
  cholecystectomy:
    reason: >-
      พาราเซตามอลไม่ระคายเคืองกระเพาะอาหารและทางเดินอาหาร ปลอดภัยสำหรับผู้ที่เพิ่งผ่าตัดถุงน้ำดี
    tags:
      - ไม่ระคายทางเดินอาหาร
      - ปลอดภัยหลังผ่าตัด
    stages:
      chole_recovery:
        level: safe
        advice: ทานแก้ปวดแผลผ่าตัดตามคำแนะนำของแพทย์ ครั้งละ 1 เม็ด ห่างกัน 4-6 ชั่วโมง
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติเมื่อมีอาการปวดหรือไข้
