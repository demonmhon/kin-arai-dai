diseases:
  ckd:
    reason: >-
      คลอร์เฟนิรามีน (CPM) เป็นยาต้านฮิสตามีนรุ่นที่ 1 (First-generation Antihistamine) ตัวยาไม่มีพิษทำลายเซลล์กรองไตโดยตรงเหมือนกลุ่ม NSAIDs จึงถือว่าค่อนข้างปลอดภัยต่อเนื้อเยื่อไต อย่างไรก็ตาม ยานี้มีฤทธิ์ต้านโคลิเนอร์จิก (Anticholinergic effect) สูง ทำให้เกิดอาการข้างเคียง เช่น ปากแห้ง คอแห้ง ตาพร่า ท้องผูก ง่วงซึมอย่างมาก และในผู้ป่วยโรคไตเรื้อรังโดยเฉพาะผู้สูงอายุหรือผู้มีต่อมลูกหมากโต อาจทำให้เกิดภาวะ "ปัสสาวะคั่ง (Urinary retention)" ปัสสาวะไม่ออก ซึ่งจะส่งผลให้แรงดันในกระเพาะปัสสาวะย้อนกลับไปทำลายไตได้ อีกทั้งในไตระยะรุนแรง การขจัดยาจะช้าลง ทำให้ง่วงซึมและทรงตัวไม่อยู่ เสี่ยงต่อการหกล้ม
    tags:
      - ปลอดภัยต่อเนื้อไต
      - ระวังปัสสาวะคั่งในผู้สูงอายุ
      - ระวังอาการง่วงซึมพลัดตกหกล้ม
    stages:
      stage1_2:
        level: safe
        advice: ทานได้เมื่อมีอาการแพ้หรือน้ำมูกไหล ครั้งละ 1 เม็ด (4 มก.) ทุก 4-6 ชั่วโมง ระวังอาการง่วงนอน ไม่ควรขับขี่ยานพาหนะ
      stage3:
        level: safe
        advice: ทานได้เมื่อมีอาการ ครั้งละ 1 เม็ด ทานก่อนนอนหรือทุก 6-8 ชั่วโมง ระวังอาการง่วงซึมและปัสสาวะลำบาก
      stage4_5_pre:
        level: caution
        advice: ควรปรับลดขนาดยาลง (เช่น ทานเฉพาะก่อนนอน) ระวังอาการง่วงซึมคั่งค้าง ปากแห้ง และปัสสาวะไม่ออก
      dialysis:
        level: caution
        advice: ใช้ด้วยความระมัดระวังในขนาดต่ำ ระวังอาการง่วงซึมสับสนและความดันโลหิตตกขณะลุกยืน
  gout:
    reason: >-
      CPM ไม่มีผลต่อระดับกรดยูริกในเลือดและไม่ทำลายไต ปลอดภัยในการใช้บรรเทาอาการภูมิแพ้หรือคันผิวหนังในผู้ป่วยโรคเกาต์
    tags:
      - ไม่กระทบกรดยูริก
      - ปลอดภัยต่อผู้ป่วยเกาต์
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามขนาดปกติเมื่อมีอาการแพ้หรือน้ำมูกไหล
      gout_flare:
        level: safe
        advice: ปลอดภัย สามารถใช้ได้ตามปกติ
  cholecystectomy:
    reason: >-
      ปลอดภัยสำหรับผู้ผ่าตัดถุงน้ำดี ไม่มีผลกระทบต่อระบบทางเดินอาหารหรือการย่อยไขมัน
    tags:
      - ปลอดภัยหลังผ่าตัด
    stages:
      chole_recovery:
        level: safe
        advice: ทานได้ตามปกติหากมีอาการแพ้หรือคัดจมูก
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติเมื่อมีอาการ
