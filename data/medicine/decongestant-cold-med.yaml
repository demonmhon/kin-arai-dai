diseases:
  ckd:
    reason: >-
      ยาแก้หวัดคัดจมูกหลายชนิดและยาแก้หวัดสูตรผสมมักมีตัวยาในกลุ่มลดอาการคัดจมูก (Decongestants) เช่น "ฟีนิลเอฟรีน (Phenylephrine)" หรือ "ซูโดอีเฟดรีน (Pseudoephedrine)" ซึ่งออกฤทธิ์กระตุ้นระบบประสาทซิมพาเทติก ทำให้หลอดเลือดทั่วร่างกายเกิดการหดเกร็งอย่างรุนแรง ส่งผลให้ 1. ความดันโลหิตพุ่งสูงขึ้นอย่างรวดเร็วและควบคุมได้ยาก 2. หลอดเลือดที่ไปเลี้ยงไต (Renal vasculature) ตีบแคบลง ทำให้เลือดไปกรองที่ไตลดลง อัตราการกรองของไตทรุดตัวลง และ 3. เพิ่มความเสี่ยงเกิดหลอดเลือดสมองแตก/ตีบและภาวะหัวใจเต้นผิดจังหวะในผู้ป่วยโรคไตที่มีหลอดเลือดเปราะบางอยู่แล้ว หากมีอาการคัดจมูก แนะนำให้ล้างจมูกด้วยน้ำเกลือปราศจากเชื้อ หรือใช้ยาแก้แพ้กลุ่ม Antihistamine แทน
    tags:
      - หลอดเลือดไตหดเกร็ง
      - ความดันโลหิตพุ่งสูงเฉียบพลัน
      - เลือดไปเลี้ยงไตลดลง
      - เสี่ยงเส้นเลือดสมอง/หัวใจ
    stages:
      stage1_2:
        level: caution
        advice: ควรระวังอย่างยิ่ง หากมีความดันโลหิตสูงร่วมด้วยควรหลีกเลี่ยง เพราะจะทำให้ความดันคุมไม่ได้ แนะนำให้ใช้น้ำเกลือล้างจมูกแทน
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด หลอดเลือดไตที่หดตัวจะทำให้การทำงานของไตตกวูบ และความดันโลหิตที่พุ่งสูงจะเร่งให้ไตเสื่อมเร็วขึ้น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานโดยเด็ดขาด อันตรายต่อหัวใจ หลอดเลือดสมอง และการไหลเวียนเลือดในไตขั้นวิกฤต
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ผู้ป่วยฟอกไตมีความดันโลหิตที่แปรปรวนง่ายอยู่แล้ว ยานี้อาจกระตุ้นให้ความดันสูงวิกฤตและเส้นเลือดสมองแตก
  gout:
    reason: >-
      ผู้ป่วยโรคเกาต์ส่วนใหญ่มักมีภาวะความดันโลหิตสูงและภาวะเมทาบอลิกซินโดรมร่วมด้วย ยาลดน้ำมูกกลุ่มนี้กระตุ้นให้หัวใจเต้นเร็วและความดันพุ่งสูง จึงต้องใช้ด้วยความระมัดระวังอย่างยิ่ง
    tags:
      - กระตุ้นความดันสูง
      - ควรปรึกษาแพทย์ก่อนใช้
    stages:
      gout_remission:
        level: caution
        advice: ระวังหากมีโรคความดันโลหิตสูงร่วมด้วย ไม่ควรทานติดต่อกันเกิน 3-5 วัน
      gout_flare:
        level: caution
        advice: หลีกเลี่ยงหากกำลังมีอาการอักเสบหรือใช้ยาหลายชนิดร่วมกัน ใช้วิธีล้างจมูกด้วยน้ำเกลือจะปลอดภัยกว่า
  cholecystectomy:
    reason: >-
      ตัวยาสามารถใช้บรรเทาอาการคัดจมูกได้ในระยะสั้น แต่ควรระวังอาการใจสั่น ความดันโลหิตสูง และนอนไม่หลับ
    tags:
      - ระวังใจสั่นนอนไม่หลับ
      - ทานระยะสั้นเท่านั้น
    stages:
      chole_recovery:
        level: caution
        advice: หลีกเลี่ยงในช่วงแรกหลังผ่าตัดเพื่อป้องกันอาการหัวใจเต้นเร็วหรือความดันโลหิตแปรปรวน
      chole_maintenance:
        level: safe
        advice: ใช้ได้ระยะสั้นตามคำแนะนำของเภสัชกร (ไม่เกิน 3-5 วัน)
