diseases:
  ckd:
    reason: พิซซ่า 1 ชิ้น รวมสารอาหารที่เป็นอันตรายต่อไตทุกด้าน ชีสมอสซาเรลล่ามีฟอสฟอรัสและโซเดียมสูงจัด ท็อปปิ้งเนื้อแปรรูป (เปปเปอโรนี ไส้กรอก เบคอน แฮม) มีสารฟอสเฟตสังเคราะห์ที่ร่างกายดูดซึมได้ 100% ซอสมะเขือเทศมีโพแทสเซียมและเกลือสูง และผงฟูในแป้งโดว์มีฟอสเฟต
    tags:
      - ฟอสเฟตสังเคราะห์ในเนื้อแปรรูป
      - ฟอสฟอรัสสูงจากชีส
      - โซเดียมสูงจัด
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง หากจำเป็นต้องทาน ให้เลือกแป้งบางกรอบ ไม่เพิ่มชีส เลี่ยงหน้าเนื้อสัตว์แปรรูป และทานไม่เกิน 1 ชิ้นเล็ก
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สารฟอสเฟตสังเคราะห์และโซเดียมสูงเกินกว่าที่ไตระยะ 3 จะขับออกได้ เสี่ยงฟอสเฟตในเลือดพุ่งสูง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด เร่งให้เกิดภาวะฟอสเฟตคั่ง หลอดเลือดหินปูนเกาะ และไตวายเร็วขึ้น
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด สารฟอสเฟตสังเคราะห์จากเนื้อแปรรูปและชีสกำจัดออกได้ยากมากในการฟอกเลือด เสี่ยงโรคหัวใจและหลอดเลือดอุดตัน
  gout:
    reason: หน้าเนื้อสัตว์แปรรูป (ไส้กรอก เปปเปอโรนี แฮม) มีพิวรีนสูงมาก อีกทั้งชีสและไขมันอิ่มตัวในแป้งพิซซ่าจะเข้าไปขัดขวางการขับกรดยูริกของไตทางปัสสาวะ
    tags:
      - พิวรีนสูงในเนื้อแปรรูป
      - ไขมันสูงชะลอการขับยูริก
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง หากอยากทานให้เลือกหน้าผักเห็ดชีสน้อย และดื่มน้ำตามมากๆ
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาด กระตุ้นให้อาการปวดบวมข้ออักเสบกำเริบรุนแรง
  cholecystectomy:
    reason: ชีสเข้มข้น น้ำมัน และเนื้อแปรรูปมีไขมันอิ่มตัวสูงมากเกินกว่าที่น้ำดีจากตับที่ไม่มีถุงน้ำดีจะย่อยได้หมดในคราวเดียว
    tags:
      - ชีสและไขมันสูงจัด
      - กระตุ้นท้องเสีย
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้แต่น้อย ไม่เกิน 1 ชิ้น เลี่ยงการสั่งเพิ่มชีส (Extra Cheese) หรือขอบชีส
      chole_recovery:
        level: danger
        advice: งดเด็ดขาดช่วง 1 เดือนแรก ไขมันสูงจัดจะทำให้เกิดอาการจุกแน่น ปวดมวนท้อง และท้องเสียฉับพลัน
