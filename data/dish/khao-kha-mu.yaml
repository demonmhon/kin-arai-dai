diseases:
  ckd:
    reason: ข้าวขาหมู 1 จาน มีโซเดียมสูงเฉลี่ย 1,200-1,800 มก. จากน้ำพะโล้เคี่ยวเค็มหวาน ซีอิ๊วดำ และผักกาดดองเกลือสูง หนังและมันหมูมีไขมันอิ่มตัวและคอเลสเตอรอลสูงมาก เร่งหลอดเลือดไตแข็งตัวและภาวะความดันโลหิตสูง
    tags:
      - โซเดียมสูงจัด
      - ไขมันอิ่มตัว
      - ผักกาดดองเกลือสูง
    stages:
      stage1_2:
        level: caution
        advice: ทานได้นานๆ ครั้ง สั่ง 'เนื้อล้วนไม่เอาหนัง' ไม่ราดน้ำพะโล้ชุ่ม และเลี่ยงผักกาดดอง
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง น้ำราดพะโล้และไขมันสัตว์จะเร่งความดันและเพิ่มภาระไตอย่างรวดเร็ว
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทาน โซเดียมและฟอสฟอรัสสูงเกินเกณฑ์ไตวายระยะวิกฤต เสี่ยงภาวะบวมน้ำ น้ำท่วมปอด
      dialysis:
        level: danger
        advice: ควรหลีกเลี่ยง โซเดียมสูงทำให้น้ำหนักตัวเพิ่มขึ้นผิดปกติระหว่างรอบฟอกไต และฟอสฟอรัสสูงสะสมในเลือด
  gout:
    reason: น้ำพะโล้เคี่ยวนานจากกระดูกและเนื้อหมูมีสารพิวรีนสะสมสูงมาก อีกทั้งไขมันอิ่มตัวเข้มข้นจากขาหมูจะยับยั้งการทำงานของท่อไตในการขับกรดยูริกออกจากกระแสเลือด
    tags:
      - พิวรีนในน้ำเคี่ยวนาน
      - ไขมันอิ่มตัวสูงขัดขวางยูริก
    stages:
      gout_remission:
        level: caution
        advice: หากต้องการทาน ต้องสั่งเนื้อแดงล้วน ไม่เอามัน ไม่เอาหนัง ไม่ตักน้ำพะโล้ราดข้าว และดื่มน้ำมากๆ
      gout_flare:
        level: danger
        advice: งดเด็ดขาด น้ำพะโล้เข้มข้นและไขมันสูงจะกระตุ้นการตกผลึกยูเรตในข้อทันที
