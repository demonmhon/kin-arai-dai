diseases:
  ckd:
    reason: แม้สลัดโรลจะถูกมองว่าเป็นอาหารสุขภาพ แต่สำหรับผู้มีภาวะโรคไตมีความเสี่ยงสำคัญ 2 ประการ คือ 1. ผักสดไฮโดรโปนิกส์ (กรีนโอ๊ค เรดโอ๊ค แครอท) ไม่ผ่านการต้มลวก จึงมีแร่ธาตุ "โพแทสเซียมสูงเต็ม 100%" (การต้มลวกช่วยลดโพแทสเซียมได้ 30-50%) 2. น้ำสลัดครีมซีฟู้ดหรือน้ำสลัดงา มีเกลือโซเดียมและน้ำตาลสูงจัด และไส้ปูอัดเป็นเนื้อปลาบดแปรรูปที่มีสารฟอสเฟตสังเคราะห์
    tags:
      - ผักสดโพแทสเซียมสูง
      - ระวังน้ำสลัดโซเดียมสูง
      - ปูอัดมีฟอสเฟตสังเคราะห์
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้ เลือกไส้อกไก่ฉีกหรือทูน่าในน้ำแร่ เลี่ยงไส้ปูอัดและไส้กรอก จิ้มน้ำสลัดเพียงเล็กน้อย (ไม่ราดชุ่ม)
      stage3:
        level: caution
        advice: ทานได้ในปริมาณจำกัด 3-4 คำ จิ้มน้ำสลัดแตะปลายเบาๆ เลี่ยงไส้แปรรูป และควรตรวจเช็กระดับโพแทสเซียมในเลือดสม่ำเสมอ
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยง ผักสดไม่ผ่านความร้อนมีโพแทสเซียมสูงมาก เสี่ยงต่อภาวะโพแทสเซียมในเลือดสูง (Hyperkalemia) ซึ่งอันตรายต่อหัวใจ แนะนำเปลี่ยนไปทานผักลวกสุกแทน
      dialysis:
        level: caution
        advice: ระวังเรื่องโพแทสเซียมจากผักสดและโซเดียมจากน้ำจิ้มสลัด หากระดับโพแทสเซียมในเลือดปกติ ทานได้ 3-4 คำโดยเลือกไส้อกไก่หรือไข่ต้ม
  gout:
    reason: ผักสลัดใบเขียว แครอท และแตงกวาในสลัดโรลมีสารพิวรีนต่ำมาก ปลอดภัยต่อผู้มีภาวะสุขภาพโรคเกาต์ แต่ควรเลือกไส้ที่มีพิวรีนต่ำ เช่น อกไก่ ทูน่า หรือไข่ต้ม เลี่ยงไส้กุ้ง หอย และระวังน้ำสลัดรสหวานจัดที่มีน้ำเชื่อมฟรุกโตส
    tags:
      - ผักสลัดพิวรีนต่ำมาก
      - เลือกไส้อกไก่หรือไข่ต้ม
      - ระวังน้ำสลัดรสหวานจัด
    stages:
      gout_remission:
        level: safe
        advice: รับประทานได้ปลอดภัย เป็นเมนูเพื่อสุขภาพที่ดี เลือกไส้อกไก่หรือทูน่า จิ้มน้ำสลัดในปริมาณพอเหมาะ
      gout_flare:
        level: safe
        advice: ทานได้ปลอดภัย ผักสดและแป้งข้าวมีพิวรีนต่ำมาก ช่วยเพิ่มกากใยและวิตามิน เลี่ยงไส้กุ้งหรืออาหารทะเล
  cholecystectomy:
    reason: ผักสดและแป้งห่อมีไขมันต่ำมาก แต่จุดที่ต้องระวังคือ "น้ำสลัดครีมข้น / ซีฟู้ดมายองเนส" ซึ่งทำจากไข่แดงและน้ำมันพืชในสัดส่วนสูง ไขมันปริมาณมากในน้ำสลัดจะกระตุ้นให้แน่นท้องและท้องเสียได้
    tags:
      - ระวังน้ำสลัดครีมไขมันสูง
      - ผักสดและแป้งย่อยง่าย
    stages:
      chole_maintenance:
        level: safe
        advice: รับประทานได้ตามปกติ แนะนำเลือกน้ำสลัดใสไขมันต่ำ หรือจิ้มน้ำสลัดครีมเพียงเล็กน้อย
      chole_recovery:
        level: caution
        advice: ช่วงพักฟื้นทานได้แต่ต้องเลี่ยงน้ำสลัดครีมข้นและมายองเนสเด็ดขาด หรือทานแบบไม่จิ้มน้ำสลัดมัน
