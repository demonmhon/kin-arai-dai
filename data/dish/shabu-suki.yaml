diseases:
  ckd:
    reason: หม้อไฟชาบูและสุกี้มีอันตรายซ่อนอยู่หลายด้าน เมื่อต้มเนื้อสัตว์ ผัก และเห็ดรวมกัน แร่ธาตุโพแทสเซียม ฟอสฟอรัส และพิวรีนจะละลายเข้มข้นลงในน้ำซุป น้ำจิ้มสุกี้ พอนสึ หรือน้ำจิ้มงา 1 ถ้วยเล็กมีโซเดียมสูงเกิน 800-1,200 มก. และลูกชิ้น เต้าหู้ปลา ไส้กรอก มีสารฟอสเฟตสังเคราะห์ที่ดูดซึม 100%
    tags:
      - ห้ามซดน้ำซุป
      - น้ำจิ้มโซเดียมสูงมาก
      - ฟอสเฟตในลูกชิ้น
    stages:
      stage1_2:
        level: caution
        advice: ทานได้แต่ต้องมีวินัย ห้ามซดน้ำซุปเด็ดขาด จิ้มน้ำจิ้มเพียงแตะเบาๆ เลือกเนื้อปลาสด อกไก่ ผักกาดขาว และเลี่ยงลูกชิ้นแปรรูป
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง เสี่ยงได้รับโพแทสเซียมและโซเดียมเกินขนาด หากไปทานต้องตักเฉพาะเนื้อสดและผักสะเด็ดน้ำ ไม่ซดน้ำซุป และไม่จิ้มน้ำจิ้มเยอะ
      stage4_5_pre:
        level: danger
        advice: ห้ามซดน้ำซุปเด็ดขาด อันตรายสูงสุดจากโพแทสเซียมและฟอสฟอรัสที่ละลายในน้ำต้ม อาจทำให้หัวใจเต้นผิดจังหวะและไตวายเฉียบพลัน
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โซเดียมสูงทำให้กระหายน้ำจัด ส่งผลให้น้ำหนักตัวเกินและน้ำท่วมปอด และโพแทสเซียมในน้ำซุปขับออกไม่ได้
  gout:
    reason: น้ำซุปชาบูและสุกี้คือ "แหล่งสกัดพิวรีนเข้มข้น" จากเนื้อสัตว์ กระดูกต้ม เห็ด และสัตว์ปีก ยิ่งต้มเคี่ยวนาน พิวรีนยิ่งสะสมสูงมาก ดื่มน้ำซุปเพียงถ้วยเดียวสามารถกระตุ้นให้ข้ออักเสบกำเริบทันที
    tags:
      - น้ำซุปพิวรีนเข้มข้นสูงสุด
      - สารพิวรีนละลายในน้ำต้ม
    stages:
      gout_remission:
        level: danger
        advice: เลี่ยงการทานหม้อไฟ หากร่วมโต๊ะ ห้ามซดน้ำซุปเด็ดขาด ทานเฉพาะเนื้อปลาหรือเต้าหู้ และดื่มน้ำเปล่าตามมากๆ อย่างน้อย 2-3 แก้ว
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ เป็นเมนูอันตรายอันดับต้นๆ ที่เร่งให้ยูริกในเลือดพุ่งสูง
  cholecystectomy:
    reason: เนื้อสไลซ์ติดมัน (สามชั้น เบคอน) และน้ำซุปมันเยิ้มจะกระตุ้นให้ลำไส้บีบตัวแรง ท้องอืด และท้องเสียเฉียบพลัน
    tags:
      - เลี่ยงเนื้อสัตว์ติดมัน
      - ไม่ซดน้ำซุปมัน
    stages:
      chole_maintenance:
        level: safe
        advice: ทานได้โดยเลือกเนื้อไม่ติดมัน (สันในไก่ เนื้อปลา) ทานผักสุก ไม่ซดน้ำซุปที่มีชั้นไขมันลอยหน้า
      chole_recovery:
        level: caution
        advice: ช่วงพักฟื้นควรเลือกต้มผักและเนื้อปลาล้วน เลี่ยงเนื้อสไลซ์ติดมันและน้ำจิ้มเผ็ดจัด
