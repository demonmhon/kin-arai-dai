diseases:
  ckd:
    reason: ข้าวมันหุงด้วยน้ำมันไก่มีไขมันอิ่มตัวสูง น้ำจิ้มเต้าเจี้ยวมีโซเดียมสูงจัดเฉลี่ย 800-1,200 มก. ต่อถ้วยเล็ก และน้ำซุปเคี่ยวกระดูกมีฟอสฟอรัสและโซเดียมละลายอยู่มาก หากจำเป็นต้องทาน แนะนำสั่ง 'เนื้ออกล้วนไม่เอาหนัง' เปลี่ยนเป็นข้าวสวยธรรมดา ไม่ซดน้ำซุป และตักน้ำจิ้มแตะเพียงเล็กน้อย
    tags:
      - โซเดียมสูงจากน้ำจิ้ม
      - ฟอสฟอรัสในน้ำซุป
      - ไขมันสูง
    stages:
      stage1_2:
        level: caution
        advice: ทานได้เป็นครั้งคราว เลือกเนื้ออกล้วน ลอกหนังออก หลีกเลี่ยงการซดน้ำซุป และตักน้ำจิ้มไม่เกิน 1 ช้อนชา
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง หากจำเป็นให้สั่งข้าวสวยธรรมดา อกไก่ฉีกไม่เอาหนัง ไม่ราดน้ำมัน ไม่ซดน้ำซุป และแตะน้ำจิ้มเพียงปลายช้อน
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยงเด็ดขาด โซเดียมในน้ำจิ้มและฟอสฟอรัสในน้ำซุปเกินเกณฑ์ความปลอดภัยของไตวายระยะท้ายอย่างมาก
      dialysis:
        level: caution
        advice: สั่งอกไก่ล้วนเพื่อเสริมโปรตีน แต่ต้องงดน้ำซุปเด็ดขาด และแตะน้ำจิ้มน้อยมากเพื่อคุมเกลือโซเดียมและน้ำ
  gout:
    reason: เนื้อไก่เป็นสัตว์ปีกที่มีสารพิวรีนปานกลางถึงสูง (130-150 มก./100 ก.) และน้ำซุปต้มโครงไก่เคี่ยวนานมีกรดยูริกละลายอยู่เข้มข้นที่สุด อีกทั้งไขมันจากข้าวมันจะขัดขวางการขับยูริกทางไต
    tags:
      - พิวรีนสูงในสัตว์ปีก
      - น้ำซุปกระดูกเคี่ยวนาน
      - ตัวกระตุ้นข้ออักเสบ
    stages:
      gout_remission:
        level: caution
        advice: ทานได้ปริมาณน้อย เลือกเฉพาะเนื้ออกไม่เอาหนัง งดซดน้ำซุปกระดูกไก่เด็ดขาด และดื่มน้ำตามมากๆ
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ ทั้งสัตว์ปีก น้ำซุปเคี่ยวกระดูก และเครื่องในไก่จะเร่งให้กรดยูริกในเลือดพุ่งสูงทันที
