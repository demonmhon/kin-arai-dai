diseases:
  ckd:
    reason: แฮมเบอร์เกอร์ฟาสต์ฟู้ด 1 ชิ้น มีโซเดียมสูงเฉลี่ย 800 - 1,500 มก. เนื้อเบอร์เกอร์เป็นเนื้อสัตว์แปรรูปบดผสมสารยึดเกาะและฟอสเฟตสังเคราะห์ แป้งขนมปังฟอกขาวมีฟอสฟอรัสสูง และชีสแผ่นมีทั้งเกลือโซเดียมและฟอสฟอรัสเข้มข้น ร่างกายดูดซึมสารฟอสเฟตเหล่านี้ได้อย่างรวดเร็ว ส่งผลร้ายต่อผู้ป่วยโรคไตโดยตรง
    tags:
      - ฟอสเฟตสังเคราะห์ในเนื้อแปรรูป
      - โซเดียมสูงจากชีสและซอส
      - ไขมันอิ่มตัว
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง หากจำเป็นต้องรับประทาน ให้สั่งไม่ใส่ชีส ไม่ใส่มายองเนส และลดซอสต่างๆ
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ฟอสฟอรัสสังเคราะห์และโซเดียมสูงเกินกว่าที่ไตระยะ 3 จะขับออกได้อย่างปลอดภัย
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด เร่งให้เกิดภาวะฟอสเฟตในเลือดสูง หลอดเลือดแข็งตัว และหัวใจล้มเหลว
      dialysis:
        level: danger
        advice: ห้ามรับประทาน ฟอสเฟตสังเคราะห์จากเนื้อบดแปรรูปและชีสกำจัดออกได้ยากมากในเครื่องฟอกไต
  gout:
    reason: เนื้อบดในเบอร์เกอร์มีสารพิวรีนปานกลางถึงสูง และชีสรวมถึงไขมันอิ่มตัวจะไปชะลอการขับถ่ายกรดยูริกของไต อีกทั้งซอสหวานและขนมปังแป้งขาวมีผลกระตุ้นระดับน้ำตาลและกรดยูริกในเลือด
    tags:
      - เนื้อแดงแปรรูปพิวรีนสูง
      - ไขมันชะลอการขับกรดยูริก
    stages:
      gout_remission:
        level: caution
        advice: ทานได้นานๆ ครั้ง แนะนำสั่งไม่ใส่ชีส ไม่ใส่เบคอน และดื่มน้ำสะอาดตามมากๆ
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ ไขมันอิ่มตัวสูงและเนื้อแปรรูปจะกระตุ้นให้ข้อปวดอักเสบต่อเนื่อง
