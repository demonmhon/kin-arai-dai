id: khao-niew-moo-ping
name: ข้าวเหนียวหมูปิ้ง (หมูปิ้งนมสด / หมูปิ้งโบราณ)
category: dish
categoryName: อาหารจานเดียว/ฟาสต์ฟู้ด
icon: 🍢
tags:
  - โซเดียมสูงจัดจากซอสหมัก
  - มันหมูแทรกและไขมันอิ่มตัวสูง
  - ฟอสเฟตสังเคราะห์ในนมข้นจืดและผงหมัก
  - รอยไหม้เกรียมจากการย่าง
keywords:
  - ข้าวเหนียวหมูปิ้ง
  - หมูปิ้ง
  - หมูปิ้งนมสด
  - ข้าวเหนียว
  - หมูปิ้งโบราณ
  - moo ping
  - sticky rice
  - อาหารเช้า
  - เนื้อหมูย่าง
sources:
