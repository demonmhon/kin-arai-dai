diseases:
  ckd:
    reason: หมูปิ้งตามท้องตลาด โดยเฉพาะหมูปิ้งนมสด มักใช้เนื้อหมูติดมันและมันหมูแข็งแทรก มีโซเดียมสูงจัดมากจากการหมักด้วยซีอิ๊วขาว ซอสหอยนางรม และผงชูรส (หมูปิ้งเพียง 1 ไม้ มีโซเดียม 250 - 400 มก. หากทานชุดละ 3-4 ไม้ โซเดียมจะสูงเกิน 1,200 มก.) นอกจากนี้ นมข้นจืดและผงหมักสำเร็จรูปมักมีสารฟอสเฟตสังเคราะห์ที่ดูดซึมได้ 100% และรอยไหม้เกรียมทำลายหลอดเลือดไต
    tags:
      - โซเดียมสูงจัดจากซอสหมัก
      - ฟอสเฟตสังเคราะห์ในผงหมักและนม
      - รอยไหม้เกรียม
    stages:
      stage1_2:
        level: caution
        advice: ทานได้นานๆ ครั้ง ไม่เกิน 1-2 ไม้ เลือกไม้ที่ไม่ติดมันเยิ้ม ตัดส่วนที่ไหม้เกรียมทิ้ง และทานข้าวเหนียวเพียงครึ่งห่อ
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง โซเดียมและฟอสเฟตสังเคราะห์ในเนื้อหมักจะเร่งให้ความดันโลหิตสูงและค่าไตเสื่อมลงเร็วขึ้น
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด โซเดียมปริมาณมหาศาลทำให้เกิดภาวะบวมน้ำ น้ำท่วมปอด และฟอสเฟตในเลือดสูงวิกฤต
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด โซเดียมสูงทำให้กระหายน้ำจัด ควบคุมน้ำหนักระหว่างรอบฟอกไตได้ยาก และฟอสเฟตสังเคราะห์กำจัดออกได้ยาก
  gout:
    reason: เนื้อหมูมีสารพิวรีนระดับปานกลาง แต่หมูปิ้งมีสัดส่วนของไขมันอิ่มตัว (มันหมู) และน้ำตาลปี๊บสูงมาก ซึ่งไขมันในกระแสเลือดจะไปขัดขวางการทำงานของไตในการขับกรดยูริก ทำให้กรดยูริกคั่งและตกผลึกตามข้อได้ง่าย
    tags:
      - ไขมันสูงชะลอการขับยูริก
      - มีน้ำตาลปี๊บสูง
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย ไม่เกิน 1-2 ไม้ เลือกเนื้อล้วน เลี่ยงส่วนมันหมู และดื่มน้ำตามมากๆ
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ ไขมันสัตว์และรสหวานเค็มจัดกระตุ้นการอักเสบของข้อ
  cholecystectomy:
    reason: หมูปิ้งนมสดมีไขมันสัตว์อิ่มตัวและนมข้นจืดแทรกอยู่ปริมาณมาก ผู้ที่ไม่มีถุงน้ำดีกักเก็บน้ำดีเข้มข้นจะไม่สามารถย่อยไขมันก้อนใหญ่ได้ทัน
    tags:
      - ไขมันสัตว์อิ่มตัวสูง
      - กระตุ้นท้องร่วง
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้แต่น้อย ตัดส่วนมันหมูออก ทานพร้อมข้าวเหนียวหรือผักสด ไม่ทานตอนท้องว่าง
      chole_recovery:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงพักฟื้น 1 เดือนแรก ไขมันหมูปิ้งจะทำให้เกิดอาการจุกเสียด แน่นท้อง และท้องเสียเฉียบพลัน
