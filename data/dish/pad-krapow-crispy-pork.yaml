diseases:
  ckd:
    reason: กะเพราหมูกรอบไข่ดาวเป็นเมนูที่อันตรายที่สุดเมนูหนึ่งสำหรับผู้ป่วยโรคไต โซเดียมใน 1 จานสูงเกิน 1,500 - 2,000 มก. จากซอสหอยนางรม ซีอิ๊วขาว น้ำปลา และผงชูรส หมูกรอบผ่านการต้ม ทอดน้ำมันท่วม และมักหมักด้วยผงฟู/เกลือ ทำให้ฟอสเฟตสังเคราะห์และไขมันอิ่มตัวสูงจัด เร่งให้ไตเสื่อมสภาพอย่างรวดเร็ว
    tags:
      - โซเดียมวิกฤต
      - ฟอสเฟตสังเคราะห์
      - ไขมันอิ่มตัวสูงจัด
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง หากอยากทานกะเพรา ให้เปลี่ยนเป็น 'กะเพราอกไก่' หรือ 'กะเพราหมูชิ้นไม่ติดมัน' สั่งปรุงรสอ่อน ไม่ใส่ผงชูรส
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด หมูกรอบและไข่ดาวทอดกรอบมีทั้งฟอสฟอรัส ไขมัน และโซเดียมเกินขีดจำกัด
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด มีความเสี่ยงสูงต่อความดันโลหิตพุ่งสูง น้ำท่วมปอด และฟอสเฟตคั่งในเลือด
      dialysis:
        level: danger
        advice: ห้ามรับประทาน ฟอสฟอรัสในผงฟูหมูกรอบและไข่แดงจะสะสมในกระแสเลือด ยาจับฟอสเฟตไม่สามารถกำจัดได้ทัน
  gout:
    reason: หมูกรอบมีไขมันอิ่มตัวสูงจัดซึ่งจะไปขัดขวางการขับถ่ายกรดยูริกของไตอย่างรุนแรง และเนื้อหมูติดมันมีพิวรีนปานกลาง-สูง อีกทั้งเครื่องปรุงรสเค็มจัดทำให้ไตทำงานหนัก
    tags:
      - ไขมันอิ่มตัวสูงจัด
      - ขัดขวางการขับกรดยูริก
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง ไขมันจากหมูกรอบและไข่ดาวทอดน้ำมันท่วมทำให้กรดยูริกสะสมในร่างกายได้ง่าย
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาด ไขมันสูงจะทำให้ข้อที่อักเสบปวดบวมรุนแรงและหายช้าลง
