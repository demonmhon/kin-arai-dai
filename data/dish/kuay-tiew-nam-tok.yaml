diseases:
  ckd:
    reason: ก๋วยเตี๋ยวน้ำตกหรือก๋วยเตี๋ยวเรือ 1 ชาม มีปริมาณโซเดียมสูงถึง 2,000 - 3,000 มก. เกินโควตาที่ร่างกายควรได้รับต่อวันในมื้อเดียว น้ำซุปเคี่ยวสมุนไพรและเครื่องปรุงเข้มข้น เลือดสดหมู/วัวมีฟอสฟอรัสและธาตุเหล็กสูง และลูกชิ้นแปรรูปใส่สารฟอสเฟตสังเคราะห์ ผู้มีภาวะโรคไตที่ทานก๋วยเตี๋ยวน้ำตกและซดน้ำซุป เสี่ยงต่อภาวะน้ำท่วมปอดและความดันโลหิตสูงเฉียบพลัน
    tags:
      - โซเดียมสูงเกิน 2500 มก.
      - ฟอสฟอรัสในเลือดและลูกชิ้น
      - อันตรายจากน้ำซุป
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง หากจะทานต้องสั่ง 'ก๋วยเตี๋ยวแห้ง' ไม่ใส่ลูกชิ้น ไม่ปรุงน้ำปลา/ซีอิ๊วเพิ่ม และห้ามซดน้ำซุปเด็ดขาด
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด น้ำตกมีโซเดียมและฟอสฟอรัสสูงเกินเกณฑ์ไตระยะ 3 มาก
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด มีอันตรายถึงชีวิตจากภาวะน้ำท่วมปอดและหัวใจล้มเหลวจากโซเดียมส่วนเกิน
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด โซเดียมทำให้น้ำหนักเพิ่มขึ้นรุนแรงและเกิดภาวะบวมน้ำวิกฤต
  gout:
    reason: น้ำซุปก๋วยเตี๋ยวเรือเคี่ยวจากกระดูกหมู/วัวเป็นเวลานานจนกรดยูริกและพิวรีนละลายออกมาเข้มข้นสูงสุด อีกทั้งการใส่เลือดสดและเครื่องในสัตว์ทำให้มีสารพิวรีนสูงมาก เป็นเมนูเสี่ยงสูงสุดอันดับต้นๆ ของโรคเกาต์
    tags:
      - น้ำซุปเคี่ยวนานพิวรีนสูงสุด
      - เลือดสดและเครื่องใน
      - เสี่ยงกำเริบฉับพลัน
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง หากจำเป็นต้องทาน ให้สั่งก๋วยเตี๋ยวแห้งน้ำใส สั่งเนื้อหมูสดชิ้น ไม่ใส่เครื่องใน และไม่ซดน้ำซุป
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาด เลือดสดและน้ำซุปเคี่ยวเข้มข้นจะกระตุ้นข้ออักเสบให้ปวดรุนแรงทันที
