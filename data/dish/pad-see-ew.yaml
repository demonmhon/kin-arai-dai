diseases:
  ckd:
    reason: ผัดซีอิ๊วใช้ซีอิ๊วดำหวาน ซีอิ๊วขาว และซอสปรุงรส ทำให้โซเดียมสูงเฉลี่ย 1,000 - 1,400 มก. ต่อจาน ผักคะน้าเป็นผักใบเขียวที่มีโพแทสเซียมสูง หากผู้ป่วยไตระยะท้ายทานผักคะน้าผัดสดๆ อาจได้รับโพแทสเซียมเกินเกณฑ์ และการผัดใช้น้ำมันค่อนข้างมาก
    tags:
      - ซีอิ๊วโซเดียมสูง
      - โพแทสเซียมในคะน้า
      - น้ำมันผัด
    stages:
      stage1_2:
        level: caution
        advice: ทานได้บ้าง สั่งแม่ค้าลดซีอิ๊วลงครึ่งหนึ่ง ไม่ปรุงน้ำปลาหรือพริกน้ำส้มเพิ่ม และไม่ควรทานบ่อย
      stage3:
        level: caution
        advice: สั่งรสอ่อนมาก ใช้น้ำมันน้อย สั่งผักกาดขาวแทนคะน้าเพื่อลดโพแทสเซียม และไม่ปรุงเครื่องปรุงเพิ่ม
      stage4_5_pre:
        level: danger
        advice: ควรหลีกเลี่ยง เส้นใหญ่ผัดซีอิ๊วมีทั้งโซเดียมและโพแทสเซียมสูงจากผักคะน้า ซึ่งเสี่ยงต่อภาวะโพแทสเซียมคั่งในเลือด
      dialysis:
        level: caution
        advice: สั่งหมูไม่ติดมันเพื่อเสริมโปรตีน แต่ต้องให้ลวกผักคะน้าก่อนนำมาผัดเพื่อลดโพแทสเซียม และไม่ปรุงเค็ม
  gout:
    reason: ผัดซีอิ๊วหมูชิ้นมีพิวรีนในระดับปานกลาง ปลอดภัยกว่าเมนูก๋วยเตี๋ยวน้ำที่เคี่ยวน้ำซุปกระดูก แต่ควรระวังหากเลือกเป็นไก่หรือใส่ไข่หลายฟอง และระวังน้ำมันที่ใช้ผัดไม่ให้เยิ้มเกินไป
    tags:
      - พิวรีนปานกลาง
      - ปลอดภัยกว่าก๋วยเตี๋ยวน้ำ
    stages:
      gout_remission:
        level: safe
        advice: ทานได้พอเหมาะ แนะนำเลือกเนื้อหมูไม่ติดมันแทนไก่ สั่งไม่มันเยิ้ม และดื่มน้ำตามให้เพียงพอ
      gout_flare:
        level: caution
        advice: ทานได้แต่น้อย ควรเลี่ยงเนื้อไก่ ให้ทานเป็นมังสวิรัติหรือใส่ไข่ขาวแทนเพื่อลดพิวรีน
