diseases:
  ckd:
    reason: นักเก็ตไก่ฟาสต์ฟู้ดทำจากเนื้อไก่บดผสมแป้งและสารฟอสเฟตสังเคราะห์ (Phosphate additives) เพื่อรักษาความชุ่มฉ่ำและเนื้อสัมผัสเด้ง ซึ่งร่างกายดูดซึมสารฟอสเฟตชนิดนี้ได้ 100% เต็ม มีโซเดียมสูงมากทั้งในเนื้อบด แป้งชุบทอด และน้ำจิ้มบาร์บีคิว/ชีสดิป อีกทั้งน้ำมันทอดความร้อนสูงทำให้เกิดไขมันทรานส์ทำลายหลอดเลือดไต
    tags:
      - ฟอสเฟตสังเคราะห์ดูดซึม 100%
      - โซเดียมสูงจัด
      - ไขมันทรานส์
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง มีสารฟอสเฟตสังเคราะห์และโซเดียมสูง หากจำเป็นต้องทาน ทานไม่เกิน 1-2 ชิ้น ลอกแป้งทอดกรอบออก และไม่จิ้มซอส
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด สารฟอสเฟตสังเคราะห์จะทำให้ฟอสฟอรัสในเลือดสูงเกิน ไตไม่สามารถขับออกได้ทัน เร่งโรคกระดูกพรุนและหลอดเลือดแข็ง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด อันตรายสูงสุดจากฟอสเฟตคั่งและภาวะความดันโลหิตสูง
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด สารฟอสเฟตจากเนื้อสัตว์แปรรูปบดกรองออกได้ยากมากในเครื่องฟอกไต เสี่ยงโรคหัวใจและหลอดเลือด
  gout:
    reason: เนื้อไก่เป็นสัตว์ปีกที่มีสารพิวรีนสูงตามธรรมชาติ และการทอดน้ำมันท่วมทำให้มีไขมันสูงจัด ซึ่งไขมันจะไปขัดขวางการขับถ่ายกรดยูริกออกจากไตทางปัสสาวะ
    tags:
      - สัตว์ปีกพิวรีนสูง
      - ไขมันขัดขวางการขับยูริก
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง เป็นอาหารทอดที่ทั้งมีพิวรีนและไขมันสูงที่กระตุ้นให้ยูริกคั่ง
      gout_flare:
        level: danger
        advice: ห้ามรับประทานเด็ดขาดช่วงข้ออักเสบ ป้องกันอาการปวด บวม แดง รุนแรง
  cholecystectomy:
    reason: แป้งชุบเกล็ดขนมปังทอดอมน้ำมันปริมาณมาก ทำให้มีไขมันอิ่มตัวสูงเกินกว่าระบบย่อยอาหารที่ไม่มีถุงน้ำดีจะย่อยได้ทัน
    tags:
      - ของทอดอมน้ำมัน
      - ย่อยยาก
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้แต่น้อย ไม่เกิน 2 ชิ้น และซับน้ำมันออกให้มากที่สุด
      chole_recovery:
        level: danger
        advice: งดเด็ดขาดช่วง 1 เดือนแรก ของทอดน้ำมันท่วมจะกระตุ้นให้ลำไส้บีบตัวรุนแรง ท้องเสียและปวดเกร็งช่องท้อง
