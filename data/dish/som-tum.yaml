diseases:
  ckd:
    reason: ส้มตำเป็นเมนูที่มีโซเดียมสูงที่สุดในบรรดาอาหารไทย จานเดียวอาจมีโซเดียมพุ่งสูงถึง 1,500 - 2,500 มก. จากน้ำปลา น้ำปลาร้า ผงชูรส และกุ้งแห้ง นอกจากนี้มะเขือเทศ ถั่วฝักยาวมีโพแทสเซียมสูง ถั่วลิสงมีฟอสฟอรัสสูง ผู้มีภาวะโรคไตแทบทุกระยะจึงควรระวังเป็นพิเศษ
    tags:
      - โซเดียมวิกฤต
      - โพแทสเซียมสูง
      - ฟอสฟอรัสจากถั่ว
    stages:
      stage1_2:
        level: caution
        advice: สั่งส้มตำไทย ไม่ใส่กุ้งแห้ง ลดน้ำปลา ไม่ใส่ผงชูรส เลี่ยงการตักน้ำส้มตำก้นครกทาน
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง โดยเฉพาะตำปลาร้า หากอยากทานให้ทานตำไทยรสอ่อนมาก ไม่ซดน้ำ และทานแต่น้อย
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โซเดียมจากเครื่องปรุงและโพแทสเซียมจากมะเขือเทศเสี่ยงทำให้หัวใจเต้นผิดจังหวะและไตวายเฉียบพลัน
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด เสี่ยงต่อภาวะโพแทสเซียมในเลือดสูงวิกฤต และโซเดียมทำให้กระหายน้ำจนบวมน้ำ
  gout:
    reason: ส้มตำปูปลาร้าใช้ปลาร้าหมักและกุ้งแห้งซึ่งเป็นแหล่งพิวรีนสูงมาก อีกทั้งน้ำตาลปี๊บและผงปรุงรสรสหวานจัดกระตุ้นให้ตับสร้างกรดยูริกเพิ่มขึ้น
    tags:
      - กุ้งแห้งพิวรีนสูง
      - ปลาร้าหมักยีสต์
    stages:
      gout_remission:
        level: caution
        advice: แนะนำเลือกส้มตำไทยไม่ใส่กุ้งแห้ง ไม่ใส่ถั่วลิสงเยอะ และไม่ควรทานตำปลาร้า
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดทั้งตำปลาร้าและตำใส่กุ้งแห้ง อาหารหมักดองและกุ้งแห้งจะกระตุ้นการอักเสบของข้อ
