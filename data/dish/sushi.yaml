diseases:
  ckd:
    reason: ข้าวซูชิปรุงรสด้วยน้ำส้มสายชู เกลือ และน้ำตาล จึงมีโซเดียมและคาร์โบไฮเดรตแฝงสูง ซอสโชยุมีโซเดียมเข้มข้นมาก (1 ช้อนชา มีโซเดียม 300-400 มก.) สาหร่ายห่อมีโพแทสเซียมและไอโอดีนสูง นอกจากนี้เนื้อปลาดิบสดมีความเสี่ยงต่อการติดเชื้อในผู้มีภาวะไตเรื้อรังที่มีภูมิคุ้มกันต่ำ
    tags:
      - โชยุโซเดียมสูงจัด
      - โซเดียมในข้าวซูชิ
      - สาหร่ายโพแทสเซียมสูง
    stages:
      stage1_2:
        level: caution
        advice: ทานได้นานๆ ครั้ง ไม่เกิน 4-5 คำ แตะโชยุเพียงเล็กน้อยหรือไม่จิ้มเลย เลี่ยงหน้าไข่กุ้ง ไข่ปลา และสาหร่ายแผ่นหนา
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง ข้าวปรุงรสและซีอิ๊วโชยุมีโซเดียมสูงมาก ทำให้ความดันโลหิตสูงและไตทำงานหนักเกินเกณฑ์
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โซเดียมสูงทำให้บวมน้ำและหัวใจวาย ปลาดิบมีความเสี่ยงติดเชื้อรุนแรงในผู้มีภาวะไตวาย
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด โซเดียมจากโชยุและข้าวทำให้กระหายน้ำมาก ดื่มน้ำเกินพิกัดจนเสี่ยงน้ำท่วมปอดฉับพลัน
  gout:
    reason: หน้าซูชิส่วนใหญ่เป็นอาหารทะเล (ปลาแซลมอน ทูน่า กุ้ง ปลาหมึก ไข่ปลา) ซึ่งมีพิวรีนระดับปานกลางถึงสูง และซอสถั่วเหลืองหมักมีโซเดียมสูงซึ่งขัดขวางการขับกรดยูริกของไต
    tags:
      - พิวรีนจากอาหารทะเล
      - โซเดียมขัดขวางขับยูริก
    stages:
      gout_remission:
        level: caution
        advice: ทานได้พอเหมาะ เลือกหน้าปลาเนื้อขาวปรุงสุก เช่น ปลากะพง ไม่จิ้มโชยุมากเกินไป เลี่ยงหน้าไข่ปลาและหอย
      gout_flare:
        level: danger
        advice: งดรับประทานช่วงข้ออักเสบ อาหารทะเลดิบและซอสหมักกระตุ้นให้ระดับยูริกพุ่งสูง
  cholecystectomy:
    reason: ซูชิทั่วไปไขมันต่ำ แต่ควรระวังซูชิหน้ามายองเนส ชีสเบิร์น หรือของทอดเทมปุระโรล ซึ่งมีไขมันสูง
    tags:
      - เลี่ยงหน้ามายองเนสชีส
    stages:
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติ แนะนำเลือกหน้าปลาสดแบบดั้งเดิม เลี่ยงโรลที่ราดมายองเนสเยิ้มหรือไส้เทมปุระทอด
      chole_recovery:
        level: caution
        advice: ควรทานแบบปลาปรุงสุกย่อยง่าย ทานแต่พออิ่ม และเลี่ยงหน้าที่มีมายองเนสหรือซอสครีมมัน
