diseases:
  ckd:
    reason: ตัวข้าวโจ๊กเป็นคาร์โบไฮเดรตย่อยง่ายและโพแทสเซียมต่ำ แต่จุดอันตรายอยู่ที่ "น้ำซุปต้มเคี่ยว ซีอิ๊ว และหมูสับเด้ง" โจ๊ก 1 ชามทั่วไปมีโซเดียมสูงถึง 800 - 1,200 มก. หากใส่หมูก้อนเด้งมักผสมสารฟอสเฟตสังเคราะห์ สำหรับการเลือกไข่ "ไข่ขาว" ถือเป็นโปรตีนคุณภาพดีเยี่ยมที่สุด แต่ผู้มีภาวะไตระยะ 3-5 ที่ฟอสฟอรัสในเลือดสูงควรเลี่ยง "ไข่แดง" และงดเครื่องใน (ตับ, ไส้), ไข่เค็ม, ไข่เยี่ยวม้า และปาท่องโก๋ตัวเล็กโดยเด็ดขาด
    tags:
      - โซเดียมในน้ำซุปและซีอิ๊ว
      - สั่งไม่ใส่ผงชูรส/ซีอิ๊วเพิ่ม
      - ไข่ขาวปลอดภัย
    stages:
      stage1_2:
        level: safe
        advice: รับประทานได้ สั่ง "ไม่เค็ม ไม่เหยาะซีอิ๊วเพิ่ม ไม่ใส่ผงปรุงรส ไม่ใส่เครื่องใน" เลือกหมูสับธรรมดาหรือไก่ฉีก ใส่ไข่ลวกได้ตามปกติ เลี่ยงปาท่องโก๋กรอบ
      stage3:
        level: caution
        advice: สั่งโจ๊กน้ำใสไม่เค็ม ทานเฉพาะเนื้อโจ๊กด้านบนไม่ซดน้ำก้นชาม เลือกไข่ขาวล้วน (เลี่ยงไข่แดงหากฟอสฟอรัสสูง) เลี่ยงหมูเด้งแปรรูปและเครื่องใน
      stage4_5_pre:
        level: caution
        advice: สั่ง "ข้าวโจ๊กกับไข่ขาวต้มสุกล้วน ไม่ใส่หมูเด้ง ไม่ใส่เครื่องใน ไม่เหยาะซีอิ๊วหรือซอสปรุงรสใดๆ" เพื่อควบคุมทั้งโปรตีน โซเดียม และฟอสฟอรัส
      dialysis:
        level: safe
        advice: เป็นเมนูแนะนำสำหรับผู้ที่อยู่ในระยะฟอกไต สั่ง "โจ๊กใส่ไข่ขาว 2 ฟอง เนื้อไก่ฉีก ไม่ใส่เครื่องใน ไม่เค็ม" ช่วยเสริมโปรตีนอัลบูมินฟื้นฟูร่างกายได้ดีมาก
  gout:
    reason: โจ๊กหมูสับและโจ๊กไข่ขาวมีพิวรีนในเกณฑ์ปลอดภัย แต่สิ่งที่ผู้มีภาวะเกาต์ต้องหลีกเลี่ยงเด็ดขาดคือ "เครื่องในสัตว์ (ตับ ไส้ เซี่ยงจี้)" และน้ำต้มกระดูกเข้มข้น ส่วนโจ๊กไก่จะมีพิวรีนสูงกว่าโจ๊กหมูและไข่ขาวเล็กน้อย
    tags:
      - ห้ามใส่เครื่องในสัตว์
      - โจ๊กไข่ขาวพิวรีนต่ำสุด
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ปลอดภัย แนะนำสั่งโจ๊กหมูสับหรือใส่ไข่ ไม่ใส่เครื่องใน (ตับ ไส้) เด็ดขาด และไม่โรยปาท่องโก๋ทอดอมน้ำมัน
      gout_flare:
        level: caution
        advice: ช่วงข้ออักเสบกำเริบ แนะนำสั่ง "โจ๊กข้าวต้มใส่เฉพาะไข่ขาว" งดเนื้อหมู ไก่ เครื่องใน และน้ำซุปกระดูกเคี่ยวเข้มข้น
  cholecystectomy:
    reason: โจ๊กเป็นอาหารอ่อนย่อยง่าย เหมาะอย่างยิ่งสำหรับผู้ที่ผ่าตัดถุงน้ำดี แต่ต้องเลือกเนื้อไม่ติดมัน เลี่ยงหมูสับติดมันเยิ้ม ไม่ใส่เครื่องใน และงดปาท่องโก๋ทอด
    tags:
      - อาหารอ่อนย่อยง่าย
      - เลี่ยงปาท่องโก๋ทอด
    stages:
      chole_maintenance:
        level: safe
        advice: ทานได้ตามปกติ เป็นอาหารเช้าย่อยง่าย ดีต่อกระเพาะและลำไส้ เลี่ยงปาท่องโก๋ทอดน้ำมัน
      chole_recovery:
        level: safe
        advice: แนะนำเป็นอาหารหลักช่วงพักฟื้นหลังผ่าตัด สั่งโจ๊กเนื้อไก่ฉีกหรือไข่ขาวล้วน ร่างกายดูดซึมง่าย ไม่ทำให้แน่นท้อง
