diseases:
  ckd:
    reason: ไก่ทอดกรอบฟาสต์ฟู้ดเป็นอันตรายต่อไตอย่างยิ่ง แป้งชุบทอดและผงหมักสำเร็จรูปมีการใส่สารฟอสเฟตสังเคราะห์ (Phosphate additives) เพื่อให้กรอบฟู ซึ่งร่างกายดูดซึมได้ 100% เต็ม อีกทั้งยังมีเกลือโซเดียมสูงมาก และน้ำมันทอดที่ผ่านความร้อนสูงทำให้เกิดไขมันทรานส์ ทำลายหลอดเลือดฝอยในไต
    tags:
      - ฟอสเฟตสังเคราะห์ดูดซึม 100%
      - โซเดียมสูงจัด
      - ไขมันทอดซ้ำ
    stages:
      stage1_2:
        level: danger
        advice: ควรหลีกเลี่ยง หากจำเป็นต้องทาน ให้ลอกแป้งทอดกรอบและหนังออกจนหมด ทานเฉพาะเนื้อด้านใน และไม่จิ้มซอส
      stage3:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ฟอสเฟตสังเคราะห์ในแป้งทอดจะกระตุ้นให้ฟอสฟอรัสในเลือดสูง และเร่งโรคกระดูกพรุน
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด มีอันตรายสูงมากจากฟอสเฟตคั่งและภาวะความดันโลหิตสูง
      dialysis:
        level: danger
        advice: ห้ามรับประทาน แป้งทอดฟอสเฟตสังเคราะห์กำจัดออกได้ยากมากในการฟอกเลือด เสี่ยงหลอดเลือดหัวใจอุดตัน
  gout:
    reason: สัตว์ปีกมีสารพิวรีนสูงโดยธรรมชาติ และการนำไปทอดด้วยน้ำมันท่วมทำให้มีไขมันสูงมาก ซึ่งไขมันจะเข้าไปยับยั้งการทำงานของไตในการขับกรดยูริกออกจากร่างกาย ทำให้กรดยูริกคั่งและตกผลึกตามข้อได้รวดเร็ว
    tags:
      - สัตว์ปีกพิวรีนสูง
      - ไขมันสูงขัดขวางการขับยูริก
      - ตัวกระตุ้นเกาต์กำเริบ
    stages:
      gout_remission:
        level: danger
        advice: ควรหลีกเลี่ยง หรือทานได้ไม่เกิน 1 ชิ้นเล็ก ลอกหนังและแป้งทอดออก ดื่มน้ำตามมากๆ อย่างน้อย 2-3 แก้ว
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ เป็นอาหารกลุ่มเสี่ยงสูงสุดที่กระตุ้นให้ปวดบวมรุนแรง
