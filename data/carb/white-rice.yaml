  - ย่อยง่าย
keywords:
  - ข้าวขาว
  - ข้าวสวย
  - เส้นเล็ก
  - เส้นใหญ่
  - ก๋วยเตี๋ยว
  - แป้ง
sources:
  - name: ฝ่ายโภชนาการ ศิริราชพยาบาล
    url: https://www.si.mahidol.ac.th/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: การขัดสีเอาเปลือกออกทำให้ฟอสฟอรัสและโพแทสเซียมลดลงมาก ปลอดภัยต่อไตมากกว่าข้าวกล้อง
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามปกติ
      stage3:
        level: safe
        advice: ทานได้มื้อละ 1-2 ทัพพี
      stage4_5_pre:
        level: safe
        advice: ทานได้มื้อละ 1-2 ทัพพี (ดีกว่าข้าวกล้อง)
      dialysis:
        level: safe
        advice: ทานได้ตามความต้องการพลังงาน
  gout:
    reason: ข้าวขาวผ่านการขัดสีจนมีสารพิวรีนต่ำมาก ไม่กระตุ้นการสังเคราะห์กรดยูริกในเลือด เป็นแหล่งพลังงานหลักที่ปลอดภัย
    tags:
      - พิวรีนต่ำมาก
      - ปลอดภัยสำหรับเกาต์
      - พลังงานหลัก
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามปกติ มื้อละ 1-2 ทัพพี
      gout_flare:
        level: safe
        advice: ทานได้ตามปกติ เป็นแหล่งพลังงานที่ปลอดภัยที่สุดช่วงปวดข้อ
