category: carb
categoryName: ข้าว-แป้ง
icon: 🍥
tags:
  - โซเดียมสูงจัด
  - ฟอสเฟตสังเคราะห์
  - อันตราย
keywords:
  - บะหมี่กึ่งสำเร็จรูป
  - มาม่า
  - ไวไว
  - ยำยำ
  - บะหมี่ซอง
sources:
  - name: โรงพยาบาลพระรามเก้า (บทความอาหารผู้ป่วยโรคไตวายเรื้อรัง)
    url: https://praram9.com/th/articles/food-for-ckd-patients
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ผงปรุงรสมีโซเดียมสูงมากในซองเดียว และเส้นมักผสมสารฟอสเฟตเพื่อความเหนียวนุ่ม ซึ่งร่างกายดูดซึมได้เกือบทั้งหมด
    stages:
      stage1_2:
        level: caution
        advice: ทานได้นานๆ ครั้ง ใช้ผงปรุงรสน้อยกว่าครึ่งซอง
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง โซเดียมสูงเกินไป
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทาน
      dialysis:
        level: danger
        advice: ห้ามรับประทาน เสี่ยงบวมน้ำและฟอสเฟตพุ่ง
  gout:
    reason: เส้นบะหมี่ทอดและผงปรุงรสมีสารสกัดเนื้อสัตว์ ผงชูรส และโซเดียมสูงมาก ซึ่งโซเดียมขัดขวางการขับกรดยูริกของไต
    tags:
      - ผงซุปสกัดเข้มข้น
      - โซเดียมสูง
      - ลดการขับยูริก
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย ไม่เกินสัปดาห์ละ 1 ซอง และเลี่ยงการซดน้ำซุป
      gout_flare:
        level: danger
        advice: งดเด็ดขาดช่วงข้ออักเสบ ผงซุปเข้มข้นและเกลือโซเดียมกระตุ้นให้ยูริกคั่ง
