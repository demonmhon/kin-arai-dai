id: glass-noodle
name: วุ้นเส้น / ก๋วยเตี๋ยวเซี่ยงไฮ้
category: carb
categoryName: ข้าว-แป้ง
icon: 🍜
tags:
  - แป้งปลอดโปรตีน (Protein-Free)
  - ฟอสฟอรัสต่ำมาก
  - ให้พลังงานสะอาด
keywords:
  - วุ้นเส้น
  - เส้นเซี่ยงไฮ้
  - แป้งปลอดโปรตีน
  - ก๋วยเตี๋ยว
  - แป้ง
sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: เป็นแป้งปลอดโปรตีน ให้พลังงานแก่ร่างกายโดยไม่สร้างของเสียยูเรีย เหมาะที่สุดสำหรับผู้มีภาวะไตที่ต้องจำกัดโปรตีนแต่ต้องการพลังงานไม่ให้น้ำหนักลด
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ดี
      stage3:
        level: safe
        advice: แนะนำสลับกับข้าวสวย
      stage4_5_pre:
        level: safe
        advice: 🌟 ดีเยี่ยม! ทานเป็นพลังงานหลักเพื่อไม่ให้น้ำหนักลดลง
      dialysis:
        level: safe
        advice: ทานได้ดีร่วมกับไข่ขาว
  gout:
    reason: วุ้นเส้นทำจากแป้งถั่วเขียวที่ผ่านกระบวนการสกัดโปรตีนออกจนหมด จึงแทบไม่มีสารพิวรีนหลงเหลือ ปลอดภัยสูง
    tags:
      - พิวรีนต่ำมาก
      - ปลอดโปรตีน
      - ปลอดภัย
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามปกติ นำมาปรุงยำ แกงจืด หรือผัดผัก
      gout_flare:
        level: safe
        advice: ทานได้ตามปกติ ปราศจากพิวรีน ไม่กระตุ้นข้ออักเสบ
