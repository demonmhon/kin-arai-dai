      dialysis:
        level: safe
        advice: ทานได้พอเหมาะ
  gout:
    reason: เม็ดสาคูเป็นคาร์โบไฮเดรตบริสุทธิ์จากแป้งมันสำปะหลัง มีพิวรีนต่ำมาก แต่ควรระวังน้ำเชื่อมหวานจัดเพราะฟรุกโตสกระตุ้นยูริก
    tags:
      - พิวรีนต่ำมาก
      - ระวังความหวาน
    stages:
      gout_remission:
        level: safe
        advice: ทานได้พอเหมาะ เลี่ยงการเติมน้ำเชื่อมหรือกะทิหวานจัด
      gout_flare:
        level: safe
        advice: ทานได้ แต่ไม่ควรปรุงรสหวานจัด
