diseases:
  ckd:
    reason: ครัวซองต์ทำจากแป้งสาลีรีดสลับชั้นกับเนยสดในสัดส่วนสูงถึง 30-40% ของน้ำหนัก ทำให้มีไขมันอิ่มตัวสูงจัด กระบวนการอบขนมเบเกอรี่มักใช้ผงฟูหรือสารเสริมคุณภาพแป้ง (Baking powder / Emulsifiers) ซึ่งมีสารฟอสเฟตสังเคราะห์ที่ดูดซึมเข้าสู่กระแสเลือดได้เต็มที่ และมีเกลือโซเดียมปรุงรส
    tags:
      - ฟอสเฟตสังเคราะห์ในเบเกอรี่
      - ไขมันอิ่มตัวสูงมาก
      - โซเดียมจากเนย
    stages:
      stage1_2:
        level: caution
        advice: รับประทานได้นานๆ ครั้ง ไม่เกิน 1 ชิ้นเล็ก เลี่ยงครัวซองต์ไส้ครีม ช็อกโกแลต หรืออัลมอนด์
      stage3:
        level: danger
        advice: ควรหลีกเลี่ยง สารฟอสเฟตสังเคราะห์และไขมันอิ่มตัวทำให้หลอดเลือดไตแข็งตัวและระดับฟอสฟอรัสในเลือดสูง
      stage4_5_pre:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด มีสารฟอสเฟตสังเคราะห์สะสม ส่งผลให้เกิดภาวะแคลเซียมเกาะหลอดเลือดและหัวใจวาย
      dialysis:
        level: danger
        advice: ห้ามรับประทานเด็ดขาด ฟอสเฟตสังเคราะห์จากเบเกอรี่กำจัดออกได้ยากในการฟอกไต
  gout:
    reason: ครัวซองต์มีปริมาณไขมันจากเนยสดสูงมาก ซึ่งไขมันในกระแสเลือดจะเข้าไปชะลอกระบวนการขับถ่ายกรดยูริกของไต ทำให้กรดยูริกคั่งสะสมในเลือดสูงขึ้น
    tags:
      - ไขมันสูงชะลอการขับยูริก
      - เบเกอรี่เนยสด
    stages:
      gout_remission:
        level: caution
        advice: ทานแต่น้อย นานๆ ครั้ง ชิ้นเล็ก และดื่มน้ำสะอาดตามมากๆ เพื่อช่วยไตขับของเสีย
      gout_flare:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงข้ออักเสบ ไขมันเนยสดจะทำให้การอักเสบและอาการปวดยืดเยื้อ
  cholecystectomy:
    reason: ครัวซองต์คือหนึ่งในอาหารที่มีสัดส่วนไขมันสูงที่สุดในกลุ่มเบเกอรี่ การไม่มีถุงน้ำดีกักเก็บน้ำดีเข้มข้น ทำให้ไม่สามารถย่อยก้อนไขมันเนยจำนวนมากพร้อมกันได้
    tags:
      - ไขมันเนยสูงจัด
      - ตัวกระตุ้นท้องเสียเฉียบพลัน
    stages:
      chole_maintenance:
        level: caution
        advice: ทานได้ปริมาณน้อย (ครึ่งชิ้น) ไม่ควรทานตอนท้องว่างหรือทานเป็นมื้อใหญ่ เพื่อป้องกันอาการแน่นท้อง จุกเสียด
      chole_recovery:
        level: danger
        advice: งดรับประทานเด็ดขาดช่วงพักฟื้น 1 เดือนแรก ไขมันเนยที่ย่อยไม่หมดจะกระตุ้นให้เกิดอาการท้องร่วงรุนแรง (Bile acid diarrhea) ทันที
