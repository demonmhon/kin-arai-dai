id: brown-rice
name: ข้าวกล้อง / ขนมปังโฮลวีต / ข้าวไรซ์เบอร์รี่
category: carb
categoryName: ข้าว-แป้ง
icon: 🍞
tags:
  - ฟอสฟอรัสสูงมาก
  - โพแทสเซียมสูง
  - เยื่อหุ้มเมล็ด
keywords:
  - ข้าวกล้อง
  - โฮลวีต
  - ข้าวไรซ์เบอร์รี่
  - ธัญพืช
  - ข้าวโอ๊ต
  - ขนมปัง
sources:
  - name: โรงพยาบาลรามาธิบดี
    url: https://www.rama.mahidol.ac.th/ramachannel/
  - name: สมาคมรูมาติสซั่มแห่งประเทศไทย
    url: https://thairheumatology.org/
diseases:
  ckd:
    reason: ตรงข้ามกับคนปกติ! เยื่อหุ้มเมล็ดและรำข้าวมีฟอสฟอรัสและโพแทสเซียมสูงมาก ไตเสื่อมขับไม่ได้ จะสะสมจนกระดูกบางและหลอดเลือดตีบ
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ ช่วยคุมเบาหวาน (แต่ควรตรวจเลือดดูฟอสฟอรัสประจำ)
      stage3:
        level: caution
        advice: เริ่มลดปริมาณ และสลับเป็นข้าวขาว
      stage4_5_pre:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด ฟอสฟอรัสสะสมทำลายหลอดเลือดและกระดูก
      dialysis:
        level: danger
        advice: หลีกเลี่ยงเด็ดขาด
  gout:
    reason: ข้าวกล้องมีสารพิวรีนจากจมูกข้าวและรำข้าวเล็กน้อย (ประมาณ 30-40 มก./100 ก.) ช่วงปกติทานได้ดีเพราะใยอาหารช่วยชะลอการดูดซึมสารอาหาร
    tags:
      - พิวรีนต่ำ-ปานกลาง
      - กากใยสูง
    stages:
      gout_remission:
        level: safe
        advice: ทานได้ตามปกติ มื้อละ 1-2 ทัพพี ใยอาหารสูงช่วยสุขภาพโดยรวม
      gout_flare:
        level: caution
        advice: ช่วงกำเริบควรสลับทานข้าวขาวเพื่อลดภาระพิวรีนจากจมูกข้าว
