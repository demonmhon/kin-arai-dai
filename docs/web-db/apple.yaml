# ==========================================================================
# 1 ไฟล์ = 1 วัตถุดิบ เก็บที่ /data/<หมวดเริ่มต้น>/<id>.yaml
# โฟลเดอร์ (kidney/, diabetes/, ...) แค่ช่วยจัดระเบียบตอน browse โค้ด
# ตัวที่กำหนดว่าวัตถุดิบนี้เกี่ยวกับโรคอะไรจริงๆ คือ key ใต้ `diseases:` ด้านล่าง
# ==========================================================================

id: apple
name: "แอปเปิ้ล (เขียว/แดง)"
category: fruit
categoryName: ผลไม้
icon: "🍎"
imageUrl: /images/foods/apple.jpg
imageCredit: "Photo by Tom Hermans on Unsplash (CC0/Free License)"

tags:
  - โพแทสเซียมต่ำ
  - กากใยสูง
  - มีเพคติน

keywords:
  - แอปเปิ้ล
  - apple
  - ผลไม้
  - ผลไม้โพแทสเซียมต่ำ
  - ของว่าง
  - ของหวาน

sources:
  - name: สมาคมโรคไตแห่งประเทศไทย
    url: https://www.nephrothai.org/

# ---------------------------------------------------------------------
# diseases: key เปิดอิสระ ใส่ได้กี่โรคก็ได้ ไม่ต้องแก้ build script
# แต่ละโรคมี `stages` ของตัวเอง ไม่จำเป็นต้องใช้ชื่อ stage เดียวกันข้ามโรค
# (โรคไตใช้ stage1_2/stage3/... ส่วนโรคที่ไม่มีระยะย่อยใช้ key "general" ก็ได้)
# ---------------------------------------------------------------------
diseases:
  kidney:
    reason: >
      โพแทสเซียมต่ำมาก (ประมาณ 100-120 มก./ผล) มีสารเพคตินช่วยลดระดับคอเลสเตอรอลในเลือด
      ปลอดภัยต่อไตทุกระยะ
    stages:
      stage1_2:
        level: safe
        advice: ทานได้ตามปกติ 1-2 ผล/วัน
      stage3:
        level: safe
        advice: ทานได้วันละ 1 ผลขนาดกลาง
      stage4_5_pre:
        level: safe
        advice: ทานได้วันละ 1/2 - 1 ผล ควรปอกเปลือก
      dialysis:
        level: safe
        advice: ทานได้วันละ 1/2 - 1 ผล ระวังเรื่องน้ำในผลไม้

  # ตัวอย่างการเพิ่มโรคที่สอง ในไฟล์เดียวกัน - ไม่กระทบข้อมูลโรคไตด้านบนเลย
  diabetes:
    reason: >
      ดัชนีน้ำตาล (GI) ต่ำ-ปานกลาง และมีกากใยช่วยชะลอการดูดซึมน้ำตาลเข้าสู่กระแสเลือด
      เหมาะเป็นผลไม้ทดแทนของหวาน
    stages:
      general:
        level: safe
        advice: ทานได้วันละ 1 ผลขนาดกลาง แทนของหวานหลังมื้ออาหาร ไม่ควรทานเป็นน้ำคั้น
